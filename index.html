<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dino Game</title>

<style>
html, body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    font-family: Arial, sans-serif;
}

#startButton {
    padding: 18px 38px;
    border: 2px solid #222;
    border-radius: 8px;
    background: #fff;
    color: #222;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
}

#startButton:hover {
    background: #222;
    color: #fff;
}
</style>
</head>

<body>

<button id="startButton">START IN ABOUT:BLANK</button>

<script>
"use strict";

if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
}

document.getElementById("startButton").addEventListener("click", () => {

    const win = window.open("about:blank", "_blank");

    if (!win) {
        alert("Popup blocked. Allow popups for this site.");
        return;
    }

    const html = `<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dino</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: white;
}

canvas {
    display: block;
    width: min(900px, 96vw);
    height: 300px;
    image-rendering: pixelated;
}

#game {
    position: relative;
}

#hint {
    position: fixed;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    color: #777;
    font: 14px Arial;
}
</style>
</head>

<body>

<div id="game">
<canvas id="canvas" width="900" height="300"></canvas>
</div>

<div id="hint">SPACE / ↑ / TAP TO JUMP</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

ctx.imageSmoothingEnabled = false;

const W = canvas.width;
const H = canvas.height;

const groundY = 260;

let gameRunning = true;
let gameOver = false;

let score = 0;
let highScore = Number(localStorage.getItem("dinoHighScore") || 0);

let speed = 6;

let dino = {
    x: 85,
    y: groundY - 68,
    width: 58,
    height: 68,
    velocityY: 0,
    jumping: false
};

const GRAVITY = 0.62;
const JUMP_FORCE = -15.5;

let obstacles = [];
let clouds = [];

let obstacleTimer = 0;
let cloudTimer = 0;

let lastTime = performance.now();


/* ==============================
   PIXEL DRAWING
============================== */

function rect(x, y, w, h, color = "#222") {
    ctx.fillStyle = color;
    ctx.fillRect(
        Math.round(x),
        Math.round(y),
        Math.round(w),
        Math.round(h)
    );
}


/* ==============================
   DRAW DINO
============================== */

function drawDino() {

    const x = dino.x;
    const y = dino.y;

    const c = "#222";

    /*
       Tail
    */

    rect(x + 2, y + 42, 15, 8, c);
    rect(x - 4, y + 35, 10, 8, c);
    rect(x - 10, y + 29, 9, 7, c);

    /*
       Body
    */

    rect(x + 14, y + 28, 35, 30, c);

    /*
       Back
    */

    rect(x + 20, y + 20, 25, 12, c);

    /*
       Neck
    */

    rect(x + 36, y + 15, 17, 27, c);

    /*
       Head
    */

    rect(x + 38, y + 4, 25, 27, c);

    /*
       Snout
    */

    rect(x + 56, y + 16, 15, 12, c);
    rect(x + 63, y + 21, 9, 7, c);

    /*
       Eye
    */

    rect(x + 53, y + 9, 5, 5, "#fff");

    /*
       Mouth
    */

    rect(x + 59, y + 26, 10, 2, "#fff");

    /*
       Arm
    */

    rect(x + 27, y + 39, 17, 6, c);
    rect(x + 21, y + 43, 10, 5, c);

    /*
       Back spikes
    */

    rect(x + 16, y + 18, 6, 6, c);
    rect(x + 22, y + 13, 6, 7, c);
    rect(x + 29, y + 10, 6, 7, c);

    /*
       Legs
    */

    rect(x + 19, y + 54, 9, 14, c);
    rect(x + 38, y + 53, 9, 15, c);

    /*
       Feet
    */

    rect(x + 14, y + 65, 16, 4, c);
    rect(x + 35, y + 65, 17, 4, c);

    /*
       Small body highlight
    */

    rect(x + 17, y + 33, 5, 14, "#333");
}


/* ==============================
   DRAW CACTUS
============================== */

function drawCactus(cactus) {

    const x = cactus.x;
    const y = groundY - cactus.height;

    const c = "#222";

    if (cactus.type === 1) {

        /*
           Large cactus
        */

        rect(x + 15, y, 18, cactus.height, c);

        /*
           Left arm
        */

        rect(x + 2, y + 29, 18, 8, c);
        rect(x + 2, y + 18, 8, 20, c);

        /*
           Right arm
        */

        rect(x + 30, y + 40, 19, 8, c);
        rect(x + 41, y + 28, 8, 20, c);

        /*
           Rounded-looking tips
        */

        rect(x + 5, y + 15, 5, 7, c);
        rect(x + 42, y + 25, 6, 7, c);

    } else {

        /*
           Small cactus
        */

        rect(x + 9, y + 8, 14, cactus.height - 8, c);

        rect(x, y + 27, 12, 7, c);
        rect(x, y + 18, 7, 16, c);

        rect(x + 20, y + 34, 12, 7, c);
        rect(x + 26, y + 25, 7, 16, c);
    }
}


/* ==============================
   CREATE CACTUS
============================== */

function createObstacle() {

    const large = Math.random() > 0.28;

    obstacles.push({
        x: W + 30,
        width: large ? 50 : 34,
        height: large ? 72 : 50,
        type: large ? 1 : 2
    });
}


/* ==============================
   DRAW CLOUD
============================== */

function drawCloud(cloud) {

    ctx.fillStyle = "#eee";

    ctx.beginPath();

    ctx.arc(cloud.x + 18, cloud.y + 14, 13, 0, Math.PI * 2);
    ctx.arc(cloud.x + 35, cloud.y + 9, 17, 0, Math.PI * 2);
    ctx.arc(cloud.x + 52, cloud.y + 15, 12, 0, Math.PI * 2);

    ctx.fill();

    rect(
        cloud.x + 10,
        cloud.y + 13,
        50,
        15,
        "#eee"
    );
}


/* ==============================
   COLLISION
============================== */

function checkCollision(cactus) {

    /*
       Deliberately smaller than the
       visible Dino.

       This removes the unfair
       invisible hitbox.
    */

    const dinoBox = {
        left: dino.x + 19,
        right: dino.x + 59,
        top: dino.y + 16,
        bottom: dino.y + 68
    };

    const cactusBox = {
        left: cactus.x + 7,
        right: cactus.x + cactus.width - 7,
        top: groundY - cactus.height + 5,
        bottom: groundY
    };

    return (
        dinoBox.left < cactusBox.right &&
        dinoBox.right > cactusBox.left &&
        dinoBox.top < cactusBox.bottom &&
        dinoBox.bottom > cactusBox.top
    );
}


/* ==============================
   JUMP
============================== */

function jump() {

    if (gameOver) {
        restart();
        return;
    }

    if (!dino.jumping) {

        dino.velocityY = JUMP_FORCE;
        dino.jumping = true;
    }
}


/* ==============================
   UPDATE
============================== */

function update(dt) {

    if (gameOver) {
        return;
    }

    /*
       Dino physics
    */

    dino.y += dino.velocityY * dt;
    dino.velocityY += GRAVITY * dt;

    const floor = groundY - dino.height;

    if (dino.y >= floor) {

        dino.y = floor;
        dino.velocityY = 0;
        dino.jumping = false;
    }


    /*
       Obstacles
    */

    for (let i = obstacles.length - 1; i >= 0; i--) {

        const cactus = obstacles[i];

        cactus.x -= speed * dt;

        if (checkCollision(cactus)) {
            endGame();
            return;
        }

        if (cactus.x < -100) {

            obstacles.splice(i, 1);

            score++;

            if (score > highScore) {

                highScore = score;

                localStorage.setItem(
                    "dinoHighScore",
                    highScore
                );
            }

            if (score % 10 === 0) {
                speed += 0.2;
            }
        }
    }


    /*
       Clouds
    */

    for (let i = clouds.length - 1; i >= 0; i--) {

        clouds[i].x -= 1.2 * dt;

        if (clouds[i].x < -100) {
            clouds.splice(i, 1);
        }
    }


    /*
       Spawn obstacles
    */

    obstacleTimer -= dt * 16.67;

    if (obstacleTimer <= 0) {

        createObstacle();

        obstacleTimer =
            900 + Math.random() * 700;
    }


    /*
       Spawn clouds
    */

    cloudTimer -= dt * 16.67;

    if (cloudTimer <= 0) {

        clouds.push({
            x: W + 30,
            y: 45 + Math.random() * 90
        });

        cloudTimer =
            2200 + Math.random() * 2500;
    }
}


/* ==============================
   DRAW
============================== */

function draw() {

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    /*
       Sky
    */

    ctx.fillStyle = "#fff";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
       Clouds
    */

    for (const cloud of clouds) {
        drawCloud(cloud);
    }


    /*
       Ground
    */

    rect(
        0,
        groundY,
        W,
        3,
        "#222"
    );


    /*
       Tiny ground marks
    */

    for (
        let x = 0;
        x < W;
        x += 80
    ) {

        rect(
            x + 20,
            groundY + 9,
            18,
            2,
            "#ddd"
        );
    }


    /*
       Cactuses
    */

    for (const cactus of obstacles) {
        drawCactus(cactus);
    }


    /*
       Dino
    */

    drawDino();


    /*
       Score
    */

    ctx.font = "18px monospace";
    ctx.fillStyle = "#333";

    ctx.textAlign = "left";

    ctx.fillText(
        "HI " +
        String(highScore).padStart(5, "0"),
        20,
        28
    );

    ctx.textAlign = "right";

    ctx.fillText(
        String(score).padStart(5, "0"),
        W - 20,
        28
    );


    /*
       Game over
    */

    if (gameOver) {

        ctx.fillStyle =
            "rgba(255,255,255,0.94)";

        ctx.fillRect(
            0,
            0,
            W,
            H
        );

        ctx.textAlign = "center";

        ctx.fillStyle = "#222";

        ctx.font =
            "bold 34px Arial";

        ctx.fillText(
            "GAME OVER",
            W / 2,
            125
        );

        ctx.font =
            "16px Arial";

        ctx.fillStyle = "#555";

        ctx.fillText(
            "Press SPACE or tap to restart",
            W / 2,
            155
        );

        ctx.strokeStyle = "#222";
        ctx.lineWidth = 2;

        ctx.strokeRect(
            W / 2 - 55,
            175,
            110,
            40
        );

        ctx.fillStyle = "#222";

        ctx.font =
            "16px Arial";

        ctx.fillText(
            "RESTART",
            W / 2,
            201
        );
    }
}


/* ==============================
   GAME LOOP
============================== */

function loop(time) {

    let dt =
        (time - lastTime) / 16.67;

    lastTime = time;

    /*
       Prevent huge jumps after
       switching tabs.
    */

    dt = Math.min(dt, 2);

    update(dt);

    draw();

    requestAnimationFrame(loop);
}


/* ==============================
   GAME OVER
============================== */

function endGame() {

    gameOver = true;
}


/* ==============================
   RESTART
============================== */

function restart() {

    obstacles = [];
    clouds = [];

    score = 0;

    speed = 6;

    dino.y =
        groundY - dino.height;

    dino.velocityY = 0;
    dino.jumping = false;

    gameOver = false;

    obstacleTimer = 500;
    cloudTimer = 500;
}


/* ==============================
   INPUT
============================== */

document.addEventListener("keydown", event => {

    if (
        event.code === "Space" ||
        event.code === "ArrowUp"
    ) {

        event.preventDefault();

        jump();
    }
});


canvas.addEventListener("pointerdown", () => {

    jump();
});


/* ==============================
   START
============================== */

restart();

requestAnimationFrame(loop);

<\/script>

</body>
</html>`;

    win.document.open();
    win.document.write(html);
    win.document.close();
    win.focus();
});
</script>

</body>
</html>
