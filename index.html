<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dino Launcher</title>

<style>
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: white;
    font-family: Arial, sans-serif;
}

#launch {
    padding: 18px 38px;
    border: 2px solid #222;
    border-radius: 8px;
    background: white;
    color: #222;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
}

#launch:hover {
    background: #222;
    color: white;
}
</style>
</head>

<body>

<button id="launch">
    START IN ABOUT:BLANK
</button>

<script>

document.getElementById("launch").onclick = function () {

    const w = window.open("about:blank", "_blank");

    if (!w) {
        alert("Please allow popups for this site.");
        return;
    }

    w.document.open();

    w.document.write(`

<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Dino</title>

<style>

html,
body {

    width: 100%;
    height: 100%;

    margin: 0;

    overflow: hidden;

    background: white;

}

body {

    display: flex;

    align-items: center;

    justify-content: center;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}

#game {

    position: relative;

    width: 900px;

    height: 300px;

}

canvas {

    display: block;

    width: 900px;

    height: 300px;

}

</style>

</head>


<body>


<div id="game">

<canvas
    id="canvas">
</canvas>

</div>


<script>

/* =========================================
   CANVAS
========================================= */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");


/*
   IMPORTANT:

   The canvas is displayed at 900x300,
   but internally rendered at the screen's
   pixel density.

   This keeps ALL TEXT sharp.
*/

const WIDTH = 900;
const HEIGHT = 300;

const dpr =
    Math.max(
        1,
        window.devicePixelRatio || 1
    );


canvas.width =
    WIDTH * dpr;

canvas.height =
    HEIGHT * dpr;


canvas.style.width =
    WIDTH + "px";

canvas.style.height =
    HEIGHT + "px";


ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
);


/* =========================================
   SETTINGS
========================================= */

const GROUND = 255;


/*
   Lower jump.

   The previous version allowed
   the Dino to travel too high.

   This reaches roughly 120px above
   the ground.
*/

const JUMP_POWER = 12.5;

const GRAVITY = 0.62;


/* =========================================
   GAME VARIABLES
========================================= */

let dino = {

    x: 90,

    y: GROUND - 75,

    velocity: 0,

    jumping: false

};


let obstacles = [];

let clouds = [];

let score = 0;

let highScore =
    Number(
        localStorage.getItem(
            "dinoHighScore"
        ) || 0
    );


let speed = 6;

let obstacleTimer = 700;

let cloudTimer = 1200;

let dead = false;

let lastTime =
    performance.now();


/* =========================================
   DRAW RECTANGLE
========================================= */

function rect(
    x,
    y,
    width,
    height,
    color
) {

    ctx.fillStyle = color;

    ctx.fillRect(
        Math.round(x),
        Math.round(y),
        width,
        height
    );
}


/* =========================================
   DINO
========================================= */

function drawDino() {

    const x = dino.x;
    const y = dino.y;

    const c = "#222";


    /*
       Tail
    */

    rect(
        x - 7,
        y + 38,
        14,
        8,
        c
    );

    rect(
        x - 15,
        y + 31,
        13,
        8,
        c
    );

    rect(
        x - 21,
        y + 25,
        10,
        7,
        c
    );


    /*
       Body
    */

    rect(
        x + 6,
        y + 28,
        41,
        37,
        c
    );


    /*
       Back spikes
    */

    rect(
        x + 8,
        y + 22,
        8,
        8,
        c
    );

    rect(
        x + 18,
        y + 17,
        8,
        10,
        c
    );

    rect(
        x + 28,
        y + 13,
        8,
        14,
        c
    );


    /*
       Neck
    */

    rect(
        x + 35,
        y + 13,
        19,
        32,
        c
    );


    /*
       Head
    */

    rect(
        x + 38,
        y + 3,
        30,
        29,
        c
    );


    /*
       Snout
    */

    rect(
        x + 58,
        y + 16,
        19,
        13,
        c
    );

    rect(
        x + 67,
        y + 21,
        10,
        8,
        c
    );


    /*
       Eye
    */

    rect(
        x + 56,
        y + 8,
        5,
        5,
        "#fff"
    );


    /*
       Mouth
    */

    rect(
        x + 62,
        y + 27,
        12,
        2,
        "#fff"
    );


    /*
       Arm
    */

    rect(
        x + 25,
        y + 40,
        18,
        7,
        c
    );

    rect(
        x + 19,
        y + 44,
        10,
        6,
        c
    );


    /*
       Legs
    */

    rect(
        x + 12,
        y + 58,
        10,
        17,
        c
    );

    rect(
        x + 35,
        y + 57,
        10,
        18,
        c
    );


    /*
       Feet
    */

    rect(
        x + 7,
        y + 70,
        18,
        5,
        c
    );

    rect(
        x + 31,
        y + 70,
        19,
        5,
        c
    );
}


/* =========================================
   LARGE CACTUS
========================================= */

function drawLargeCactus(cactus) {

    const x =
        cactus.x;

    const y =
        GROUND - 78;

    const c =
        "#222";


    /*
       Main stem
    */

    rect(
        x + 18,
        y,
        20,
        78,
        c
    );


    /*
       Left arm
    */

    rect(
        x + 2,
        y + 36,
        22,
        9,
        c
    );

    rect(
        x + 2,
        y + 23,
        9,
        22,
        c
    );


    /*
       Right arm
    */

    rect(
        x + 34,
        y + 43,
        24,
        9,
        c
    );

    rect(
        x + 49,
        y + 29,
        9,
        23,
        c
    );
}


/* =========================================
   SMALL CACTUS
========================================= */

function drawSmallCactus(cactus) {

    const x =
        cactus.x;

    const y =
        GROUND - 54;

    const c =
        "#222";


    rect(
        x + 11,
        y,
        14,
        54,
        c
    );


    /*
       Left arm
    */

    rect(
        x,
        y + 27,
        15,
        8,
        c
    );

    rect(
        x,
        y + 18,
        8,
        17,
        c
    );


    /*
       Right arm
    */

    rect(
        x + 21,
        y + 34,
        16,
        8,
        c
    );

    rect(
        x + 29,
        y + 24,
        8,
        18,
        c
    );
}


/* =========================================
   CLOUD
========================================= */

function drawCloud(cloud) {

    ctx.fillStyle =
        "#ededed";

    ctx.beginPath();

    ctx.arc(
        cloud.x + 15,
        cloud.y + 14,
        12,
        0,
        Math.PI * 2
    );

    ctx.arc(
        cloud.x + 33,
        cloud.y + 9,
        17,
        0,
        Math.PI * 2
    );

    ctx.arc(
        cloud.x + 52,
        cloud.y + 15,
        12,
        0,
        Math.PI * 2
    );

    ctx.fill();

    rect(
        cloud.x + 10,
        cloud.y + 13,
        50,
        15,
        "#ededed"
    );
}


/* =========================================
   CREATE CACTUS
========================================= */

function createCactus() {

    const large =
        Math.random() > 0.3;

    obstacles.push({

        x:
            WIDTH + 40,

        width:
            large ? 60 : 38,

        height:
            large ? 78 : 54,

        large:
            large
    });
}


/* =========================================
   COLLISION
========================================= */

function collision(cactus) {

    /*
       SMALL HITBOX

       The Dino's visible head and tail
       are outside most of this box.

       This prevents invisible hits.
    */

    const dinoLeft =
        dino.x + 8;

    const dinoRight =
        dino.x + 50;

    const dinoTop =
        dino.y + 22;

    const dinoBottom =
        dino.y + 74;


    const cactusLeft =
        cactus.x + 8;

    const cactusRight =
        cactus.x +
        cactus.width -
        8;

    const cactusTop =
        GROUND -
        cactus.height +
        6;

    const cactusBottom =
        GROUND;


    return (

        dinoLeft <
        cactusRight &&

        dinoRight >
        cactusLeft &&

        dinoTop <
        cactusBottom &&

        dinoBottom >
        cactusTop

    );
}


/* =========================================
   JUMP
========================================= */

function jump() {

    if (dead) {

        restart();

        return;
    }


    if (!dino.jumping) {

        dino.velocity =
            -JUMP_POWER;

        dino.jumping =
            true;
    }
}


/* =========================================
   UPDATE
========================================= */

function update(dt) {

    if (dead) {
        return;
    }


    /*
       Dino physics
    */

    dino.y +=
        dino.velocity *
        dt;

    dino.velocity +=
        GRAVITY *
        dt;


    const floor =
        GROUND - 75;


    if (
        dino.y >= floor
    ) {

        dino.y =
            floor;

        dino.velocity =
            0;

        dino.jumping =
            false;
    }


    /*
       Cactuses
    */

    for (
        let i =
            obstacles.length - 1;

        i >= 0;

        i--
    ) {

        const cactus =
            obstacles[i];


        cactus.x -=
            speed *
            dt;


        if (
            collision(cactus)
        ) {

            dead = true;

            return;
        }


        if (
            cactus.x <
            -100
        ) {

            obstacles.splice(
                i,
                1
            );


            score++;


            if (
                score >
                highScore
            ) {

                highScore =
                    score;

                localStorage.setItem(
                    "dinoHighScore",
                    highScore
                );
            }


            if (
                score % 10 === 0
            ) {

                speed +=
                    0.2;
            }
        }
    }


    /*
       Clouds
    */

    for (
        let i =
            clouds.length - 1;

        i >= 0;

        i--
    ) {

        clouds[i].x -=
            1.1 *
            dt;


        if (
            clouds[i].x <
            -100
        ) {

            clouds.splice(
                i,
                1
            );
        }
    }


    /*
       Spawn cactus
    */

    obstacleTimer -=
        dt * 16.67;


    if (
        obstacleTimer <= 0
    ) {

        createCactus();


        obstacleTimer =
            1100 +
            Math.random() *
            800;
    }


    /*
       Spawn cloud
    */

    cloudTimer -=
        dt * 16.67;


    if (
        cloudTimer <= 0
    ) {

        clouds.push({

            x:
                WIDTH + 50,

            y:
                40 +
                Math.random() *
                100
        });


        cloudTimer =
            2500 +
            Math.random() *
            2500;
    }
}


/* =========================================
   DRAW
========================================= */

function draw() {

    ctx.clearRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );


    /*
       Background
    */

    rect(
        0,
        0,
        WIDTH,
        HEIGHT,
        "#fff"
    );


    /*
       Clouds
    */

    for (
        const cloud of clouds
    ) {

        drawCloud(
            cloud
        );
    }


    /*
       Ground
    */

    rect(
        0,
        GROUND,
        WIDTH,
        3,
        "#222"
    );


    /*
       Ground marks
    */

    for (
        let x = 0;

        x < WIDTH;

        x += 90
    ) {

        rect(
            x + 20,
            GROUND + 10,
            18,
            2,
            "#ddd"
        );
    }


    /*
       Cactuses
    */

    for (
        const cactus of obstacles
    ) {

        if (
            cactus.large
        ) {

            drawLargeCactus(
                cactus
            );

        } else {

            drawSmallCactus(
                cactus
            );
        }
    }


    /*
       Dino
    */

    drawDino();


    /*
       SCORE

       These are now rendered
       with normal anti-aliased
       canvas text.
    */

    ctx.font =
        "18px Arial, Helvetica, sans-serif";

    ctx.fillStyle =
        "#333";

    ctx.textAlign =
        "left";

    ctx.textBaseline =
        "alphabetic";


    ctx.fillText(
        "HI " +
        String(highScore)
            .padStart(5, "0"),
        20,
        28
    );


    ctx.textAlign =
        "right";


    ctx.fillText(
        String(score)
            .padStart(5, "0"),
        WIDTH - 20,
        28
    );


    /*
       GAME OVER
    */

    if (dead) {

        ctx.fillStyle =
            "rgba(255,255,255,0.95)";

        ctx.fillRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );


        ctx.textAlign =
            "center";


        ctx.fillStyle =
            "#222";

        ctx.font =
            "bold 32px Arial, Helvetica, sans-serif";


        ctx.fillText(
            "GAME OVER",
            WIDTH / 2,
            125
        );


        ctx.font =
            "16px Arial, Helvetica, sans-serif";

        ctx.fillStyle =
            "#555";


        ctx.fillText(
            "Press SPACE or tap to restart",
            WIDTH / 2,
            155
        );
    }
}


/* =========================================
   RESTART
========================================= */

function restart() {

    obstacles = [];

    clouds = [];

    score = 0;

    speed = 6;

    dead = false;


    dino.y =
        GROUND - 75;

    dino.velocity =
        0;

    dino.jumping =
        false;


    obstacleTimer =
        800;

    cloudTimer =
        1000;
}


/* =========================================
   INPUT
========================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.code === "Space" ||
            event.code === "ArrowUp"
        ) {

            event.preventDefault();

            jump();
        }
    }
);


canvas.addEventListener(
    "pointerdown",
    () => {
        jump();
    }
);


/* =========================================
   GAME LOOP
========================================= */

function loop(time) {

    let dt =
        (time - lastTime) /
        16.67;

    lastTime =
        time;


    if (
        dt > 2
    ) {

        dt = 2;
    }


    update(dt);

    draw();


    requestAnimationFrame(
        loop
    );
}


restart();

requestAnimationFrame(
    loop
);

<\/script>

</body>

</html>

`);

    w.document.close();
    w.focus();
};

</script>

</body>
</html>
