<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dino Game</title>

<style>
html, body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    background: #fff;
    color: #222;
    font-family: Arial, Helvetica, sans-serif;
    transition: background 0.2s, color 0.2s;
}

body.dark {
    background: #111;
    color: #fff;
}

#launcher {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
}

button {
    border: 2px solid currentColor;
    border-radius: 8px;
    background: transparent;
    color: inherit;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
}

#launch {
    padding: 18px 40px;
}

#appearance {
    padding: 10px 20px;
    font-size: 15px;
}

button:hover {
    background: #222;
    color: #fff;
}

body.dark button:hover {
    background: #fff;
    color: #111;
}
</style>
</head>

<body>

<div id="launcher">

    <button id="launch">
        START IN ABOUT:BLANK
    </button>

    <button id="appearance">
        APPEARANCE: WHITE
    </button>

</div>

<script>

/*
==================================================
SETTINGS
==================================================
*/

const SCORE_KEY = "dinoHighScoreV4";
const APPEARANCE_KEY = "dinoAppearance";


/*
==================================================
APPEARANCE
==================================================
*/

let appearance =
    localStorage.getItem(
        APPEARANCE_KEY
    ) || "white";


function updateAppearance() {

    if (appearance === "black") {

        document.body.classList.add("dark");

        document.getElementById(
            "appearance"
        ).textContent =
            "APPEARANCE: BLACK";

    } else {

        document.body.classList.remove("dark");

        document.getElementById(
            "appearance"
        ).textContent =
            "APPEARANCE: WHITE";
    }
}


updateAppearance();


document
    .getElementById("appearance")
    .addEventListener(
        "click",
        function() {

            if (appearance === "white") {

                appearance = "black";

            } else {

                appearance = "white";
            }


            localStorage.setItem(
                APPEARANCE_KEY,
                appearance
            );


            updateAppearance();
        }
    );


/*
==================================================
HIGH SCORE
==================================================
*/

function getHighScore() {

    const value =
        Number(
            localStorage.getItem(
                SCORE_KEY
            )
        );


    if (
        !Number.isFinite(value) ||
        value < 0
    ) {

        return 0;
    }


    return Math.floor(value);
}


/*
==================================================
RECEIVE HIGH SCORE
==================================================
*/

window.addEventListener(
    "message",
    function(event) {

        if (
            !event.data
        ) {

            return;
        }


        if (
            event.data.type !==
            "DINO_SAVE_SCORE"
        ) {

            return;
        }


        const newScore =
            Number(
                event.data.score
            );


        if (
            !Number.isFinite(newScore) ||
            newScore < 0
        ) {

            return;
        }


        const oldScore =
            getHighScore();


        if (
            newScore > oldScore
        ) {

            localStorage.setItem(
                SCORE_KEY,
                String(
                    Math.floor(
                        newScore
                    )
                )
            );
        }

    }
);


/*
==================================================
LAUNCH GAME
==================================================
*/

document
    .getElementById("launch")
    .addEventListener(
        "click",
        function() {

            const gameWindow =
                window.open(
                    "about:blank",
                    "_blank"
                );


            if (!gameWindow) {

                alert(
                    "Please allow popups for this site."
                );

                return;
            }


            const savedHighScore =
                getHighScore();


            /*
                Pass appearance into game.
            */

            const gameAppearance =
                appearance;


            gameWindow.document.open();


            gameWindow.document.write(`

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Dino</title>


<style>

html,
body {

    width: 100%;
    height: 100%;

    margin: 0;

    padding: 0;

    overflow: hidden;

}


body {

    display: flex;

    justify-content: center;

    align-items: center;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}


canvas {

    display: block;

    width: 900px;

    height: 300px;

}

</style>

</head>


<body>


<canvas id="game"></canvas>


<script>

/*
==================================================
CANVAS
==================================================
*/

const canvas =
    document.getElementById(
        "game"
    );


const ctx =
    canvas.getContext(
        "2d"
    );


const WIDTH = 900;

const HEIGHT = 300;


const DPR =
    Math.max(
        1,
        window.devicePixelRatio || 1
    );


canvas.width =
    WIDTH * DPR;

canvas.height =
    HEIGHT * DPR;


canvas.style.width =
    WIDTH + "px";

canvas.style.height =
    HEIGHT + "px";


ctx.setTransform(
    DPR,
    0,
    0,
    DPR,
    0,
    0
);


/*
==================================================
APPEARANCE
==================================================
*/

const appearance =
    "${gameAppearance}";


const BLACK_MODE =
    appearance === "black";


const BACKGROUND =
    BLACK_MODE
        ? "#111111"
        : "#ffffff";


const FOREGROUND =
    BLACK_MODE
        ? "#ffffff"
        : "#222222";


const SECONDARY =
    BLACK_MODE
        ? "#bbbbbb"
        : "#555555";


const CLOUD_COLOR =
    BLACK_MODE
        ? "#333333"
        : "#ededed";


const GROUND_DETAIL =
    BLACK_MODE
        ? "#333333"
        : "#dddddd";


document.body.style.background =
    BACKGROUND;


/*
==================================================
SETTINGS
==================================================
*/

const GROUND = 255;

const GRAVITY = 0.62;

const JUMP_POWER = 12.5;


/*
==================================================
PLAYER
==================================================
*/

const dino = {

    x: 90,

    y: GROUND - 75,

    velocity: 0,

    jumping: false

};


/*
==================================================
SCORE
==================================================
*/

let score = 0;

let highScore =
    ${savedHighScore};


/*
==================================================
GAME STATE
==================================================
*/

let obstacles = [];

let clouds = [];

let speed = 6;

let obstacleTimer = 800;

let cloudTimer = 1000;

let dead = false;

let lastTime =
    performance.now();


/*
==================================================
SAVE HIGH SCORE
==================================================
*/

function saveHighScore() {

    if (
        !window.opener
    ) {

        return;
    }


    window.opener.postMessage(

        {

            type:
                "DINO_SAVE_SCORE",

            score:
                highScore

        },

        "*"
    );
}


/*
==================================================
RECTANGLE
==================================================
*/

function rect(
    x,
    y,
    width,
    height,
    color
) {

    ctx.fillStyle =
        color;

    ctx.fillRect(
        Math.round(x),
        Math.round(y),
        width,
        height
    );
}


/*
==================================================
DINO
==================================================
*/

function drawDino() {

    const x =
        dino.x;

    const y =
        dino.y;

    const c =
        FOREGROUND;


    /*
    Tail
    */

    rect(
        x - 7,
        y + 38,
        14,
        8,
        c
    );

    rect(
        x - 15,
        y + 31,
        13,
        8,
        c
    );

    rect(
        x - 21,
        y + 25,
        10,
        7,
        c
    );


    /*
    Body
    */

    rect(
        x + 6,
        y + 28,
        41,
        37,
        c
    );


    /*
    Spikes
    */

    rect(
        x + 8,
        y + 22,
        8,
        8,
        c
    );

    rect(
        x + 18,
        y + 17,
        8,
        10,
        c
    );

    rect(
        x + 28,
        y + 13,
        8,
        14,
        c
    );


    /*
    Neck
    */

    rect(
        x + 35,
        y + 13,
        19,
        32,
        c
    );


    /*
    Head
    */

    rect(
        x + 38,
        y + 3,
        30,
        29,
        c
    );


    /*
    Snout
    */

    rect(
        x + 58,
        y + 16,
        19,
        13,
        c
    );

    rect(
        x + 67,
        y + 21,
        10,
        8,
        c
    );


    /*
    Eye
    */

    rect(
        x + 56,
        y + 8,
        5,
        5,
        BACKGROUND
    );


    /*
    Mouth
    */

    rect(
        x + 62,
        y + 27,
        12,
        2,
        BACKGROUND
    );


    /*
    Arm
    */

    rect(
        x + 25,
        y + 40,
        18,
        7,
        c
    );

    rect(
        x + 19,
        y + 44,
        10,
        6,
        c
    );


    /*
    Legs
    */

    rect(
        x + 12,
        y + 58,
        10,
        17,
        c
    );

    rect(
        x + 35,
        y + 57,
        10,
        18,
        c
    );


    /*
    Feet
    */

    rect(
        x + 7,
        y + 70,
        18,
        5,
        c
    );

    rect(
        x + 31,
        y + 70,
        19,
        5,
        c
    );
}


/*
==================================================
LARGE CACTUS
==================================================
*/

function drawLargeCactus(cactus) {

    const x =
        cactus.x;

    const y =
        GROUND - 78;

    const c =
        FOREGROUND;


    rect(
        x + 18,
        y,
        20,
        78,
        c
    );


    rect(
        x + 2,
        y + 36,
        22,
        9,
        c
    );

    rect(
        x + 2,
        y + 23,
        9,
        22,
        c
    );


    rect(
        x + 34,
        y + 43,
        24,
        9,
        c
    );

    rect(
        x + 49,
        y + 29,
        9,
        23,
        c
    );
}


/*
==================================================
SMALL CACTUS
==================================================
*/

function drawSmallCactus(cactus) {

    const x =
        cactus.x;

    const y =
        GROUND - 54;

    const c =
        FOREGROUND;


    rect(
        x + 11,
        y,
        14,
        54,
        c
    );


    rect(
        x,
        y + 27,
        15,
        8,
        c
    );

    rect(
        x,
        y + 18,
        8,
        17,
        c
    );


    rect(
        x + 21,
        y + 34,
        16,
        8,
        c
    );

    rect(
        x + 29,
        y + 24,
        8,
        18,
        c
    );
}


/*
==================================================
CLOUD
==================================================
*/

function drawCloud(cloud) {

    ctx.fillStyle =
        CLOUD_COLOR;


    ctx.beginPath();


    ctx.arc(
        cloud.x + 15,
        cloud.y + 14,
        12,
        0,
        Math.PI * 2
    );


    ctx.arc(
        cloud.x + 33,
        cloud.y + 9,
        17,
        0,
        Math.PI * 2
    );


    ctx.arc(
        cloud.x + 52,
        cloud.y + 15,
        12,
        0,
        Math.PI * 2
    );


    ctx.fill();


    rect(
        cloud.x + 10,
        cloud.y + 13,
        50,
        15,
        CLOUD_COLOR
    );
}


/*
==================================================
CREATE CACTUS
==================================================
*/

function createCactus() {

    const large =
        Math.random() > 0.3;


    obstacles.push({

        x:
            WIDTH + 40,

        width:
            large
                ? 60
                : 38,

        height:
            large
                ? 78
                : 54,

        large:
            large

    });
}


/*
==================================================
COLLISION
==================================================
*/

function collision(cactus) {

    const dinoLeft =
        dino.x + 8;

    const dinoRight =
        dino.x + 50;

    const dinoTop =
        dino.y + 22;

    const dinoBottom =
        dino.y + 74;


    const cactusLeft =
        cactus.x + 8;

    const cactusRight =
        cactus.x +
        cactus.width -
        8;

    const cactusTop =
        GROUND -
        cactus.height +
        6;

    const cactusBottom =
        GROUND;


    return (

        dinoLeft <
        cactusRight &&

        dinoRight >
        cactusLeft &&

        dinoTop <
        cactusBottom &&

        dinoBottom >
        cactusTop

    );
}


/*
==================================================
JUMP
==================================================
*/

function jump() {

    if (dead) {

        restart();

        return;
    }


    if (!dino.jumping) {

        dino.velocity =
            -JUMP_POWER;

        dino.jumping =
            true;
    }
}


/*
==================================================
UPDATE
==================================================
*/

function update(dt) {

    if (dead) {
        return;
    }


    /*
    DINO
    */

    dino.y +=
        dino.velocity *
        dt;


    dino.velocity +=
        GRAVITY *
        dt;


    const floor =
        GROUND - 75;


    if (
        dino.y >= floor
    ) {

        dino.y =
            floor;

        dino.velocity =
            0;

        dino.jumping =
            false;
    }


    /*
    CACTUSES
    */

    for (
        let i =
            obstacles.length - 1;

        i >= 0;

        i--
    ) {

        const cactus =
            obstacles[i];


        cactus.x -=
            speed *
            dt;


        /*
        COLLISION
        */

        if (
            collision(cactus)
        ) {

            dead =
                true;

            return;
        }


        /*
        PASSED CACTUS
        */

        if (
            cactus.x < -100
        ) {

            obstacles.splice(
                i,
                1
            );


            score++;


            /*
            HIGH SCORE
            */

            if (
                score >
                highScore
            ) {

                highScore =
                    score;

                saveHighScore();
            }


            /*
            SPEED
            */

            if (
                score > 0 &&
                score % 10 === 0
            ) {

                speed +=
                    0.2;
            }
        }
    }


    /*
    CLOUDS
    */

    for (
        let i =
            clouds.length - 1;

        i >= 0;

        i--
    ) {

        clouds[i].x -=
            1.1 *
            dt;


        if (
            clouds[i].x < -100
        ) {

            clouds.splice(
                i,
                1
            );
        }
    }


    /*
    CACTUS SPAWN
    */

    obstacleTimer -=
        dt *
        16.67;


    if (
        obstacleTimer <= 0
    ) {

        createCactus();


        obstacleTimer =
            1100 +
            Math.random() *
            800;
    }


    /*
    CLOUD SPAWN
    */

    cloudTimer -=
        dt *
        16.67;


    if (
        cloudTimer <= 0
    ) {

        clouds.push({

            x:
                WIDTH + 50,

            y:
                40 +
                Math.random() *
                100

        });


        cloudTimer =
            2500 +
            Math.random() *
            2500;
    }
}


/*
==================================================
DRAW
==================================================
*/

function draw() {

    ctx.clearRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );


    /*
    BACKGROUND
    */

    rect(
        0,
        0,
        WIDTH,
        HEIGHT,
        BACKGROUND
    );


    /*
    CLOUDS
    */

    for (
        const cloud of clouds
    ) {

        drawCloud(
            cloud
        );
    }


    /*
    GROUND
    */

    rect(
        0,
        GROUND,
        WIDTH,
        3,
        FOREGROUND
    );


    /*
    GROUND DETAILS
    */

    for (
        let x = 0;

        x < WIDTH;

        x += 90
    ) {

        rect(
            x + 20,
            GROUND + 10,
            18,
            2,
            GROUND_DETAIL
        );
    }


    /*
    CACTUSES
    */

    for (
        const cactus of obstacles
    ) {

        if (
            cactus.large
        ) {

            drawLargeCactus(
                cactus
            );

        } else {

            drawSmallCactus(
                cactus
            );
        }
    }


    /*
    DINO
    */

    drawDino();


    /*
    HIGH SCORE
    */

    ctx.textAlign =
        "left";

    ctx.textBaseline =
        "alphabetic";

    ctx.font =
        "18px Arial, Helvetica, sans-serif";

    ctx.fillStyle =
        FOREGROUND;


    ctx.fillText(
        "HI " +
        String(highScore)
            .padStart(5, "0"),

        20,

        28
    );


    /*
    CURRENT SCORE
    */

    ctx.textAlign =
        "right";


    ctx.fillText(
        String(score)
            .padStart(5, "0"),

        WIDTH - 20,

        28
    );


    /*
    GAME OVER
    */

    if (dead) {

        ctx.fillStyle =
            BLACK_MODE
                ? "rgba(17,17,17,0.95)"
                : "rgba(255,255,255,0.95)";


        ctx.fillRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );


        ctx.textAlign =
            "center";


        ctx.fillStyle =
            FOREGROUND;


        ctx.font =
            "bold 32px Arial, Helvetica, sans-serif";


        ctx.fillText(
            "GAME OVER",

            WIDTH / 2,

            125
        );


        ctx.font =
            "16px Arial, Helvetica, sans-serif";


        ctx.fillStyle =
            SECONDARY;


        ctx.fillText(
            "Press SPACE or tap to restart",

            WIDTH / 2,

            155
        );
    }
}


/*
==================================================
RESTART
==================================================
*/

function restart() {

    obstacles = [];

    clouds = [];

    score = 0;

    speed = 6;

    dead = false;


    dino.y =
        GROUND - 75;

    dino.velocity =
        0;

    dino.jumping =
        false;


    obstacleTimer =
        800;

    cloudTimer =
        1000;
}


/*
==================================================
KEYBOARD
==================================================
*/

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.code === "Space" ||
            event.code === "ArrowUp"
        ) {

            event.preventDefault();

            jump();
        }
    }
);


/*
==================================================
MOUSE / TOUCH
==================================================
*/

canvas.addEventListener(
    "pointerdown",
    function() {

        jump();

    }
);


/*
==================================================
GAME LOOP
==================================================
*/

function gameLoop(time) {

    let dt =
        (time - lastTime) /
        16.67;


    lastTime =
        time;


    if (dt > 2) {

        dt = 2;
    }


    update(dt);

    draw();


    requestAnimationFrame(
        gameLoop
    );
}


/*
==================================================
START
==================================================
*/

restart();

requestAnimationFrame(
    gameLoop
);

<\/script>

</body>

</html>

`);

            gameWindow.document.close();

            gameWindow.focus();

        }
    );

</script>

</body>
</html>
