<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dino Runner</title>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        margin: 0;
    }

    body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        color: #111111;
        font-family: Arial, Helvetica, sans-serif;
        transition: background 0.2s, color 0.2s;
    }

    body.dark {
        background: #111111;
        color: #ffffff;
    }

    #launcher {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        text-align: center;
    }

    #launchButton,
    #appearanceButton {
        border: 2px solid currentColor;
        background: transparent;
        color: inherit;
        border-radius: 8px;
        cursor: pointer;
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 700;
    }

    #launchButton {
        padding: 20px 42px;
        font-size: 20px;
    }

    #appearanceButton {
        padding: 10px 22px;
        font-size: 15px;
    }

    #launchButton:hover,
    #appearanceButton:hover {
        background: currentColor;
        color: #ffffff;
    }

    body.dark #launchButton:hover,
    body.dark #appearanceButton:hover {
        color: #111111;
    }

    #status {
        font-size: 14px;
        opacity: 0.65;
    }
</style>
</head>

<body>

<div id="launcher">

    <button id="launchButton">
        START IN ABOUT:BLANK
    </button>

    <button id="appearanceButton">
        APPEARANCE: WHITE
    </button>

    <div id="status">
        The game opens in a new about:blank page.
    </div>

</div>

<script>
"use strict";

const APPEARANCE_KEY = "dinoAppearance";
const SCORE_KEY = "dinoHighScore";

let appearance =
    localStorage.getItem(APPEARANCE_KEY) || "white";

function updateLauncherAppearance() {

    document.body.classList.toggle(
        "dark",
        appearance === "black"
    );

    document.getElementById(
        "appearanceButton"
    ).textContent =
        appearance === "black"
            ? "APPEARANCE: BLACK"
            : "APPEARANCE: WHITE";
}

updateLauncherAppearance();

document.getElementById(
    "appearanceButton"
).addEventListener("click", function () {

    appearance =
        appearance === "white"
            ? "black"
            : "white";

    localStorage.setItem(
        APPEARANCE_KEY,
        appearance
    );

    updateLauncherAppearance();
});


document.getElementById(
    "launchButton"
).addEventListener("click", function () {

    const gameWindow = window.open(
        "",
        "_blank"
    );

    if (!gameWindow) {
        alert(
            "Popup blocked. Allow popups for this site and try again."
        );
        return;
    }

    const highScore =
        Number(
            localStorage.getItem(SCORE_KEY) || 0
        );

    const gameHTML = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dino Runner</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    background: ${appearance === "black" ? "#111111" : "#ffffff"};
    color: ${appearance === "black" ? "#ffffff" : "#222222"};
    font-family: Arial, Helvetica, sans-serif;
}

#gameContainer {
    width: min(920px, 96vw);
    text-align: center;
}

#gameCanvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 3 / 1;
    image-rendering: auto;
}

#instructions {
    margin-top: 16px;
    font-size: 15px;
    line-height: 1.5;
    color: ${appearance === "black" ? "#cccccc" : "#555555"};
}

#instructions strong {
    color: ${appearance === "black" ? "#ffffff" : "#222222"};
}

.key {
    display: inline-block;
    padding: 2px 7px;
    border: 1px solid currentColor;
    border-radius: 5px;
    font-weight: bold;
}

#mobileHint {
    display: none;
}

@media (max-width: 700px) {
    #instructions {
        font-size: 13px;
    }
}
</style>
</head>

<body>

<div id="gameContainer">

<canvas id="gameCanvas"></canvas>

<div id="instructions">
    <strong>HOW TO PLAY</strong><br>
    Tap <span class="key">SPACE</span> to jump.
    Hold <span class="key">SPACE</span> to duck.
    Release <span class="key">SPACE</span> to stand.
    Avoid the cactuses and flying dinosaurs.
</div>

</div>

<script>
"use strict";

/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("gameCanvas");

const ctx =
    canvas.getContext("2d");

const WIDTH = 900;
const HEIGHT = 300;

const GROUND_Y = 252;

const DPR =
    Math.max(
        1,
        Math.min(
            2,
            window.devicePixelRatio || 1
        )
    );

canvas.width =
    WIDTH * DPR;

canvas.height =
    HEIGHT * DPR;

ctx.setTransform(
    DPR,
    0,
    0,
    DPR,
    0,
    0
);


/* =========================================================
   COLORS
========================================================= */

const BLACK_MODE =
    "${appearance}" === "black";

const BG =
    BLACK_MODE
        ? "#111111"
        : "#ffffff";

const FG =
    BLACK_MODE
        ? "#ffffff"
        : "#222222";

const MUTED =
    BLACK_MODE
        ? "#333333"
        : "#dddddd";


/* =========================================================
   GAME CONSTANTS
========================================================= */

const GRAVITY = 0.68;

const JUMP_FORCE = 13.2;

const BASE_SPEED = 6;

const MAX_SPEED = 11;


/*
    This is the important control value.

    If Space stays down longer than this,
    the dino ducks.

    A quick tap becomes a jump.
*/
const HOLD_TIME = 150;


/*
    Flying dinosaurs are always placed
    high enough that ducking avoids them.

    They never use the low position.
*/
const FLYING_MIN_Y = 125;
const FLYING_MAX_Y = 158;


/*
    Flying dinosaurs need this much
    horizontal separation from cactuses.
*/
const FLYING_CACTUS_DISTANCE = 250;


/* =========================================================
   GAME STATE
========================================================= */

let score = 0;

let bestScore =
    Number("${highScore}") || 0;

let speed =
    BASE_SPEED;

let dead = false;

let lastTime =
    performance.now();


/* =========================================================
   DINO
========================================================= */

const dino = {

    x: 85,

    width: 70,

    normalHeight: 75,

    duckHeight: 43,

    y:
        GROUND_Y - 75,

    velocityY: 0,

    jumping: false,

    ducking: false
};


/* =========================================================
   SPACE INPUT
========================================================= */

let spaceDown = false;

let spacePressedAt = 0;

let jumpTriggered = false;


/*
    When Space is pressed we do NOT
    immediately jump.

    We wait a tiny amount to determine
    whether it is a tap or a hold.

    This prevents holding Space from
    causing a jump before ducking.
*/
function handleSpaceDown() {

    if (spaceDown) {
        return;
    }

    spaceDown = true;

    spacePressedAt =
        performance.now();

    jumpTriggered = false;

    if (dead) {

        restart();

        spaceDown = true;

        spacePressedAt =
            performance.now();

        return;
    }
}


/*
    When Space is released:

    If it was a short press,
    jump.

    If it was a hold,
    stop ducking.
*/
function handleSpaceUp() {

    if (!spaceDown) {
        return;
    }

    const heldFor =
        performance.now() -
        spacePressedAt;

    spaceDown = false;

    /*
        Short press = jump.
    */
    if (
        heldFor < HOLD_TIME &&
        !jumpTriggered
    ) {

        if (
            !dino.jumping &&
            !dead
        ) {

            dino.ducking = false;

            dino.velocityY =
                -JUMP_FORCE;

            dino.jumping =
                true;
        }
    }

    /*
        Release always stops ducking.
    */
    dino.ducking = false;

    jumpTriggered = false;
}


/*
    Check whether Space has been held
    long enough to duck.
*/
function updateSpaceInput() {

    if (!spaceDown || dead) {
        return;
    }

    const heldFor =
        performance.now() -
        spacePressedAt;

    if (
        heldFor >= HOLD_TIME
    ) {

        /*
            Duck immediately once the
            hold threshold is reached.

            This works both on the ground
            and during a jump.
        */
        dino.ducking = true;

        /*
            If the dino is already in a jump,
            cancel the jump and bring it down.
        */
        if (dino.jumping) {

            dino.velocityY =
                Math.max(
                    dino.velocityY,
                    2.5
                );
        }
    }
}


/* =========================================================
   DINO DRAWING
========================================================= */

function drawDino() {

    const x = dino.x;

    const c = FG;

    /*
        DUCKING
    */
    if (dino.ducking) {

        const y =
            GROUND_Y - 43;

        /*
            Tail.
        */
        fillRect(
            x - 17,
            y + 25,
            15,
            7,
            c
        );

        fillRect(
            x - 25,
            y + 20,
            11,
            7,
            c
        );

        /*
            Body.
        */
        fillRect(
            x,
            y + 15,
            48,
            28,
            c
        );

        /*
            Head.
        */
        fillRect(
            x + 38,
            y + 3,
            31,
            27,
            c
        );

        /*
            Nose.
        */
        fillRect(
            x + 62,
            y + 13,
            18,
            11,
            c
        );

        /*
            Eye.
        */
        fillRect(
            x + 57,
            y + 8,
            5,
            5,
            BG
        );

        /*
            Mouth.
        */
        fillRect(
            x + 65,
            y + 24,
            11,
            2,
            BG
        );

        /*
            Legs.
        */
        fillRect(
            x + 10,
            y + 37,
            10,
            9,
            c
        );

        fillRect(
            x + 34,
            y + 37,
            10,
            9,
            c
        );

        return;
    }


    /*
        NORMAL DINO
    */

    const y =
        GROUND_Y - 75;


    /*
        Tail.
    */
    fillRect(
        x - 8,
        y + 39,
        14,
        8,
        c
    );

    fillRect(
        x - 18,
        y + 32,
        12,
        8,
        c
    );

    fillRect(
        x - 24,
        y + 25,
        9,
        8,
        c
    );


    /*
        Body.
    */
    fillRect(
        x + 5,
        y + 29,
        43,
        37,
        c
    );


    /*
        Neck.
    */
    fillRect(
        x + 37,
        y + 14,
        19,
        34,
        c
    );


    /*
        Head.
    */
    fillRect(
        x + 39,
        y + 3,
        30,
        29,
        c
    );


    /*
        Nose.
    */
    fillRect(
        x + 61,
        y + 16,
        18,
        13,
        c
    );


    /*
        Eye.
    */
    fillRect(
        x + 57,
        y + 8,
        5,
        5,
        BG
    );


    /*
        Mouth.
    */
    fillRect(
        x + 64,
        y + 27,
        11,
        2,
        BG
    );


    /*
        Arms.
    */
    fillRect(
        x + 28,
        y + 39,
        14,
        5,
        c
    );


    /*
        Legs.
    */
    fillRect(
        x + 12,
        y + 59,
        10,
        16,
        c
    );

    fillRect(
        x + 35,
        y + 58,
        10,
        17,
        c
    );


    /*
        Feet.
    */
    fillRect(
        x + 7,
        y + 70,
        19,
        5,
        c
    );

    fillRect(
        x + 30,
        y + 70,
        20,
        5,
        c
    );
}


/* =========================================================
   CACTUSES
========================================================= */

function drawCactus(cactus) {

    const x =
        cactus.x;

    const bottom =
        GROUND_Y;

    const c =
        FG;


    if (cactus.type === 1) {

        /*
            Large cactus.
        */

        const top =
            bottom - 78;

        fillRect(
            x + 18,
            top,
            20,
            78,
            c
        );

        fillRect(
            x + 3,
            top + 35,
            20,
            9,
            c
        );

        fillRect(
            x + 3,
            top + 22,
            9,
            23,
            c
        );

        fillRect(
            x + 34,
            top + 43,
            23,
            9,
            c
        );

        fillRect(
            x + 48,
            top + 29,
            9,
            24,
            c
        );

    } else {

        /*
            Small cactus.
        */

        const top =
            bottom - 54;

        fillRect(
            x + 11,
            top,
            14,
            54,
            c
        );

        fillRect(
            x,
            top + 27,
            15,
            8,
            c
        );

        fillRect(
            x,
            top + 18,
            8,
            18,
            c
        );

        fillRect(
            x + 21,
            top + 34,
            16,
            8,
            c
        );

        fillRect(
            x + 29,
            top + 24,
            8,
            19,
            c
        );
    }
}


/* =========================================================
   FLYING DINOSAUR
========================================================= */

function drawFlyingDinosaur(fly) {

    const x =
        fly.x;

    const y =
        fly.y;

    const c =
        FG;


    /*
        Body.
    */
    fillRect(
        x + 10,
        y + 14,
        39,
        21,
        c
    );


    /*
        Head.
    */
    fillRect(
        x + 39,
        y + 7,
        27,
        26,
        c
    );


    /*
        Snout.
    */
    fillRect(
        x + 59,
        y + 17,
        19,
        10,
        c
    );


    /*
        Eye.
    */
    fillRect(
        x + 53,
        y + 12,
        5,
        5,
        BG
    );


    /*
        Wings.
    */
    ctx.fillStyle =
        c;

    ctx.beginPath();

    ctx.moveTo(
        x + 23,
        y + 18
    );

    ctx.lineTo(
        x + 8,
        y - 5
    );

    ctx.lineTo(
        x + 3,
        y + 19
    );

    ctx.closePath();

    ctx.fill();


    ctx.beginPath();

    ctx.moveTo(
        x + 34,
        y + 18
    );

    ctx.lineTo(
        x + 25,
        y - 9
    );

    ctx.lineTo(
        x + 19,
        y + 17
    );

    ctx.closePath();

    ctx.fill();


    /*
        Tail.
    */
    ctx.beginPath();

    ctx.moveTo(
        x + 13,
        y + 20
    );

    ctx.lineTo(
        x - 19,
        y + 7
    );

    ctx.lineTo(
        x - 7,
        y + 26
    );

    ctx.closePath();

    ctx.fill();


    /*
        Feet.
    */
    fillRect(
        x + 19,
        y + 33,
        6,
        8,
        c
    );

    fillRect(
        x + 39,
        y + 33,
        6,
        8,
        c
    );
}


/* =========================================================
   CLOUDS
========================================================= */

const clouds = [];

function drawCloud(cloud) {

    ctx.fillStyle =
        BLACK_MODE
            ? "#292929"
            : "#e7e7e7";

    ctx.beginPath();

    ctx.arc(
        cloud.x + 15,
        cloud.y + 15,
        12,
        0,
        Math.PI * 2
    );

    ctx.arc(
        cloud.x + 33,
        cloud.y + 9,
        17,
        0,
        Math.PI * 2
    );

    ctx.arc(
        cloud.x + 52,
        cloud.y + 15,
        12,
        0,
        Math.PI * 2
    );

    ctx.fill();

    fillRect(
        cloud.x + 9,
        cloud.y + 14,
        50,
        14,
        BLACK_MODE
            ? "#292929"
            : "#e7e7e7"
    );
}


/* =========================================================
   OBJECT ARRAYS
========================================================= */

const cactuses = [];

const flyingDinosaurs = [];


/* =========================================================
   CACTUS SPAWNING
========================================================= */

let cactusSpawnTimer =
    900;


function cactusWidth(cactus) {

    return cactus.type === 1
        ? 60
        : 38;
}


function canSpawnCactus(x, width) {

    /*
        Never put a cactus underneath
        a flying dinosaur.

        This creates a clear choice:
        jump OR duck.
    */

    for (
        const fly of flyingDinosaurs
    ) {

        const flyLeft =
            fly.x -
            FLYING_CACTUS_DISTANCE;

        const flyRight =
            fly.x +
            fly.width +
            FLYING_CACTUS_DISTANCE;

        if (
            x + width > flyLeft &&
            x < flyRight
        ) {
            return false;
        }
    }


    /*
        Don't put cactuses too close
        together.
    */

    for (
        const cactus of cactuses
    ) {

        if (
            Math.abs(
                cactus.x - x
            ) < 150
        ) {
            return false;
        }
    }


    return true;
}


function spawnCactus() {

    const type =
        Math.random() < 0.3
            ? 1
            : 0;

    const width =
        type === 1
            ? 60
            : 38;

    const x =
        WIDTH + 40;

    if (
        !canSpawnCactus(
            x,
            width
        )
    ) {
        return;
    }

    cactuses.push({

        x: x,

        width: width,

        height:
            type === 1
                ? 78
                : 54,

        type: type
    });
}


/* =========================================================
   FLYING DINO SPAWNING
========================================================= */

let flyingSpawnTimer =
    7000 +
    Math.random() * 4000;


function canSpawnFlying(x) {

    /*
        Don't spawn above a cactus.

        There must be enough distance
        for the player to deal with
        one obstacle at a time.
    */

    for (
        const cactus of cactuses
    ) {

        const cactusLeft =
            cactus.x -
            FLYING_CACTUS_DISTANCE;

        const cactusRight =
            cactus.x +
            cactus.width +
            FLYING_CACTUS_DISTANCE;

        if (
            x + 78 > cactusLeft &&
            x < cactusRight
        ) {
            return false;
        }
    }


    /*
        Don't spawn flying dinosaurs
        too close to one another.
    */

    for (
        const fly of flyingDinosaurs
    ) {

        if (
            Math.abs(
                fly.x - x
            ) < 500
        ) {
            return false;
        }
    }


    return true;
}


function spawnFlyingDinosaur() {

    const x =
        WIDTH + 350;

    if (
        !canSpawnFlying(x)
    ) {
        return false;
    }


    const y =
        FLYING_MIN_Y +
        Math.random() *
        (
            FLYING_MAX_Y -
            FLYING_MIN_Y
        );


    flyingDinosaurs.push({

        x: x,

        y: y,

        baseY: y,

        width: 78,

        height: 45,

        phase:
            Math.random() *
            Math.PI * 2,

        time: 0
    });


    return true;
}


/* =========================================================
   COLLISION
========================================================= */

function collisionCactus(cactus) {

    const dinoLeft =
        dino.x + 10;

    const dinoRight =
        dino.x +
        (
            dino.ducking
                ? 70
                : 68
        );


    const dinoTop =
        dino.ducking
            ? GROUND_Y - 43
            : dino.y + 5;

    const dinoBottom =
        GROUND_Y;


    const cactusLeft =
        cactus.x + 7;

    const cactusRight =
        cactus.x +
        cactus.width -
        7;

    const cactusTop =
        GROUND_Y -
        cactus.height +
        5;


    return (
        dinoRight > cactusLeft &&
        dinoLeft < cactusRight &&
        dinoBottom > cactusTop &&
        dinoTop < GROUND_Y
    );
}


function collisionFlying(fly) {

    /*
        The flying dinosaur is deliberately
        high enough for the duck hitbox to
        pass underneath it.
    */

    const dinoLeft =
        dino.x + 12;

    const dinoRight =
        dino.x + 65;


    const dinoTop =
        dino.ducking
            ? GROUND_Y - 43
            : dino.y + 5;


    const dinoBottom =
        GROUND_Y;


    const flyLeft =
        fly.x + 8;

    const flyRight =
        fly.x +
        fly.width -
        7;

    const flyTop =
        fly.y + 3;

    const flyBottom =
        fly.y +
        fly.height -
        4;


    return (
        dinoRight > flyLeft &&
        dinoLeft < flyRight &&
        dinoTop < flyBottom &&
        dinoBottom > flyTop
    );
}


/* =========================================================
   SCORE
========================================================= */

function saveBestScore() {

    if (
        score > bestScore
    ) {

        bestScore =
            score;

        localStorage.setItem(
            "${SCORE_KEY}",
            String(bestScore)
        );
    }
}


function scorePoint() {

    score++;

    saveBestScore();


    /*
        Increase difficulty gradually.
    */

    speed =
        Math.min(
            MAX_SPEED,
            BASE_SPEED +
            score * 0.035
        );
}


/* =========================================================
   UPDATE
========================================================= */

function update(dt) {

    if (dead) {
        return;
    }


    updateSpaceInput();


    /*
        DINO
    */

    if (
        !dino.ducking
    ) {

        if (
            dino.jumping
        ) {

            dino.y +=
                dino.velocityY *
                dt;

            dino.velocityY +=
                GRAVITY *
                dt;


            if (
                dino.y >=
                GROUND_Y -
                dino.normalHeight
            ) {

                dino.y =
                    GROUND_Y -
                    dino.normalHeight;

                dino.velocityY =
                    0;

                dino.jumping =
                    false;
            }
        }

    } else {

        /*
            Ducking keeps the dino
            on the ground.

            This means holding Space
            cannot make the dino jump.
        */

        dino.jumping =
            false;

        dino.velocityY =
            0;

        dino.y =
            GROUND_Y -
            dino.duckHeight;
    }


    /*
        CACTUSES
    */

    for (
        let i =
            cactuses.length - 1;

        i >= 0;

        i--
    ) {

        const cactus =
            cactuses[i];


        cactus.x -=
            speed * dt;


        if (
            collisionCactus(
                cactus
            )
        ) {

            gameOver();

            return;
        }


        if (
            cactus.x +
            cactus.width <
            -50
        ) {

            cactuses.splice(
                i,
                1
            );

            scorePoint();
        }
    }


    /*
        FLYING DINOSAURS
    */

    for (
        let i =
            flyingDinosaurs.length - 1;

        i >= 0;

        i--
    ) {

        const fly =
            flyingDinosaurs[i];


        fly.x -=
            speed * dt;


        fly.time +=
            dt *
            0.055;


        /*
            Up and down movement.

            Still stays in the safe
            ducking height range.
        */

        fly.y =
            fly.baseY +
            Math.sin(
                fly.time +
                fly.phase
            ) * 12;


        /*
            Keep the dinosaur inside
            the intended safe vertical range.
        */

        fly.y =
            Math.max(
                FLYING_MIN_Y,
                Math.min(
                    FLYING_MAX_Y,
                    fly.y
                )
            );


        if (
            collisionFlying(
                fly
            )
        ) {

            gameOver();

            return;
        }


        if (
            fly.x +
            fly.width <
            -80
        ) {

            flyingDinosaurs.splice(
                i,
                1
            );

            scorePoint();
        }
    }


    /*
        CACTUS SPAWN
    */

    cactusSpawnTimer -=
        dt * 16.67;


    if (
        cactusSpawnTimer <= 0
    ) {

        spawnCactus();


        /*
            Cactuses spawn frequently.
        */

        cactusSpawnTimer =
            Math.max(
                650,
                1050 -
                score * 2
            ) +
            Math.random() * 500;
    }


    /*
        FLYING DINO SPAWN

        Much less frequently than
        cactuses.
    */

    flyingSpawnTimer -=
        dt * 16.67;


    if (
        flyingSpawnTimer <= 0
    ) {

        const spawned =
            spawnFlyingDinosaur();


        if (spawned) {

            flyingSpawnTimer =
                8500 +
                Math.random() * 6500;

        } else {

            /*
                If there is currently
                no safe position, wait
                and try again.
            */

            flyingSpawnTimer =
                1500;
        }
    }


    /*
        CLOUDS
    */

    for (
        let i =
            clouds.length - 1;

        i >= 0;

        i--
    ) {

        clouds[i].x -=
            0.8 * dt;


        if (
            clouds[i].x <
            -100
        ) {

            clouds.splice(
                i,
                1
            );
        }
    }


    if (
        Math.random() <
        0.003 * dt
    ) {

        clouds.push({

            x:
                WIDTH + 30,

            y:
                35 +
                Math.random() * 80
        });
    }
}


/* =========================================================
   GAME OVER
========================================================= */

function gameOver() {

    dead =
        true;

    saveBestScore();
}


/* =========================================================
   RESTART
========================================================= */

function restart() {

    score =
        0;

    speed =
        BASE_SPEED;

    dead =
        false;

    cactuses.length =
        0;

    flyingDinosaurs.length =
        0;

    clouds.length =
        0;


    cactusSpawnTimer =
        900;


    flyingSpawnTimer =
        6500 +
        Math.random() * 3000;


    dino.y =
        GROUND_Y -
        dino.normalHeight;

    dino.velocityY =
        0;

    dino.jumping =
        false;

    dino.ducking =
        false;


    spaceDown =
        false;

    spacePressedAt =
        0;

    jumpTriggered =
        false;
}


/* =========================================================
   DRAW
========================================================= */

function fillRect(
    x,
    y,
    width,
    height,
    color
) {

    ctx.fillStyle =
        color;

    ctx.fillRect(
        Math.round(x),
        Math.round(y),
        width,
        height
    );
}


function drawGround() {

    fillRect(
        0,
        GROUND_Y,
        WIDTH,
        3,
        FG
    );


    /*
        Small ground marks.
    */

    for (
        let x = 0;
        x < WIDTH;
        x += 95
    ) {

        fillRect(
            x + 25,
            GROUND_Y + 11,
            20,
            2,
            MUTED
        );
    }
}


function drawScore() {

    ctx.fillStyle =
        FG;

    ctx.font =
        "18px Arial, Helvetica, sans-serif";

    ctx.textBaseline =
        "alphabetic";


    ctx.textAlign =
        "left";

    ctx.fillText(
        "HI " +
        String(bestScore)
            .padStart(5, "0"),
        20,
        29
    );


    ctx.textAlign =
        "right";

    ctx.fillText(
        String(score)
            .padStart(5, "0"),
        WIDTH - 20,
        29
    );
}


function drawGameOver() {

    ctx.fillStyle =
        BG;

    ctx.fillRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );


    ctx.fillStyle =
        FG;

    ctx.textAlign =
        "center";

    ctx.font =
        "bold 32px Arial, Helvetica, sans-serif";

    ctx.fillText(
        "GAME OVER",
        WIDTH / 2,
        125
    );


    ctx.font =
        "17px Arial, Helvetica, sans-serif";

    ctx.fillText(
        "Tap or press SPACE to restart",
        WIDTH / 2,
        158
    );


    ctx.font =
        "15px Arial, Helvetica, sans-serif";

    ctx.fillText(
        "SCORE " +
        String(score).padStart(5, "0"),
        WIDTH / 2,
        187
    );
}


function draw() {

    ctx.clearRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );


    fillRect(
        0,
        0,
        WIDTH,
        HEIGHT,
        BG
    );


    for (
        const cloud of clouds
    ) {

        drawCloud(cloud);
    }


    drawGround();


    for (
        const cactus of cactuses
    ) {

        drawCactus(cactus);
    }


    for (
        const fly of flyingDinosaurs
    ) {

        drawFlyingDinosaur(fly);
    }


    drawDino();

    drawScore();


    if (dead) {
        drawGameOver();
    }
}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.code === "Space"
        ) {

            event.preventDefault();

            handleSpaceDown();
        }
    }
);


document.addEventListener(
    "keyup",
    function(event) {

        if (
            event.code === "Space"
        ) {

            event.preventDefault();

            handleSpaceUp();
        }
    }
);


/*
    If the window loses focus,
    release Space.
*/

window.addEventListener(
    "blur",
    function() {

        spaceDown =
            false;

        dino.ducking =
            false;
    }
);


/* =========================================================
   MOUSE / TOUCH
========================================================= */

canvas.addEventListener(
    "pointerdown",
    function(event) {

        event.preventDefault();


        if (dead) {

            restart();

            return;
        }


        if (
            !dino.jumping
        ) {

            dino.ducking =
                false;

            dino.velocityY =
                -JUMP_FORCE;

            dino.jumping =
                true;
        }
    }
);


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(time) {

    let dt =
        (time - lastTime) /
        16.67;


    lastTime =
        time;


    if (
        !Number.isFinite(dt) ||
        dt <= 0
    ) {

        dt = 1;
    }


    dt =
        Math.min(
            dt,
            2
        );


    update(dt);

    draw();


    requestAnimationFrame(
        gameLoop
    );
}


/* =========================================================
   START
========================================================= */

restart();

requestAnimationFrame(
    gameLoop
);
