<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Offline Dino Game</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{display:flex;align-items:center;justify-content:center;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}#launcher{text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center}button{font:700 16px Arial,Helvetica,sans-serif;cursor:pointer;border:2px solid #111;border-radius:8px;background:#fff;color:#111}#launchButton{padding:18px 36px;font-size:20px}#appearanceButton{padding:11px 22px}button:hover{background:#111;color:#fff}body.dark{background:#111;color:#fff}body.dark button{background:#111;color:#fff;border-color:#fff}body.dark button:hover{background:#fff;color:#111}#status{font-size:14px;color:#666}body.dark #status{color:#aaa}
</style>
</head>
<body>
<div id="launcher">
<button id="launchButton">START IN ABOUT:BLANK</button>
<button id="appearanceButton">APPEARANCE: WHITE</button>
<div id="status">Click the button to launch the game.</div>
</div>
<script>
"use strict";
const launchButton=document.getElementById("launchButton");
const appearanceButton=document.getElementById("appearanceButton");
let appearance=localStorage.getItem("dinoAppearance")||"white";
function updateAppearance(){document.body.classList.toggle("dark",appearance==="black");appearanceButton.textContent=appearance==="black"?"APPEARANCE: BLACK":"APPEARANCE: WHITE"}
appearanceButton.onclick=()=>{appearance=appearance==="white"?"black":"white";localStorage.setItem("dinoAppearance",appearance);updateAppearance()};
updateAppearance();
launchButton.onclick=()=>{
 const w=window.open("about:blank","_blank");
 if(!w){alert("Popup blocked. Allow popups for this site.");return}
 const dark=appearance==="black",bg=dark?"#111":"#fff",fg=dark?"#fff":"#111",muted=dark?"#aaa":"#555",line=dark?"#333":"#ddd";
 const gameHTML=`<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Dino Runner</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:${bg};color:${fg};font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center}#wrap{width:min(920px,96vw);text-align:center}canvas{display:block;width:100%;height:auto;aspect-ratio:3/1}#help{margin-top:14px;font-size:15px;line-height:1.6;color:${muted}}#help b{color:${fg}}.key{border:1px solid currentColor;border-radius:5px;padding:2px 7px;font-weight:bold}
</style></head><body><div id="wrap"><canvas id="game"></canvas><div id="help"><b>HOW TO PLAY</b><br>Tap <span class="key">SPACE</span> to jump. Hold <span class="key">SPACE</span> to duck. Release <span class="key">SPACE</span> to stand. Avoid the cactuses and flying dinosaurs.</div></div><script>
"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const W=900,H=300,G=250,DPR=Math.min(devicePixelRatio||1,2);canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
const BG="${bg}",FG="${fg}",LINE="${line}";
const HSKEY="dinoHighScoreV2";
let score=0,highScore=0,distance=0,speed=6,gameOver=false,last=performance.now();
try{highScore=Number(localStorage.getItem(HSKEY))||0}catch(e){highScore=0}
const dino={x:90,w:54,h:68,duckW:72,duckH:40,y:G-68,vy:0,jumping:false,ducking:false};
let cactuses=[],flyers=[],cactusTimer=900,flyerTimer=6500,spaceHeld=false,holdTimer=null;
function saveScore(){if(score>highScore){highScore=score;try{localStorage.setItem(HSKEY,String(highScore))}catch(e){}}}
function resetDino(){dino.w=54;dino.h=68;dino.y=G-dino.h;dino.vy=0;dino.jumping=false;dino.ducking=false}
function jump(){if(gameOver){restart();return}if(dino.jumping||dino.ducking)return;dino.jumping=true;dino.vy=-13.5;dino.y=G-dino.h}
function duck(){if(gameOver)return;dino.ducking=true;if(dino.jumping){dino.jumping=false;dino.vy=0}dino.y=G-dino.duckH}
function stand(){dino.ducking=false;if(!dino.jumping)dino.y=G-dino.h}
function spaceDown(){if(spaceHeld)return;spaceHeld=true;if(gameOver)return;holdTimer=setTimeout(()=>{if(spaceHeld&&!gameOver)duck()},220)}
function spaceUp(){if(!spaceHeld)return;spaceHeld=false;if(holdTimer){clearTimeout(holdTimer);holdTimer=null}if(gameOver){restart();return}if(dino.ducking){stand();return}jump()}
document.addEventListener("keydown",e=>{if(e.code!=="Space")return;e.preventDefault();if(!e.repeat)spaceDown()});
document.addEventListener("keyup",e=>{if(e.code!=="Space")return;e.preventDefault();spaceUp()});
window.addEventListener("blur",()=>{spaceHeld=false;if(holdTimer){clearTimeout(holdTimer);holdTimer=null}if(dino.ducking)stand()});
function spawnCactus(x=W+30){const tall=Math.random()<.3;const h=tall?48:34;const w=tall?22:18;cactuses.push({x,y:G-h,w,h})}
function spawnFlyer(){const x=W+80;const tooClose=cactuses.some(c=>c.x>x-300&&c.x<x+180);if(tooClose)return false;const y=118+Math.random()*30;flyers.push({x,baseY:y,w:52,h:30,t:Math.random()*6.28});return true}
function rectsHit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function dinoBox(){return dino.ducking?{x:dino.x+4,y:G-dino.duckH+7,w:dino.duckW-8,h:dino.duckH-8}:{x:dino.x+9,y:dino.y+5,w:dino.w-15,h:dino.h-7}}
function endGame(){gameOver=true;saveScore()}
function restart(){score=0;distance=0;speed=6;gameOver=false;cactuses=[];flyers=[];cactusTimer=1000;flyerTimer=6000;resetDino();last=performance.now()}
function update(dt){if(gameOver)return;const s=dt/16.6667;distance+=speed*s;score=Math.floor(distance/100);saveScore();speed=Math.min(11,6+score*.025);
 if(dino.ducking){dino.y=G-dino.duckH;dino.vy=0;dino.jumping=false}else if(dino.jumping){dino.y+=dino.vy*s;dino.vy+=.68*s;if(dino.y>=G-dino.h){dino.y=G-dino.h;dino.vy=0;dino.jumping=false}}else dino.y=G-dino.h;
 cactusTimer-=dt;if(cactusTimer<=0){spawnCactus();cactusTimer=900+Math.random()*650}
 flyerTimer-=dt;if(flyerTimer<=0){if(spawnFlyer())flyerTimer=7000+Math.random()*6500;else flyerTimer=900}
 const box=dinoBox();
 for(let i=cactuses.length-1;i>=0;i--){const c=cactuses[i];c.x-=speed*s;if(rectsHit(box,c)){endGame();return}if(c.x+c.w<-40)cactuses.splice(i,1)}
 for(let i=flyers.length-1;i>=0;i--){const f=flyers[i];f.x-=speed*s;f.t+=.055*s;f.y=f.baseY+Math.sin(f.t)*10;if(rectsHit(box,{x:f.x+5,y:f.y+5,w:f.w-10,h:f.h-8})){endGame();return}if(f.x+f.w<-40)flyers.splice(i,1)}
}
function drawDino(){const x=dino.x,y=dino.ducking?G-dino.duckH:dino.y;ctx.fillStyle=FG;
 if(dino.ducking){ctx.fillRect(x-22,y+16,20,7);ctx.fillRect(x-8,y+10,47,30);ctx.fillRect(x+31,y+3,34,27);ctx.fillRect(x+60,y+13,17,11);ctx.fillRect(x+14,y+38,7,5);ctx.fillRect(x+38,y+38,7,5);ctx.fillStyle=BG;ctx.fillRect(x+49,y+8,5,5);return}
 ctx.fillRect(x-16,y+24,19,8);ctx.fillRect(x-7,y+33,10,8);ctx.fillRect(x+5,y+24,34,43);ctx.fillRect(x+31,y+8,28,42);ctx.fillRect(x+52,y+18,15,12);ctx.fillRect(x+14,y+62,8,8);ctx.fillRect(x+33,y+62,8,8);ctx.fillStyle=BG;ctx.fillRect(x+47,y+15,5,5)}
function drawCactus(c){ctx.fillStyle=FG;ctx.fillRect(c.x,c.y,c.w,c.h);const arm=Math.max(10,c.h*.35);ctx.fillRect(c.x-8,c.y+arm,8,7);ctx.fillRect(c.x-8,c.y+arm-8,7,14);ctx.fillRect(c.x+c.w,c.y+c.h*.52,8,7);ctx.fillRect(c.x+c.w+1,c.y+c.h*.52-8,7,14)}
function drawFlyer(f){ctx.fillStyle=FG;ctx.fillRect(f.x+12,f.y+10,29,13);ctx.fillRect(f.x+35,f.y+5,12,16);ctx.fillRect(f.x+46,f.y+11,8,7);ctx.fillRect(f.x+2,f.y+2,15,8);ctx.fillRect(f.x+6,f.y+23,19,5);ctx.fillRect(f.x+20,f.y+20,5,9);ctx.fillStyle=BG;ctx.fillRect(f.x+42,f.y+8,3,3)}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);ctx.strokeStyle=LINE;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,G+.5);ctx.lineTo(W,G+.5);ctx.stroke();drawDino();cactuses.forEach(drawCactus);flyers.forEach(drawFlyer);ctx.fillStyle=FG;ctx.font="bold 18px Arial";ctx.textAlign="right";ctx.fillText("HI "+String(highScore).padStart(5,"0"),W-20,28);ctx.fillText(String(score).padStart(5,"0"),W-20,51);if(gameOver){ctx.textAlign="center";ctx.font="bold 32px Arial";ctx.fillText("GAME OVER",W/2,105);ctx.font="bold 17px Arial";ctx.fillText("Tap SPACE to restart",W/2,135)}}
function loop(now){const dt=Math.min(40,now-last);last=now;update(dt);draw();requestAnimationFrame(loop)}
resetDino();draw();requestAnimationFrame(loop);
<\/script></body></html>`;
 w.document.open();w.document.write(gameHTML);w.document.close();w.focus();
};
</script>
</body>
</html>
