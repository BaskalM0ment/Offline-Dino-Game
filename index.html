<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Offline Dino Game</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{display:flex;align-items:center;justify-content:center;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}#launcher{text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center}button{font:700 16px Arial,sans-serif;cursor:pointer;border:2px solid #111;border-radius:8px;background:#fff;color:#111}#launchButton{padding:18px 36px;font-size:20px}#appearanceButton{padding:11px 22px}button:hover{background:#111;color:#fff}body.dark{background:#111;color:#fff}body.dark button{background:#111;color:#fff;border-color:#fff}body.dark button:hover{background:#fff;color:#111}#status{font-size:14px;color:#666}body.dark #status{color:#aaa}
</style>
</head>
<body>
<div id="launcher"><button id="launchButton">START IN ABOUT:BLANK</button><button id="appearanceButton">APPEARANCE: WHITE</button><div id="status">Click the button to launch the game.</div></div>
<script>
"use strict";
const launchButton=document.getElementById("launchButton"),appearanceButton=document.getElementById("appearanceButton");
let appearance=localStorage.getItem("dinoAppearance")||"white";
function updateAppearance(){document.body.classList.toggle("dark",appearance==="black");appearanceButton.textContent=appearance==="black"?"APPEARANCE: BLACK":"APPEARANCE: WHITE"}
appearanceButton.onclick=()=>{appearance=appearance==="white"?"black":"white";localStorage.setItem("dinoAppearance",appearance);updateAppearance()};updateAppearance();
launchButton.onclick=()=>{
 const w=window.open("about:blank","_blank");if(!w){alert("Popup blocked. Allow popups for this site.");return}
 const dark=appearance==="black",bg=dark?"#111":"#fff",fg=dark?"#fff":"#111",detail=dark?"#bbb":"#444",muted=dark?"#aaa":"#555",line=dark?"#333":"#ddd";
 const gameHTML=`<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Dino Runner</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:${bg};color:${fg};font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center}#wrap{width:min(920px,96vw);text-align:center}canvas{display:block;width:100%;height:auto;aspect-ratio:3/1;background:${bg}}#help{margin-top:14px;font-size:15px;line-height:1.6;color:${muted}}#help b{color:${fg}}.key{border:1px solid currentColor;border-radius:5px;padding:2px 7px;font-weight:bold}
</style></head><body><div id="wrap"><canvas id="game" width="900" height="300"></canvas><div id="help"><b>HOW TO PLAY</b><br>Tap <span class="key">SPACE</span> to jump. Hold <span class="key">SPACE</span> to duck. Release <span class="key">SPACE</span> to stand. Avoid the cactuses and flying dinosaurs.</div></div><script>
"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const W=900,H=300,G=250,DPR=Math.min(devicePixelRatio||1,2);canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
const BG="${bg}",FG="${fg}",DETAIL="${detail}",LINE="${line}";
let score=0,highScore=0,distance=0,speed=6,gameOver=false,last=performance.now();
const dino={x:90,w:58,h:70,duckW:76,duckH:42,y:G-70,vy:0,jumping:false,ducking:false};
let cactuses=[],flyers=[],cactusTimer=850,flyerTimer=7200,spaceHeld=false,holdTimer=null;
function saveScore(){if(score>highScore)highScore=score}
function resetDino(){dino.w=58;dino.h=70;dino.y=G-dino.h;dino.vy=0;dino.jumping=false;dino.ducking=false}
function jump(){if(gameOver){restart();return}if(dino.jumping||dino.ducking)return;dino.jumping=true;dino.vy=-13.7;dino.y=G-dino.h}
function duck(){if(gameOver)return;dino.ducking=true;if(dino.jumping){dino.jumping=false;dino.vy=0}dino.y=G-dino.duckH}
function stand(){dino.ducking=false;if(!dino.jumping)dino.y=G-dino.h}
function spaceDown(){if(spaceHeld)return;spaceHeld=true;if(gameOver)return;holdTimer=setTimeout(()=>{if(spaceHeld&&!gameOver)duck()},220)}
function spaceUp(){if(!spaceHeld)return;spaceHeld=false;if(holdTimer){clearTimeout(holdTimer);holdTimer=null}if(gameOver){restart();return}if(dino.ducking){stand();return}jump()}
document.addEventListener("keydown",e=>{if(e.code!=="Space")return;e.preventDefault();if(!e.repeat)spaceDown()});document.addEventListener("keyup",e=>{if(e.code!=="Space")return;e.preventDefault();spaceUp()});
window.addEventListener("blur",()=>{spaceHeld=false;if(holdTimer){clearTimeout(holdTimer);holdTimer=null}if(dino.ducking)stand()});

// Obstacles are deliberately separated: while a flyer is active, no cactus may spawn.
// This prevents a flyer from ever appearing above a newly-created cactus.
function spawnCactus(x=W+35){
 if(flyers.some(f=>f.x<W+180))return false;
 const tall=Math.random()<.28,h=tall?52:36,w=tall?24:20;
 cactuses.push({x,y:G-h,w,h,tall});
 return true;
}
function flyerSafe(){
 const spawnX=W+90;
 if(cactuses.length>0)return false;
 return !flyers.some(f=>Math.abs(f.x-spawnX)<700);
}
function spawnFlyer(){
 if(!flyerSafe())return false;
 const y=105+Math.random()*28;
 flyers.push({x:W+90,baseY:y,w:58,h:34,t:Math.random()*6.28});
 return true;
}
function rectsHit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function dinoBox(){return dino.ducking?{x:dino.x+5,y:G-dino.duckH+8,w:dino.duckW-8,h:dino.duckH-10}:{x:dino.x+10,y:dino.y+6,w:dino.w-10,h:dino.h-8}}
function endGame(){gameOver=true;saveScore()}
function restart(){score=0;distance=0;speed=6;gameOver=false;cactuses=[];flyers=[];cactusTimer=1050;flyerTimer=7000;resetDino();last=performance.now()}
function update(dt){if(gameOver)return;const s=dt/16.6667;distance+=speed*s;score=Math.floor(distance/100);saveScore();speed=Math.min(11,6+score*.025);
 if(dino.ducking){dino.y=G-dino.duckH;dino.vy=0;dino.jumping=false}else if(dino.jumping){dino.y+=dino.vy*s;dino.vy+=.68*s;if(dino.y>=G-dino.h){dino.y=G-dino.h;dino.vy=0;dino.jumping=false}}else dino.y=G-dino.h;
 cactusTimer-=dt;if(cactusTimer<=0){const spawned=spawnCactus();cactusTimer=spawned?(1000+Math.random()*750):500}
 flyerTimer-=dt;if(flyerTimer<=0){flyerTimer=spawnFlyer()?8500+Math.random()*7000:1200}
 const box=dinoBox();
 for(let i=cactuses.length-1;i>=0;i--){const c=cactuses[i];c.x-=speed*s;if(rectsHit(box,{x:c.x+3,y:c.y+2,w:c.w-6,h:c.h-2})){endGame();return}if(c.x+c.w<-50)cactuses.splice(i,1)}
 for(let i=flyers.length-1;i>=0;i--){const f=flyers[i];f.x-=speed*s;f.t+=.055*s;f.y=f.baseY+Math.sin(f.t)*8;if(rectsHit(box,{x:f.x+7,y:f.y+6,w:f.w-13,h:f.h-11})){endGame();return}if(f.x+f.w<-50)flyers.splice(i,1)}
}
function px(x,y,w,h,c=FG){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
function drawDino(){const x=dino.x,y=dino.ducking?G-dino.duckH:dino.y;ctx.fillStyle=FG;
 if(dino.ducking){px(x-25,y+19,22,7);px(x-10,y+12,49,30);px(x+34,y+4,32,28);px(x+61,y+14,19,12);px(x+11,y+40,8,6);px(x+39,y+40,8,6);px(x+28,y+8,10,5,DETAIL);px(x+48,y+4,8,5,DETAIL);px(x+51,y+10,5,5,BG);px(x+64,y+15,3,3,BG);px(x+68,y+24,6,3,DETAIL);return}
 px(x-18,y+26,21,8);px(x-8,y+34,12,9);px(x+5,y+23,37,44);px(x+35,y+8,31,44);px(x+59,y+19,15,13);px(x+15,y+64,9,8);px(x+38,y+64,9,8);px(x+7,y+20,9,7,DETAIL);px(x+18,y+25,8,6,DETAIL);px(x+38,y+11,9,5,DETAIL);px(x+49,y+18,7,4,DETAIL);px(x+50,y+14,5,5,BG);px(x+63,y+22,4,3,BG);px(x+68,y+26,5,3,DETAIL);px(x+26,y+48,5,9,DETAIL);px(x+4,y+67,5,4,DETAIL);px(x+39,y+67,5,4,DETAIL);
}
function drawCactus(c){const x=c.x,y=c.y,w=c.w,h=c.h;ctx.fillStyle=FG;px(x,y,w,h);const arm=Math.max(11,h*.36);px(x-10,y+arm,10,7);px(x-9,y+arm-10,8,17);px(x+w,y+h*.55,10,7);px(x+w+2,y+h*.55-10,8,17);px(x+4,y+5,4,h-10,DETAIL);px(x+w-6,y+8,3,h-13,DETAIL);px(x-5,y+arm+2,5,2,DETAIL);px(x+w+3,y+h*.55+2,5,2,DETAIL)}
function drawFlyer(f){const x=f.x,y=f.y;ctx.fillStyle=FG;px(x+14,y+12,30,14);px(x+37,y+6,13,18);px(x+48,y+13,10,8);px(x+4,y+5,18,8);px(x+7,y+27,22,6);px(x+23,y+23,7,11);px(x+27,y+4,9,5,DETAIL);px(x+38,y+10,8,4,DETAIL);px(x+46,y+14,4,4,BG);px(x+52,y+16,4,3,DETAIL);px(x+17,y+7,5,4,DETAIL);px(x+11,y+28,7,3,DETAIL)}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);ctx.strokeStyle=LINE;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,G+.5);ctx.lineTo(W,G+.5);ctx.stroke();ctx.strokeStyle=LINE;ctx.lineWidth=1;for(let x=20;x<W;x+=90){ctx.beginPath();ctx.moveTo(x,G+7);ctx.lineTo(x+18,G+7);ctx.stroke()}
 drawDino();cactuses.forEach(drawCactus);flyers.forEach(drawFlyer);ctx.fillStyle=FG;ctx.font="bold 18px Arial";ctx.textAlign="right";ctx.fillText("HI "+String(highScore).padStart(5,"0"),W-20,28);ctx.fillText(String(score).padStart(5,"0"),W-20,51);if(gameOver){ctx.textAlign="center";ctx.font="bold 32px Arial";ctx.fillText("GAME OVER",W/2,105);ctx.font="bold 17px Arial";ctx.fillText("Tap SPACE to restart",W/2,135)}}
function loop(now){const dt=Math.min(40,now-last);last=now;update(dt);draw();requestAnimationFrame(loop)}
resetDino();draw();requestAnimationFrame(loop);
<\/script></body></html>`;
 w.document.open();w.document.write(gameHTML);w.document.close();w.focus();
};
</script></body></html>
