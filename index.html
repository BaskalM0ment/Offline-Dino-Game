<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dino Runner</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    background: #ffffff;
    color: #111111;
    font-family: Arial, Helvetica, sans-serif;
}

#launcher {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    text-align: center;
}

#launchButton,
#appearanceButton {
    display: block;
    appearance: none;
    -webkit-appearance: none;
    border: 2px solid #111111;
    border-radius: 8px;
    background: #ffffff;
    color: #111111;
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 700;
    cursor: pointer;
    transition: background-color 0.15s ease, color 0.15s ease;
}

#launchButton {
    padding: 18px 36px;
    font-size: 20px;
}

#appearanceButton {
    padding: 11px 22px;
    font-size: 15px;
}

#launchButton:hover,
#appearanceButton:hover {
    background-color: #111111;
    color: #ffffff;
}

#launchButton:active,
#appearanceButton:active {
    background-color: #333333;
    color: #ffffff;
}

#status {
    font-size: 14px;
    color: #666666;
}

body.dark {
    background: #111111;
    color: #ffffff;
}

body.dark #launchButton,
body.dark #appearanceButton {
    background-color: #111111;
    color: #ffffff;
    border-color: #ffffff;
}

body.dark #launchButton:hover,
body.dark #appearanceButton:hover {
    background-color: #ffffff;
    color: #111111;
}

body.dark #launchButton:active,
body.dark #appearanceButton:active {
    background-color: #dddddd;
    color: #111111;
}

body.dark #status {
    color: #aaaaaa;
}
</style>
</head>

<body>

<div id="launcher">

    <button id="launchButton" type="button">
        START IN ABOUT:BLANK
    </button>

    <button id="appearanceButton" type="button">
        APPEARANCE: WHITE
    </button>

    <div id="status">
        Click the button to launch the game.
    </div>

</div>

<script>
"use strict";

const launchButton =
    document.getElementById("launchButton");

const appearanceButton =
    document.getElementById("appearanceButton");

let appearance =
    localStorage.getItem("dinoAppearance") || "white";


function updateAppearance() {

    document.body.classList.toggle(
        "dark",
        appearance === "black"
    );

    appearanceButton.textContent =
        appearance === "black"
            ? "APPEARANCE: BLACK"
            : "APPEARANCE: WHITE";
}


appearanceButton.addEventListener(
    "click",
    function () {

        appearance =
            appearance === "white"
                ? "black"
                : "white";

        localStorage.setItem(
            "dinoAppearance",
            appearance
        );

        updateAppearance();
    }
);


updateAppearance();


launchButton.addEventListener(
    "click",
    function () {

        const gameWindow =
            window.open(
                "about:blank",
                "_blank"
            );

        if (!gameWindow) {

            alert(
                "Popup blocked. Allow popups for this site."
            );

            return;
        }


        const dark =
            appearance === "black";

        const background =
            dark ? "#111111" : "#ffffff";

        const foreground =
            dark ? "#ffffff" : "#111111";

        const secondary =
            dark ? "#333333" : "#dddddd";


        gameWindow.document.open();

        gameWindow.document.write(`
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Dino Runner</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {

    overflow: hidden;

    background: ${background};

    color: ${foreground};

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    display: flex;

    justify-content: center;

    align-items: center;
}

#gameWrapper {

    width: min(920px, 96vw);

    text-align: center;
}

#gameCanvas {

    display: block;

    width: 100%;

    height: auto;

    aspect-ratio: 3 / 1;

    touch-action: none;
}

#instructions {

    margin-top: 15px;

    color:
        ${dark ? "#cccccc" : "#555555"};

    font-size: 15px;

    line-height: 1.6;
}

#instructions strong {

    color: ${foreground};
}

.key {

    display: inline-block;

    border: 1px solid currentColor;

    border-radius: 5px;

    padding: 2px 7px;

    font-weight: bold;
}

</style>

</head>

<body>

<div id="gameWrapper">

<canvas id="gameCanvas"></canvas>

<div id="instructions">

<strong>HOW TO PLAY</strong><br>

Tap
<span class="key">SPACE</span>
to jump.
Hold
<span class="key">SPACE</span>
to duck.
Release
<span class="key">SPACE</span>
to stand.
Avoid the cactuses and flying dinosaurs.

</div>

</div>


<script>

"use strict";


/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("gameCanvas");

const ctx =
    canvas.getContext("2d");

const WIDTH = 900;

const HEIGHT = 300;

const GROUND = 250;

const DPR =
    Math.min(
        window.devicePixelRatio || 1,
        2
    );

canvas.width =
    WIDTH * DPR;

canvas.height =
    HEIGHT * DPR;

ctx.setTransform(
    DPR,
    0,
    0,
    DPR,
    0,
    0
);


/* =========================================================
   COLORS
========================================================= */

const BG =
    "${background}";

const FG =
    "${foreground}";

const SECONDARY =
    "${secondary}";


/* =========================================================
   SCORE
========================================================= */

let score = 0;

let highScore = 0;


/*
   Load the saved high score.
*/

try {

    highScore =
        Number(
            localStorage.getItem(
                "dinoHighScore"
            )
        ) || 0;

} catch (error) {

    highScore = 0;
}


function saveHighScore() {

    if (score > highScore) {

        highScore = score;

        try {

            localStorage.setItem(
                "dinoHighScore",
                String(highScore)
            );

        } catch (error) {
        }


        try {

            if (
                window.opener &&
                !window.opener.closed
            ) {

                window.opener.localStorage.setItem(
                    "dinoHighScore",
                    String(highScore)
                );
            }

        } catch (error) {
        }
    }
}


/* =========================================================
   GAME VARIABLES
========================================================= */

let gameOver = false;

let speed = 6;

let distance = 0;

let cactusTimer = 900;

let flyerTimer = 6500;

let lastTime =
    performance.now();


/* =========================================================
   DINO
========================================================= */

/*
   IMPORTANT:

   The dino always has its FEET at GROUND.

   We never move the standing/ducking dino
   through the ground.

   Jumping changes the entire dino's
   vertical position.

   Ducking only changes its height.
*/

const dino = {

    x: 90,

    normalWidth: 65,

    normalHeight: 75,

    duckWidth: 75,

    duckHeight: 43,

    y: GROUND - 75,

    velocityY: 0,

    jumping: false,

    ducking: false
};


/* =========================================================
   SPACE CONTROL
========================================================= */

let spaceHeld = false;

let spaceTimer = null;

let spaceStartTime = 0;

const HOLD_TIME = 220;


/*
   SPACE DOWN
*/

function handleSpaceDown() {

    if (spaceHeld) {
        return;
    }

    spaceHeld = true;

    spaceStartTime =
        performance.now();


    /*
       If the game is over,
       immediately prepare restart.

       The actual restart happens
       when Space is released.
    */

    if (gameOver) {
        return;
    }


    /*
       After HOLD_TIME the player
       is considered to be holding Space.
    */

    spaceTimer =
        setTimeout(
            function () {

                if (
                    spaceHeld &&
                    !gameOver
                ) {

                    startDucking();
                }

            },
            HOLD_TIME
        );
}


/*
   SPACE UP
*/

function handleSpaceUp() {

    if (!spaceHeld) {
        return;
    }

    spaceHeld = false;


    if (spaceTimer !== null) {

        clearTimeout(
            spaceTimer
        );

        spaceTimer = null;
    }


    /*
       GAME OVER

       A Space tap restarts the game.
    */

    if (gameOver) {

        restart();

        return;
    }


    /*
       If the dino is ducking,
       simply stand back up.

       This does NOT change the
       ground position.
    */

    if (dino.ducking) {

        stopDucking();

        return;
    }


    /*
       Otherwise this was a tap.

       Jump.
    */

    jump();
}


/*
   START DUCKING
*/

function startDucking() {

    if (gameOver) {
        return;
    }


    dino.ducking = true;


    /*
       If airborne, land immediately.

       This keeps the feet exactly
       on the ground and prevents
       clipping.
    */

    if (dino.jumping) {

        dino.jumping = false;

        dino.velocityY = 0;

        dino.y =
            GROUND -
            dino.duckHeight;
    }
}


/*
   STOP DUCKING
*/

function stopDucking() {

    dino.ducking = false;


    /*
       Restore the correct standing
       position.

       The feet stay at GROUND.
    */

    if (!dino.jumping) {

        dino.y =
            GROUND -
            dino.normalHeight;
    }
}


/*
   JUMP
*/

function jump() {

    if (gameOver) {

        restart();

        return;
    }


    if (dino.jumping) {
        return;
    }


    /*
       Never jump while ducking.
    */

    if (dino.ducking) {
        return;
    }


    dino.jumping = true;

    dino.velocityY = -13.5;

    dino.y =
        GROUND -
        dino.normalHeight;
}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.code !== "Space"
        ) {
            return;
        }


        event.preventDefault();


        /*
           Ignore browser auto-repeat.

           This is important because holding
           Space generates repeated keydown
           events.
        */

        if (
            event.repeat
        ) {
            return;
        }


        handleSpaceDown();

    },
    false
);


document.addEventListener(
    "keyup",
    function(event) {

        if (
            event.code !== "Space"
        ) {
            return;
        }


        event.preventDefault();


        handleSpaceUp();

    },
    false
);


/*
   Prevent stuck Space when the
   browser loses focus.
*/

window.addEventListener(
    "blur",
    function() {

        spaceHeld = false;

        dino.ducking = false;


        if (
            spaceTimer !== null
        ) {

            clearTimeout(
                spaceTimer
            );

            spaceTimer = null;
        }


        if (
            !dino.jumping
        ) {

            dino.y =
                GROUND -
                dino.normalHeight;
        }
    }
);


/* =========================================================
   DINO DRAW
========================================================= */

function drawDino() {

    const x =
        dino.x;


    /*
       Calculate the visual position.

       Ducking starts from the ground,
       so the bottom always equals GROUND.
    */

    const y =
        dino.ducking
            ? GROUND - dino.duckHeight
            : dino.y;


    ctx.fillStyle = FG;


    /* -----------------------------------------------------
       DUCKING DINO
    ----------------------------------------------------- */

    if (dino.ducking) {

        /*
           Tail
        */

        ctx.fillRect(
            x - 28,
            y + 16,
            20,
            8
        );

        ctx.fillRect(
            x - 17,
            y + 24,
            12,
            8
        );


        /*
           Body
        */

        ctx.fillRect(
            x,
            y + 12,
            50,
            31
        );


        /*
           Head
        */

        ctx.fillRect(
            x + 40,
            y + 3,
            32,
            29
        );


        /*
           Nose
        */

        ctx.fillRect(
            x + 64,
            y + 14,
            18,
            12
        );


        /*
           Eye
        */

        ctx.fillStyle = BG;

        ctx.fillRect(
            x + 58,
            y + 8,
            5,
            5
        );


        /*
           Legs
        */

        ctx.fillStyle = FG;

        ctx.fillRect(
            x + 10,
            y + 36,
            11,
            9
        );

        ctx.fillRect(
            x + 36,
            y + 36,
            11,
            9
        );


        return;
    }


    /* -----------------------------------------------------
       NORMAL DINO
    ----------------------------------------------------- */

    /*
       Tail
    */

    ctx.fillRect(
        x - 23,
        y + 24,
        10,
        8
    );

    ctx.fillRect(
        x - 16,
        y + 31,
        15,
        8
    );

    ctx.fillRect(
        x - 5,
        y + 39,
        15,
        8
    );


    /*
       Body
    */

    ctx.fillRect(
        x + 5,
        y + 30,
        43,
        38
    );


    /*
       Neck
    */

    ctx.fillRect(
        x + 38,
        y + 14,
        19,
        35
    );


    /*
       Head
    */

    ctx.fillRect(
        x + 40,
        y + 3,
        31,
        30
    );


    /*
       Nose
    */

    ctx.fillRect(
        x + 62,
        y + 17,
        19,
        12
    );


    /*
       Eye
    */

    ctx.fillStyle = BG;

    ctx.fillRect(
        x + 57,
        y + 9,
        5,
        5
    );


    /*
       Arm
    */

    ctx.fillStyle = FG;

    ctx.fillRect(
        x + 28,
        y + 41,
        15,
        5
    );


    /*
       Legs
    */

    ctx.fillRect(
        x + 12,
        y + 61,
        10,
        14
    );

    ctx.fillRect(
        x + 36,
        y + 59,
        10,
        16
    );


    /*
       Feet
    */

    ctx.fillRect(
        x + 7,
        y + 71,
        19,
        5
    );

    ctx.fillRect(
        x + 31,
        y + 71,
        21,
        5
    );
}


/* =========================================================
   CACTUSES
========================================================= */

const cactuses = [];


function spawnCactus() {

    const large =
        Math.random() < 0.3;


    cactuses.push({

        x:
            WIDTH + 40,

        width:
            large ? 58 : 38,

        height:
            large ? 78 : 54,

        large:
            large
    });
}


function drawCactus(c) {

    const x =
        c.x;

    const top =
        GROUND -
        c.height;


    ctx.fillStyle = FG;


    if (c.large) {

        /*
           Main stem
        */

        ctx.fillRect(
            x + 19,
            top,
            20,
            c.height
        );


        /*
           Left arm
        */

        ctx.fillRect(
            x + 3,
            top + 34,
            20,
            9
        );

        ctx.fillRect(
            x + 3,
            top + 22,
            9,
            22
        );


        /*
           Right arm
        */

        ctx.fillRect(
            x + 35,
            top + 43,
            22,
            9
        );

        ctx.fillRect(
            x + 49,
            top + 29,
            9,
            24
        );

    } else {

        /*
           Main stem
        */

        ctx.fillRect(
            x + 11,
            top,
            14,
            c.height
        );


        /*
           Left arm
        */

        ctx.fillRect(
            x,
            top + 27,
            15,
            8
        );

        ctx.fillRect(
            x,
            top + 17,
            8,
            19
        );


        /*
           Right arm
        */

        ctx.fillRect(
            x + 21,
            top + 33,
            17,
            8
        );

        ctx.fillRect(
            x + 30,
            top + 23,
            8,
            19
        );
    }
}


/* =========================================================
   FLYING DINOSAURS
========================================================= */

const flyers = [];


function spawnFlyer() {

    const spawnX =
        WIDTH + 350;


    /*
       Never spawn over a cactus.
    */

    for (
        const cactus of cactuses
    ) {

        if (
            Math.abs(
                cactus.x -
                spawnX
            ) < 300
        ) {

            return;
        }
    }


    const baseY =
        120 +
        Math.random() * 20;


    flyers.push({

        x:
            spawnX,

        y:
            baseY,

        baseY:
            baseY,

        width:
            80,

        height:
            44,

        phase:
            Math.random() *
            Math.PI *
            2
    });
}


function drawFlyer(fly) {

    const x =
        fly.x;

    const y =
        fly.y;


    ctx.fillStyle = FG;


    /*
       Body
    */

    ctx.fillRect(
        x + 12,
        y + 15,
        42,
        21
    );


    /*
       Head
    */

    ctx.fillRect(
        x + 44,
        y + 7,
        28,
        28
    );


    /*
       Nose
    */

    ctx.fillRect(
        x + 64,
        y + 18,
        18,
        10
    );


    /*
       Eye
    */

    ctx.fillStyle = BG;

    ctx.fillRect(
        x + 57,
        y + 12,
        5,
        5
    );


    ctx.fillStyle = FG;


    /*
       Wings
    */

    ctx.beginPath();

    ctx.moveTo(
        x + 27,
        y + 20
    );

    ctx.lineTo(
        x + 15,
        y - 8
    );

    ctx.lineTo(
        x + 5,
        y + 20
    );

    ctx.closePath();

    ctx.fill();


    ctx.beginPath();

    ctx.moveTo(
        x + 41,
        y + 19
    );

    ctx.lineTo(
        x + 33,
        y - 10
    );

    ctx.lineTo(
        x + 25,
        y + 19
    );

    ctx.closePath();

    ctx.fill();


    /*
       Tail
    */

    ctx.beginPath();

    ctx.moveTo(
        x + 15,
        y + 23
    );

    ctx.lineTo(
        x - 19,
        y + 7
    );

    ctx.lineTo(
        x - 7,
        y + 28
    );

    ctx.closePath();

    ctx.fill();
}


/* =========================================================
   COLLISION
========================================================= */

function cactusCollision(c) {

    const dinoLeft =
        dino.x + 8;

    const dinoRight =
        dino.x +
        (
            dino.ducking
                ? dino.duckWidth
                : dino.normalWidth
        );


    /*
       The top depends on the
       current body height.

       The bottom is ALWAYS GROUND.
    */

    const dinoTop =
        dino.ducking
            ? GROUND - dino.duckHeight
            : dino.y + 7;


    const cactusLeft =
        c.x + 5;

    const cactusRight =
        c.x +
        c.width -
        5;

    const cactusTop =
        GROUND -
        c.height;


    return (
        dinoRight > cactusLeft &&
        dinoLeft < cactusRight &&
        dinoTop < GROUND &&
        GROUND > cactusTop
    );
}


function flyerCollision(fly) {

    const dinoLeft =
        dino.x + 10;

    const dinoRight =
        dino.x +
        (
            dino.ducking
                ? dino.duckWidth
                : dino.normalWidth
        );


    const dinoTop =
        dino.ducking
            ? GROUND - dino.duckHeight
            : dino.y;


    const dinoBottom =
        GROUND;


    const flyLeft =
        fly.x + 8;

    const flyRight =
        fly.x +
        fly.width -
        8;

    const flyTop =
        fly.y + 5;

    const flyBottom =
        fly.y +
        fly.height -
        5;


    return (
        dinoRight > flyLeft &&
        dinoLeft < flyRight &&
        dinoTop < flyBottom &&
        dinoBottom > flyTop
    );
}


/* =========================================================
   UPDATE
========================================================= */

function update(dt) {

    if (gameOver) {
        return;
    }


    /*
       DINO PHYSICS

       Ducking has priority.
    */

    if (dino.ducking) {

        /*
           Feet remain exactly on
           the ground.
        */

        dino.jumping = false;

        dino.velocityY = 0;

        dino.y =
            GROUND -
            dino.duckHeight;

    }

    else if (dino.jumping) {

        dino.y +=
            dino.velocityY *
            dt;


        dino.velocityY +=
            0.68 *
            dt;


        /*
           Landing.

           The dino is placed exactly
           on the ground.
        */

        if (
            dino.y >=
            GROUND -
            dino.normalHeight
        ) {

            dino.y =
                GROUND -
                dino.normalHeight;

            dino.velocityY = 0;

            dino.jumping = false;
        }
    }

    else {

        /*
           Standing dino stays
           exactly on the ground.
        */

        dino.y =
            GROUND -
            dino.normalHeight;
    }


    /*
       CACTUSES
    */

    for (
        let i =
            cactuses.length - 1;

        i >= 0;

        i--
    ) {

        const cactus =
            cactuses[i];


        cactus.x -=
            speed * dt;


        if (
            cactusCollision(cactus)
        ) {

            endGame();

            return;
        }


        if (
            cactus.x +
            cactus.width <
            -60
        ) {

            cactuses.splice(
                i,
                1
            );
        }
    }


    /*
       FLYING DINOSAURS
    */

    for (
        let i =
            flyers.length - 1;

        i >= 0;

        i--
    ) {

        const fly =
            flyers[i];


        fly.x -=
            speed * dt;


        fly.phase +=
            0.045 * dt;


        fly.y =
            fly.baseY +
            Math.sin(
                fly.phase
            ) * 10;


        /*
           Keep flying dinosaurs
           high enough to duck under.
        */

        fly.y =
            Math.max(
                115,
                Math.min(
                    155,
                    fly.y
                )
            );


        if (
            flyerCollision(fly)
        ) {

            endGame();

            return;
        }


        if (
            fly.x +
            fly.width <
            -80
        ) {

            flyers.splice(
                i,
                1
            );
        }
    }


    /*
       CACTUS SPAWN
    */

    cactusTimer -=
        16.67 * dt;


    if (
        cactusTimer <= 0
    ) {

        spawnCactus();


        cactusTimer =
            850 +
            Math.random() * 500;
    }


    /*
       FLYING DINO SPAWN

       Rare compared with cactuses.
    */

    flyerTimer -=
        16.67 * dt;


    if (
        flyerTimer <= 0
    ) {

        spawnFlyer();


        flyerTimer =
            7500 +
            Math.random() * 6000;
    }


    /*
       SCORE
    */

    distance +=
        speed *
        dt;


    const newScore =
        Math.floor(
            distance / 100
        );


    if (
        newScore > score
    ) {

        score =
            newScore;

        saveHighScore();
    }


    /*
       SPEED
    */

    speed =
        Math.min(
            11,
            6 +
            score * 0.025
        );
}


/* =========================================================
   GAME OVER
========================================================= */

function endGame() {

    gameOver = true;

    saveHighScore();
}


/* =========================================================
   RESTART
========================================================= */

function restart() {

    score = 0;

    distance = 0;

    speed = 6;

    gameOver = false;

    cactusTimer = 900;

    flyerTimer =
        6500 +
        Math.random() * 2500;


    cactuses.length = 0;

    flyers.length = 0;


    dino.jumping = false;

    dino.ducking = false;

    dino.velocityY = 0;

    dino.y =
        GROUND -
        dino.normalHeight;


    /*
       Clear any leftover Space timer.
    */

    if (
        spaceTimer !== null
    ) {

        clearTimeout(
            spaceTimer
        );

        spaceTimer = null;
    }
}


/* =========================================================
   DRAW GROUND
========================================================= */

function drawGround() {

    ctx.fillStyle = FG;

    ctx.fillRect(
        0,
        GROUND,
        WIDTH,
        3
    );


    ctx.fillStyle =
        SECONDARY;


    for (
        let x = 0;
        x < WIDTH;
        x += 100
    ) {

        ctx.fillRect(
            x + 20,
            GROUND + 12,
            24,
            2
        );
    }
}


/* =========================================================
   DRAW SCORE
========================================================= */

function drawScore() {

    ctx.fillStyle = FG;

    ctx.font =
        "18px Arial, Helvetica, sans-serif";

    ctx.textBaseline =
        "alphabetic";


    ctx.textAlign =
        "left";

    ctx.fillText(
        "HI " +
        String(highScore)
            .padStart(5, "0"),
        20,
        28
    );


    ctx.textAlign =
        "right";

    ctx.fillText(
        String(score)
            .padStart(5, "0"),
        WIDTH - 20,
        28
    );
}


/* =========================================================
   GAME OVER SCREEN
========================================================= */

function drawGameOver() {

    ctx.fillStyle = BG;

    ctx.fillRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );


    ctx.fillStyle = FG;

    ctx.textAlign =
        "center";


    ctx.font =
        "bold 32px Arial, Helvetica, sans-serif";

    ctx.fillText(
        "GAME OVER",
        WIDTH / 2,
        125
    );


    ctx.font =
        "17px Arial, Helvetica, sans-serif";

    ctx.fillText(
        "Tap SPACE to restart",
        WIDTH / 2,
        158
    );


    ctx.font =
        "15px Arial, Helvetica, sans-serif";

    ctx.fillText(
        "SCORE " +
        String(score)
            .padStart(5, "0"),
        WIDTH / 2,
        188
    );
}


/* =========================================================
   DRAW
========================================================= */

function draw() {

    ctx.fillStyle = BG;

    ctx.fillRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );


    drawGround();


    for (
        const cactus of cactuses
    ) {

        drawCactus(cactus);
    }


    for (
        const flyer of flyers
    ) {

        drawFlyer(flyer);
    }


    drawDino();

    drawScore();


    if (gameOver) {

        drawGameOver();
    }
}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(time) {

    let dt =
        (time - lastTime) /
        16.67;


    lastTime =
        time;


    if (
        !Number.isFinite(dt) ||
        dt <= 0
    ) {

        dt = 1;
    }


    dt =
        Math.min(
            dt,
            2
        );


    update(dt);

    draw();


    requestAnimationFrame(
        gameLoop
    );
}


/* =========================================================
   START
========================================================= */

restart();

requestAnimationFrame(
    gameLoop
);
