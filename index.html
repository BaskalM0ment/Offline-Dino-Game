<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dino Runner</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    background: #ffffff;
    color: #111111;
    font-family: Arial, Helvetica, sans-serif;
}

#launcher {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    text-align: center;
}

button {
    font-family: Arial, Helvetica, sans-serif;
    font-weight: bold;
    cursor: pointer;
}

#launchButton {
    padding: 18px 35px;
    font-size: 20px;
    border: 2px solid #111111;
    border-radius: 8px;
    background: #ffffff;
    color: #111111;
}

#launchButton:hover {
    background: #111111;
    color: #ffffff;
}

#appearanceButton {
    padding: 11px 22px;
    font-size: 15px;
    border: 2px solid #111111;
    border-radius: 8px;
    background: #ffffff;
    color: #111111;
}

#appearanceButton:hover {
    background: #111111;
    color: #ffffff;
}

#status {
    font-size: 14px;
    opacity: 0.65;
}

body.dark {
    background: #111111;
    color: #ffffff;
}

body.dark #launchButton,
body.dark #appearanceButton {
    background: #111111;
    color: #ffffff;
    border-color: #ffffff;
}

body.dark #launchButton:hover,
body.dark #appearanceButton:hover {
    background: #ffffff;
    color: #111111;
}
</style>
</head>

<body>

<div id="launcher">

    <button id="launchButton">
        START IN ABOUT:BLANK
    </button>

    <button id="appearanceButton">
        APPEARANCE: WHITE
    </button>

    <div id="status">
        The game opens in a new about:blank page.
    </div>

</div>

<script>
"use strict";

const appearanceButton =
    document.getElementById("appearanceButton");

const launchButton =
    document.getElementById("launchButton");

let appearance =
    localStorage.getItem("dinoAppearance") || "white";

function updateAppearance() {

    document.body.classList.toggle(
        "dark",
        appearance === "black"
    );

    appearanceButton.textContent =
        appearance === "black"
            ? "APPEARANCE: BLACK"
            : "APPEARANCE: WHITE";
}

updateAppearance();

appearanceButton.addEventListener("click", function () {

    appearance =
        appearance === "white"
            ? "black"
            : "white";

    localStorage.setItem(
        "dinoAppearance",
        appearance
    );

    updateAppearance();
});


launchButton.addEventListener("click", function () {

    /*
        Open about:blank directly from the
        button click. This avoids popup blockers.
    */

    const gameWindow =
        window.open("about:blank", "_blank");

    if (!gameWindow) {

        alert(
            "Your browser blocked the new window. Allow popups for this site."
        );

        return;
    }


    const gameCode = `

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Dino Runner</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {

    overflow: hidden;

    background:
        ${appearance === "black"
            ? "#111111"
            : "#ffffff"};

    color:
        ${appearance === "black"
            ? "#ffffff"
            : "#111111"};

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    display: flex;

    justify-content: center;

    align-items: center;
}

#gameWrapper {

    width: min(920px, 96vw);

    text-align: center;
}

canvas {

    display: block;

    width: 100%;

    height: auto;

    aspect-ratio: 3 / 1;

    touch-action: none;
}

#instructions {

    margin-top: 15px;

    font-size: 15px;

    line-height: 1.6;

    color:
        ${appearance === "black"
            ? "#cccccc"
            : "#555555"};
}

#instructions strong {

    color:
        ${appearance === "black"
            ? "#ffffff"
            : "#111111"};
}

.key {

    display: inline-block;

    border: 1px solid currentColor;

    border-radius: 5px;

    padding: 1px 7px;

    font-weight: bold;
}

</style>

</head>

<body>

<div id="gameWrapper">

<canvas id="game"></canvas>

<div id="instructions">

<strong>HOW TO PLAY</strong><br>

Tap <span class="key">SPACE</span> to jump.
Hold <span class="key">SPACE</span> to duck.
Release <span class="key">SPACE</span> to stand.
Avoid the cactuses and flying dinosaurs.

</div>

</div>


<script>

"use strict";


/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

const W = 900;
const H = 300;

const groundY = 250;

const pixelRatio =
    Math.min(
        window.devicePixelRatio || 1,
        2
    );

canvas.width =
    W * pixelRatio;

canvas.height =
    H * pixelRatio;

ctx.setTransform(
    pixelRatio,
    0,
    0,
    pixelRatio,
    0,
    0
);


/* =========================================================
   COLORS
========================================================= */

const darkMode =
    "${appearance}" === "black";

const BG =
    darkMode
        ? "#111111"
        : "#ffffff";

const FG =
    darkMode
        ? "#ffffff"
        : "#111111";

const LIGHT =
    darkMode
        ? "#292929"
        : "#dddddd";


/* =========================================================
   SCORE
========================================================= */

let score = 0;

let highScore = 0;


/*
    Use the opener's localStorage.

    The about:blank page inherits the opener's
    origin, but this also gives us a fallback.
*/

function loadHighScore() {

    try {

        if (
            window.opener &&
            !window.opener.closed
        ) {

            const saved =
                window.opener.localStorage.getItem(
                    "dinoHighScore"
                );

            highScore =
                Number(saved) || 0;

            return;
        }

    } catch (error) {
    }


    try {

        highScore =
            Number(
                localStorage.getItem(
                    "dinoHighScore"
                )
            ) || 0;

    } catch (error) {

        highScore = 0;
    }
}


function saveHighScore() {

    if (score <= highScore) {
        return;
    }

    highScore = score;


    try {

        if (
            window.opener &&
            !window.opener.closed
        ) {

            window.opener.localStorage.setItem(
                "dinoHighScore",
                String(highScore)
            );

        }

    } catch (error) {
    }


    try {

        localStorage.setItem(
            "dinoHighScore",
            String(highScore)
        );

    } catch (error) {
    }
}


loadHighScore();


/* =========================================================
   GAME STATE
========================================================= */

let gameOver = false;

let speed = 6;

let distance = 0;

let cactusTimer = 850;

let flyingTimer = 6500;

let lastTime =
    performance.now();


/* =========================================================
   DINO
========================================================= */

const dino = {

    x: 90,

    normalWidth: 62,

    normalHeight: 75,

    duckWidth: 72,

    duckHeight: 43,

    y:
        groundY - 75,

    velocityY: 0,

    jumping: false,

    ducking: false
};


/* =========================================================
   SPACE CONTROL
========================================================= */

let spaceHeld = false;

let spaceDownTime = 0;

let duckTimer = null;


/*
    Important:

    A short tap = jump.

    A hold = duck.

    The timer only activates ducking.
    It never removes the ability to jump.
*/

const HOLD_DELAY = 180;


function spaceDown() {

    if (spaceHeld) {
        return;
    }

    spaceHeld = true;

    spaceDownTime =
        performance.now();


    /*
        Wait before ducking.

        If the player releases before
        this timer fires, it becomes
        a jump.
    */

    duckTimer =
        setTimeout(function () {

            if (
                spaceHeld &&
                !gameOver
            ) {

                dino.ducking =
                    true;

                /*
                    If the player was in
                    the air, bring the dino
                    down instead of making
                    ducking impossible.
                */

                if (dino.jumping) {

                    dino.velocityY =
                        Math.max(
                            dino.velocityY,
                            3
                        );
                }
            }

        }, HOLD_DELAY);
}


function spaceUp() {

    if (!spaceHeld) {
        return;
    }

    spaceHeld = false;


    if (duckTimer !== null) {

        clearTimeout(
            duckTimer
        );

        duckTimer = null;
    }


    const heldTime =
        performance.now() -
        spaceDownTime;


    /*
        Short press = jump.

        This is the part that fixes
        jumping not working.
    */

    if (
        heldTime < HOLD_DELAY &&
        !gameOver
    ) {

        dino.ducking = false;

        jump();
    }


    /*
        Releasing Space always
        stops ducking.
    */

    dino.ducking = false;
}


function jump() {

    if (
        gameOver
    ) {

        restart();

        return;
    }


    /*
        Cannot jump while already airborne.
    */

    if (dino.jumping) {
        return;
    }


    dino.ducking = false;

    dino.jumping = true;

    dino.velocityY = -13.2;

    dino.y =
        groundY -
        dino.normalHeight;
}


/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener(
    "keydown",
    function(event) {

        if (
            event.code === "Space"
        ) {

            event.preventDefault();

            spaceDown();
        }

    },
    {
        passive: false
    }
);


window.addEventListener(
    "keyup",
    function(event) {

        if (
            event.code === "Space"
        ) {

            event.preventDefault();

            spaceUp();
        }

    },
    {
        passive: false
    }
);


/*
    Prevent stuck ducking if the
    browser loses focus.
*/

window.addEventListener(
    "blur",
    function() {

        spaceHeld = false;

        dino.ducking = false;

        if (duckTimer !== null) {

            clearTimeout(
                duckTimer
            );

            duckTimer = null;
        }
    }
);


/* =========================================================
   DINO DRAWING
========================================================= */

function drawDino() {

    const x = dino.x;

    const y =
        dino.ducking
            ? groundY - 43
            : dino.y;


    ctx.fillStyle = FG;


    if (dino.ducking) {

        /*
            Tail
        */

        ctx.fillRect(
            x - 20,
            y + 20,
            20,
            8
        );

        ctx.fillRect(
            x - 28,
            y + 14,
            12,
            8
        );


        /*
            Body
        */

        ctx.fillRect(
            x,
            y + 13,
            52,
            29
        );


        /*
            Head
        */

        ctx.fillRect(
            x + 42,
            y + 3,
            30,
            28
        );


        /*
            Nose
        */

        ctx.fillRect(
            x + 65,
            y + 14,
            16,
            11
        );


        /*
            Eye
        */

        ctx.fillStyle = BG;

        ctx.fillRect(
            x + 59,
            y + 8,
            5,
            5
        );


        /*
            Legs
        */

        ctx.fillStyle = FG;

        ctx.fillRect(
            x + 12,
            y + 37,
            10,
            8
        );

        ctx.fillRect(
            x + 38,
            y + 37,
            10,
            8
        );

        return;
    }


    /*
        NORMAL DINO
    */

    /*
        Tail
    */

    ctx.fillRect(
        x - 5,
        y + 39,
        13,
        8
    );

    ctx.fillRect(
        x - 16,
        y + 31,
        14,
        8
    );

    ctx.fillRect(
        x - 23,
        y + 24,
        10,
        8
    );


    /*
        Body
    */

    ctx.fillRect(
        x + 5,
        y + 30,
        43,
        38
    );


    /*
        Neck
    */

    ctx.fillRect(
        x + 38,
        y + 14,
        19,
        35
    );


    /*
        Head
    */

    ctx.fillRect(
        x + 40,
        y + 3,
        31,
        30
    );


    /*
        Nose
    */

    ctx.fillRect(
        x + 62,
        y + 17,
        19,
        12
    );


    /*
        Eye
    */

    ctx.fillStyle = BG;

    ctx.fillRect(
        x + 57,
        y + 9,
        5,
        5
    );


    /*
        Arm
    */

    ctx.fillStyle = FG;

    ctx.fillRect(
        x + 27,
        y + 41,
        16,
        5
    );


    /*
        Legs
    */

    ctx.fillRect(
        x + 12,
        y + 61,
        10,
        14
    );

    ctx.fillRect(
        x + 36,
        y + 59,
        10,
        16
    );


    /*
        Feet
    */

    ctx.fillRect(
        x + 7,
        y + 71,
        18,
        5
    );

    ctx.fillRect(
        x + 31,
        y + 71,
        20,
        5
    );
}


/* =========================================================
   CACTUSES
========================================================= */

const cactuses = [];


function spawnCactus() {

    const large =
        Math.random() < 0.3;


    cactuses.push({

        x:
            W + 30,

        width:
            large ? 58 : 38,

        height:
            large ? 78 : 54,

        large:
            large
    });
}


function drawCactus(c) {

    const x = c.x;

    const bottom =
        groundY;

    ctx.fillStyle = FG;


    if (c.large) {

        const top =
            bottom - 78;


        /*
            Main stem
        */

        ctx.fillRect(
            x + 20,
            top,
            20,
            78
        );


        /*
            Left arm
        */

        ctx.fillRect(
            x + 5,
            top + 35,
            20,
            9
        );

        ctx.fillRect(
            x + 5,
            top + 22,
            9,
            23
        );


        /*
            Right arm
        */

        ctx.fillRect(
            x + 35,
            top + 44,
            23,
            9
        );

        ctx.fillRect(
            x + 49,
            top + 30,
            9,
            24
        );

    } else {

        const top =
            bottom - 54;


        ctx.fillRect(
            x + 11,
            top,
            14,
            54
        );


        ctx.fillRect(
            x,
            top + 28,
            15,
            8
        );

        ctx.fillRect(
            x,
            top + 18,
            8,
            19
        );


        ctx.fillRect(
            x + 21,
            top + 34,
            17,
            8
        );

        ctx.fillRect(
            x + 30,
            top + 24,
            8,
            19
        );
    }
}


/* =========================================================
   FLYING DINOSAURS
========================================================= */

const flyers = [];


/*
    Flyers stay high.

    The dino's duck hitbox ends around
    groundY - 43.

    Flyers are far above that.
*/

function spawnFlyer() {

    /*
        Check the next section of track.

        Do not spawn a flyer if a cactus
        is close to the same horizontal
        area.
    */

    const spawnX =
        W + 350;


    for (
        const cactus of cactuses
    ) {

        if (
            Math.abs(
                cactus.x -
                spawnX
            ) < 280
        ) {

            return;
        }
    }


    flyers.push({

        x:
            spawnX,

        y:
            125 +
            Math.random() * 25,

        baseY:
            125 +
            Math.random() * 25,

        width:
            78,

        height:
            43,

        movement:
            Math.random() *
            Math.PI *
            2
    });
}


function drawFlyer(fly) {

    const x =
        fly.x;

    const y =
        fly.y;

    ctx.fillStyle = FG;


    /*
        Body
    */

    ctx.fillRect(
        x + 12,
        y + 15,
        40,
        20
    );


    /*
        Head
    */

    ctx.fillRect(
        x + 43,
        y + 7,
        27,
        27
    );


    /*
        Nose
    */

    ctx.fillRect(
        x + 63,
        y + 18,
        17,
        10
    );


    /*
        Eye
    */

    ctx.fillStyle = BG;

    ctx.fillRect(
        x + 56,
        y + 12,
        5,
        5
    );


    ctx.fillStyle = FG;


    /*
        Wings
    */

    ctx.beginPath();

    ctx.moveTo(
        x + 27,
        y + 19
    );

    ctx.lineTo(
        x + 15,
        y - 8
    );

    ctx.lineTo(
        x + 5,
        y + 19
    );

    ctx.closePath();

    ctx.fill();


    ctx.beginPath();

    ctx.moveTo(
        x + 40,
        y + 18
    );

    ctx.lineTo(
        x + 32,
        y - 12
    );

    ctx.lineTo(
        x + 24,
        y + 18
    );

    ctx.closePath();

    ctx.fill();


    /*
        Tail
    */

    ctx.beginPath();

    ctx.moveTo(
        x + 15,
        y + 22
    );

    ctx.lineTo(
        x - 18,
        y + 7
    );

    ctx.lineTo(
        x - 7,
        y + 27
    );

    ctx.closePath();

    ctx.fill();
}


/* =========================================================
   COLLISION
========================================================= */

function hitCactus(c) {

    const left =
        dino.x + 8;

    const right =
        dino.x +
        (
            dino.ducking
                ? 70
                : 63
        );

    const top =
        dino.ducking
            ? groundY - 43
            : dino.y + 8;


    const cactusLeft =
        c.x + 5;

    const cactusRight =
        c.x +
        c.width -
        5;

    const cactusTop =
        groundY -
        c.height +
        5;


    return (
        right > cactusLeft &&
        left < cactusRight &&
        top < groundY &&
        groundY > cactusTop
    );
}


function hitFlyer(fly) {

    const left =
        dino.x + 10;

    const right =
        dino.x + 66;


    const top =
        dino.ducking
            ? groundY - 43
            : dino.y + 8;


    const bottom =
        dino.ducking
            ? groundY
            : dino.y +
              dino.normalHeight;


    const flyLeft =
        fly.x + 8;

    const flyRight =
        fly.x +
        fly.width -
        8;

    const flyTop =
        fly.y + 4;

    const flyBottom =
        fly.y +
        fly.height -
        4;


    return (
        right > flyLeft &&
        left < flyRight &&
        bottom > flyTop &&
        top < flyBottom
    );
}


/* =========================================================
   SCORE
========================================================= */

function updateScore() {

    distance += speed;


    /*
        Score increases continuously.

        This fixes the score staying at
        one number.
    */

    const newScore =
        Math.floor(
            distance / 100
        );


    if (
        newScore > score
    ) {

        score =
            newScore;

        saveHighScore();
    }


    speed =
        Math.min(
            11,
            6 +
            score * 0.025
        );
}


/* =========================================================
   UPDATE
========================================================= */

function update(dt) {

    if (gameOver) {
        return;
    }


    /*
        DINO
    */

    if (
        dino.ducking
    ) {

        dino.jumping =
            false;

        dino.velocityY =
            0;

        dino.y =
            groundY -
            dino.duckHeight;

    } else if (
        dino.jumping
    ) {

        dino.y +=
            dino.velocityY *
            dt;

        dino.velocityY +=
            0.68 *
            dt;


        if (
            dino.y >=
            groundY -
            dino.normalHeight
        ) {

            dino.y =
                groundY -
                dino.normalHeight;

            dino.velocityY =
                0;

            dino.jumping =
                false;
        }
    }


    /*
        CACTUSES
    */

    for (
        let i =
            cactuses.length - 1;

        i >= 0;

        i--
    ) {

        const c =
            cactuses[i];


        c.x -=
            speed * dt;


        if (
            hitCactus(c)
        ) {

            endGame();

            return;
        }


        if (
            c.x +
            c.width <
            -50
        ) {

            cactuses.splice(
                i,
                1
            );
        }
    }


    /*
        FLYING DINOSAURS
    */

    for (
        let i =
            flyers.length - 1;

        i >= 0;

        i--
    ) {

        const fly =
            flyers[i];


        fly.x -=
            speed * dt;


        fly.movement +=
            0.045 * dt;


        fly.y =
            fly.baseY +
            Math.sin(
                fly.movement
            ) * 12;


        /*
            Keep flyers in the
            safe ducking zone.
        */

        fly.y =
            Math.max(
                120,
                Math.min(
                    160,
                    fly.y
                )
            );


        if (
            hitFlyer(fly)
        ) {

            endGame();

            return;
        }


        if (
            fly.x +
            fly.width <
            -80
        ) {

            flyers.splice(
                i,
                1
            );
        }
    }


    /*
        CACTUS SPAWNING
    */

    cactusTimer -=
        16.67 * dt;


    if (
        cactusTimer <= 0
    ) {

        spawnCactus();


        cactusTimer =
            850 +
            Math.random() *
            550;
    }


    /*
        FLYER SPAWNING

        Flyers are much rarer.
    */

    flyingTimer -=
        16.67 * dt;


    if (
        flyingTimer <= 0
    ) {

        spawnFlyer();


        flyingTimer =
            7000 +
            Math.random() *
            6000;
    }


    updateScore();
}


/* =========================================================
   GAME OVER
========================================================= */

function endGame() {

    gameOver = true;

    saveHighScore();
}


/* =========================================================
   RESTART
========================================================= */

function restart() {

    score = 0;

    distance = 0;

    speed = 6;

    gameOver = false;

    cactusTimer = 850;

    flyingTimer =
        6000 +
        Math.random() * 3000;


    cactuses.length = 0;

    flyers.length = 0;


    dino.y =
        groundY -
        dino.normalHeight;

    dino.velocityY = 0;

    dino.jumping = false;

    dino.ducking = false;
}


/* =========================================================
   DRAW
========================================================= */

function drawGround() {

    ctx.fillStyle = FG;

    ctx.fillRect(
        0,
        groundY,
        W,
        3
    );


    ctx.fillStyle = LIGHT;


    for (
        let x = 0;
        x < W;
        x += 100
    ) {

        ctx.fillRect(
            x + 20,
            groundY + 12,
            24,
            2
        );
    }
}


function drawScore() {

    ctx.fillStyle = FG;

    ctx.font =
        "18px Arial, Helvetica, sans-serif";


    ctx.textAlign =
        "left";

    ctx.fillText(
        "HI " +
        String(highScore)
            .padStart(5, "0"),
        20,
        28
    );


    ctx.textAlign =
        "right";

    ctx.fillText(
        String(score)
            .padStart(5, "0"),
        W - 20,
        28
    );
}


function drawGameOver() {

    ctx.fillStyle = BG;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    ctx.fillStyle = FG;

    ctx.textAlign =
        "center";


    ctx.font =
        "bold 32px Arial, Helvetica, sans-serif";

    ctx.fillText(
        "GAME OVER",
        W / 2,
        125
    );


    ctx.font =
        "17px Arial, Helvetica, sans-serif";

    ctx.fillText(
        "Press SPACE to restart",
        W / 2,
        158
    );


    ctx.font =
        "15px Arial, Helvetica, sans-serif";

    ctx.fillText(
        "SCORE " +
        String(score).padStart(5, "0"),
        W / 2,
        188
    );
}


function draw() {

    ctx.fillStyle = BG;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    drawGround();


    for (
        const c of cactuses
    ) {

        drawCactus(c);
    }


    for (
        const fly of flyers
    ) {

        drawFlyer(fly);
    }


    drawDino();

    drawScore();


    if (gameOver) {

        drawGameOver();
    }
}


/* =========================================================
   GAME LOOP
========================================================= */

function loop(time) {

    let dt =
        (time - lastTime) /
        16.67;


    lastTime =
        time;


    dt =
        Math.min(
            dt,
            2
        );


    update(dt);

    draw();

    requestAnimationFrame(
        loop
    );
}


/* =========================================================
   START
========================================================= */

restart();

requestAnimationFrame(
    loop
);
