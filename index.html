<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dino Game</title>

<style>
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    background: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
}

#launch {
    padding: 18px 40px;
    border: 2px solid #222;
    border-radius: 8px;
    background: #fff;
    color: #222;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
}

#launch:hover {
    background: #222;
    color: #fff;
}
</style>
</head>

<body>

<button id="launch">
    START IN ABOUT:BLANK
</button>

<script>

/* =========================================
   HIGH SCORE STORAGE
========================================= */

function getHighScore() {

    const value =
        Number(
            localStorage.getItem(
                "dinoHighScore"
            )
        );

    if (
        !Number.isFinite(value) ||
        value < 0
    ) {
        return 0;
    }

    return Math.floor(value);
}


/* =========================================
   RECEIVE HIGH SCORE FROM GAME
========================================= */

window.addEventListener(
    "message",
    function(event) {

        if (
            !event.data ||
            event.data.type !==
                "DINO_HIGH_SCORE"
        ) {
            return;
        }


        const score =
            Number(event.data.score);


        if (
            !Number.isFinite(score) ||
            score < 0
        ) {
            return;
        }


        const currentHighScore =
            getHighScore();


        if (
            score > currentHighScore
        ) {

            localStorage.setItem(
                "dinoHighScore",
                String(
                    Math.floor(score)
                )
            );
        }

    }
);


/* =========================================
   LAUNCH GAME
========================================= */

document
    .getElementById("launch")
    .addEventListener(
        "click",
        function() {

            const gameWindow =
                window.open(
                    "about:blank",
                    "_blank"
                );


            if (!gameWindow) {

                alert(
                    "Please allow popups for this site."
                );

                return;
            }


            /*
                Get the saved high score
                BEFORE creating the game.
            */

            const savedHighScore =
                getHighScore();


            gameWindow.document.open();


            gameWindow.document.write(`

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Dino</title>


<style>

html,
body {

    width: 100%;
    height: 100%;

    margin: 0;

    padding: 0;

    overflow: hidden;

    background: #ffffff;

}


body {

    display: flex;

    justify-content: center;

    align-items: center;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}


#gameContainer {

    width: 900px;

    height: 300px;

}


canvas {

    display: block;

    width: 900px;

    height: 300px;

}

</style>

</head>


<body>


<div id="gameContainer">

<canvas id="game"></canvas>

</div>


<script>

/* =========================================
   CANVAS
========================================= */

const canvas =
    document.getElementById(
        "game"
    );


const ctx =
    canvas.getContext(
        "2d"
    );


const WIDTH = 900;

const HEIGHT = 300;


const dpr =
    Math.max(
        1,
        window.devicePixelRatio || 1
    );


canvas.width =
    WIDTH * dpr;


canvas.height =
    HEIGHT * dpr;


canvas.style.width =
    WIDTH + "px";


canvas.style.height =
    HEIGHT + "px";


ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
);


/* =========================================
   GAME SETTINGS
========================================= */

const GROUND = 255;


/*
    Jump height.

    This keeps the Dino inside
    the game area.
*/

const JUMP_POWER = 12.5;

const GRAVITY = 0.62;


/* =========================================
   GAME STATE
========================================= */

let dino = {

    x: 90,

    y: GROUND - 75,

    velocity: 0,

    jumping: false

};


let obstacles = [];

let clouds = [];


let score = 0;


/*
    HIGH SCORE FROM LAUNCHER
*/

let highScore =
    ${savedHighScore};


let speed = 6;


let obstacleTimer = 800;

let cloudTimer = 1200;


let dead = false;


let lastTime =
    performance.now();


/* =========================================
   DRAW RECTANGLE
========================================= */

function rect(
    x,
    y,
    width,
    height,
    color
) {

    ctx.fillStyle =
        color;

    ctx.fillRect(
        Math.round(x),
        Math.round(y),
        width,
        height
    );
}


/* =========================================
   DINO
========================================= */

function drawDino() {

    const x = dino.x;

    const y = dino.y;

    const color = "#222";


    /* Tail */

    rect(
        x - 7,
        y + 38,
        14,
        8,
        color
    );

    rect(
        x - 15,
        y + 31,
        13,
        8,
        color
    );

    rect(
        x - 21,
        y + 25,
        10,
        7,
        color
    );


    /* Body */

    rect(
        x + 6,
        y + 28,
        41,
        37,
        color
    );


    /* Back spikes */

    rect(
        x + 8,
        y + 22,
        8,
        8,
        color
    );

    rect(
        x + 18,
        y + 17,
        8,
        10,
        color
    );

    rect(
        x + 28,
        y + 13,
        8,
        14,
        color
    );


    /* Neck */

    rect(
        x + 35,
        y + 13,
        19,
        32,
        color
    );


    /* Head */

    rect(
        x + 38,
        y + 3,
        30,
        29,
        color
    );


    /* Snout */

    rect(
        x + 58,
        y + 16,
        19,
        13,
        color
    );

    rect(
        x + 67,
        y + 21,
        10,
        8,
        color
    );


    /* Eye */

    rect(
        x + 56,
        y + 8,
        5,
        5,
        "#ffffff"
    );


    /* Mouth */

    rect(
        x + 62,
        y + 27,
        12,
        2,
        "#ffffff"
    );


    /* Arm */

    rect(
        x + 25,
        y + 40,
        18,
        7,
        color
    );

    rect(
        x + 19,
        y + 44,
        10,
        6,
        color
    );


    /* Legs */

    rect(
        x + 12,
        y + 58,
        10,
        17,
        color
    );

    rect(
        x + 35,
        y + 57,
        10,
        18,
        color
    );


    /* Feet */

    rect(
        x + 7,
        y + 70,
        18,
        5,
        color
    );

    rect(
        x + 31,
        y + 70,
        19,
        5,
        color
    );
}


/* =========================================
   LARGE CACTUS
========================================= */

function drawLargeCactus(cactus) {

    const x =
        cactus.x;

    const y =
        GROUND - 78;

    const color =
        "#222";


    /* Main stem */

    rect(
        x + 18,
        y,
        20,
        78,
        color
    );


    /* Left branch */

    rect(
        x + 2,
        y + 36,
        22,
        9,
        color
    );

    rect(
        x + 2,
        y + 23,
        9,
        22,
        color
    );


    /* Right branch */

    rect(
        x + 34,
        y + 43,
        24,
        9,
        color
    );

    rect(
        x + 49,
        y + 29,
        9,
        23,
        color
    );
}


/* =========================================
   SMALL CACTUS
========================================= */

function drawSmallCactus(cactus) {

    const x =
        cactus.x;

    const y =
        GROUND - 54;

    const color =
        "#222";


    /* Main stem */

    rect(
        x + 11,
        y,
        14,
        54,
        color
    );


    /* Left branch */

    rect(
        x,
        y + 27,
        15,
        8,
        color
    );

    rect(
        x,
        y + 18,
        8,
        17,
        color
    );


    /* Right branch */

    rect(
        x + 21,
        y + 34,
        16,
        8,
        color
    );

    rect(
        x + 29,
        y + 24,
        8,
        18,
        color
    );
}


/* =========================================
   CLOUD
========================================= */

function drawCloud(cloud) {

    ctx.fillStyle =
        "#ededed";


    ctx.beginPath();


    ctx.arc(
        cloud.x + 15,
        cloud.y + 14,
        12,
        0,
        Math.PI * 2
    );


    ctx.arc(
        cloud.x + 33,
        cloud.y + 9,
        17,
        0,
        Math.PI * 2
    );


    ctx.arc(
        cloud.x + 52,
        cloud.y + 15,
        12,
        0,
        Math.PI * 2
    );


    ctx.fill();


    rect(
        cloud.x + 10,
        cloud.y + 13,
        50,
        15,
        "#ededed"
    );
}


/* =========================================
   CREATE CACTUS
========================================= */

function createCactus() {

    const large =
        Math.random() > 0.3;


    obstacles.push({

        x:
            WIDTH + 40,

        width:
            large
                ? 60
                : 38,

        height:
            large
                ? 78
                : 54,

        large:
            large

    });
}


/* =========================================
   COLLISION
========================================= */

function collision(cactus) {

    /*
        SMALL DINO HITBOX
    */

    const dinoLeft =
        dino.x + 8;


    const dinoRight =
        dino.x + 50;


    const dinoTop =
        dino.y + 22;


    const dinoBottom =
        dino.y + 74;


    const cactusLeft =
        cactus.x + 8;


    const cactusRight =
        cactus.x +
        cactus.width -
        8;


    const cactusTop =
        GROUND -
        cactus.height +
        6;


    const cactusBottom =
        GROUND;


    return (

        dinoLeft <
        cactusRight &&

        dinoRight >
        cactusLeft &&

        dinoTop <
        cactusBottom &&

        dinoBottom >
        cactusTop

    );
}


/* =========================================
   JUMP
========================================= */

function jump() {

    if (dead) {

        restart();

        return;
    }


    if (!dino.jumping) {

        dino.velocity =
            -JUMP_POWER;

        dino.jumping =
            true;
    }
}


/* =========================================
   SEND HIGH SCORE
========================================= */

function sendHighScore() {

    if (
        window.opener
    ) {

        window.opener.postMessage(

            {

                type:
                    "DINO_HIGH_SCORE",

                score:
                    highScore

            },

            "*"
        );
    }
}


/* =========================================
   UPDATE
========================================= */

function update(dt) {

    if (dead) {
        return;
    }


    /* Dino physics */

    dino.y +=
        dino.velocity *
        dt;


    dino.velocity +=
        GRAVITY *
        dt;


    const floor =
        GROUND - 75;


    if (
        dino.y >= floor
    ) {

        dino.y =
            floor;

        dino.velocity =
            0;

        dino.jumping =
            false;
    }


    /* Cactuses */

    for (
        let i =
            obstacles.length - 1;

        i >= 0;

        i--
    ) {

        const cactus =
            obstacles[i];


        cactus.x -=
            speed *
            dt;


        /* Collision */

        if (
            collision(cactus)
        ) {

            dead =
                true;

            return;
        }


        /*
            Player passed cactus.
        */

        if (
            cactus.x <
            -100
        ) {

            obstacles.splice(
                i,
                1
            );


            score++;


            /*
                UPDATE HIGH SCORE
            */

            if (
                score >
                highScore
            ) {

                highScore =
                    score;


                sendHighScore();
            }


            /*
                Speed increases
                every 10 points.
            */

            if (
                score % 10 === 0
            ) {

                speed +=
                    0.2;
            }
        }
    }


    /* Clouds */

    for (
        let i =
            clouds.length - 1;

        i >= 0;

        i--
    ) {

        clouds[i].x -=
            1.1 *
            dt;


        if (
            clouds[i].x <
            -100
        ) {

            clouds.splice(
                i,
                1
            );
        }
    }


    /* Cactus spawn */

    obstacleTimer -=
        dt *
        16.67;


    if (
        obstacleTimer <= 0
    ) {

        createCactus();


        obstacleTimer =
            1100 +
            Math.random() *
            800;
    }


    /* Cloud spawn */

    cloudTimer -=
        dt *
        16.67;


    if (
        cloudTimer <= 0
    ) {

        clouds.push({

            x:
                WIDTH + 50,

            y:
                40 +
                Math.random() *
                100

        });


        cloudTimer =
            2500 +
            Math.random() *
            2500;
    }
}


/* =========================================
   DRAW
========================================= */

function draw() {

    ctx.clearRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );


    /* Background */

    rect(
        0,
        0,
        WIDTH,
        HEIGHT,
        "#ffffff"
    );


    /* Clouds */

    for (
        const cloud of clouds
    ) {

        drawCloud(
            cloud
        );
    }


    /* Ground */

    rect(
        0,
        GROUND,
        WIDTH,
        3,
        "#222"
    );


    /* Ground details */

    for (
        let x = 0;

        x < WIDTH;

        x += 90
    ) {

        rect(
            x + 20,
            GROUND + 10,
            18,
            2,
            "#dddddd"
        );
    }


    /* Cactuses */

    for (
        const cactus of obstacles
    ) {

        if (
            cactus.large
        ) {

            drawLargeCactus(
                cactus
            );

        } else {

            drawSmallCactus(
                cactus
            );
        }
    }


    /* Dino */

    drawDino();


    /* =====================================
       HIGH SCORE
    ===================================== */

    ctx.textAlign =
        "left";

    ctx.textBaseline =
        "alphabetic";

    ctx.font =
        "18px Arial, Helvetica, sans-serif";

    ctx.fillStyle =
        "#333333";


    ctx.fillText(
        "HI " +
        String(highScore)
            .padStart(5, "0"),

        20,

        28
    );


    /* =====================================
       CURRENT SCORE
    ===================================== */

    ctx.textAlign =
        "right";


    ctx.fillText(

        String(score)
            .padStart(5, "0"),

        WIDTH - 20,

        28
    );


    /* =====================================
       GAME OVER
    ===================================== */

    if (dead) {

        ctx.fillStyle =
            "rgba(255,255,255,0.95)";


        ctx.fillRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );


        ctx.textAlign =
            "center";


        ctx.fillStyle =
            "#222";


        ctx.font =
            "bold 32px Arial, Helvetica, sans-serif";


        ctx.fillText(
            "GAME OVER",

            WIDTH / 2,

            125
        );


        ctx.font =
            "16px Arial, Helvetica, sans-serif";


        ctx.fillStyle =
            "#555";


        ctx.fillText(

            "Press SPACE or tap to restart",

            WIDTH / 2,

            155

        );
    }
}


/* =========================================
   RESTART
========================================= */

function restart() {

    obstacles = [];

    clouds = [];

    score = 0;

    speed = 6;

    dead = false;


    dino.y =
        GROUND - 75;


    dino.velocity =
        0;


    dino.jumping =
        false;


    obstacleTimer =
        800;


    cloudTimer =
        1000;
}


/* =========================================
   KEYBOARD
========================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (

            event.code ===
                "Space" ||

            event.code ===
                "ArrowUp"

        ) {

            event.preventDefault();

            jump();
        }

    }
);


/* =========================================
   MOUSE / TOUCH
========================================= */

canvas.addEventListener(
    "pointerdown",
    function() {

        jump();

    }
);


/* =========================================
   GAME LOOP
========================================= */

function gameLoop(time) {

    let dt =
        (time - lastTime) /
        16.67;


    lastTime =
        time;


    if (
        dt > 2
    ) {

        dt = 2;
    }


    update(dt);

    draw();


    requestAnimationFrame(
        gameLoop
    );
}


/* =========================================
   START
========================================= */

restart();


requestAnimationFrame(
    gameLoop
);

<\/script>

</body>

</html>

`);

            gameWindow.document.close();

            gameWindow.focus();

        }
    );

</script>

</body>
</html>
