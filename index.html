<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Offline Dino Game</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden}body.dark{background:#111;color:#fff}#appearance{position:fixed;top:18px;right:18px;z-index:20;width:40px;height:40px;display:grid;place-items:center;border:0;border-radius:8px;background:transparent;color:#111;padding:0;cursor:pointer;box-shadow:none}body.dark #appearance{color:#fff}#appearance:hover{transform:translateY(-1px);background:transparent}#appearance:active{transform:translateY(0)}#appearance svg{width:23px;height:23px;display:block;fill:currentColor}#wrap{position:relative;width:min(1100px,96vw);text-align:center}canvas{display:block;width:100%;height:auto;image-rendering:pixelated;background:inherit}#scoreboard{position:absolute;top:10px;right:16px;display:flex;align-items:center;gap:22px;color:inherit;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:600;letter-spacing:1.5px;font-variant-numeric:tabular-nums;line-height:1;pointer-events:none;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}#hiscore{opacity:.68}#gameover{position:absolute;left:50%;top:82px;transform:translateX(-50%);display:none;z-index:5;pointer-events:none;color:inherit;text-align:center;font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}#gameover.show{display:block}#gameover-title{font-size:30px;font-weight:600;letter-spacing:.2px;line-height:1.1}#gameover-subtitle{margin-top:8px;font-size:16px;font-weight:400;letter-spacing:.1px;opacity:.78}#help{margin-top:12px;font-size:13px;line-height:1.5;opacity:.65}.key{border:1px solid currentColor;border-radius:3px;padding:1px 5px;font-weight:bold}
</style>
</head>
<body>
<button id="appearance" type="button" aria-label="Switch to dark mode" title="Dark mode"></button>
<div id="wrap">
<div id="scoreboard"><span id="hiscore">HI 00000</span><span id="currentscore">00000</span></div>
<div id="gameover"><div id="gameover-title">GAME OVER</div><div id="gameover-subtitle">Tap SPACE to restart</div></div>
<canvas id="game" width="900" height="300"></canvas>
<div id="help">Press <span class="key">SPACE</span> to jump</div>
</div>
<script>
"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const W=900,H=300,G=250,DPR=Math.min(devicePixelRatio||1,2);canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);ctx.imageSmoothingEnabled=false;
let appearance=localStorage.getItem("dinoAppearance")||"white";
const appearanceButton=document.getElementById("appearance"),hiScoreEl=document.getElementById("hiscore"),currentScoreEl=document.getElementById("currentscore"),gameOverEl=document.getElementById("gameover");
const moonIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.7 15.5A8.5 8.5 0 0 1 8.5 3.3 9 9 0 1 0 20.7 15.5Z"/></svg>';
const sunIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7.25A4.75 4.75 0 1 0 12 16.75 4.75 4.75 0 0 0 12 7.25ZM12 1.5a1 1 0 0 1 1 1V4a1 1 0 1 1-2 0V2.5a1 1 0 0 1 1-1Zm0 17.5a1 1 0 0 1 1 1v1.5a1 1 0 1 1-2 0V20a1 1 0 0 1 1-1ZM4.22 3.51a1 1 0 0 1 1.41 0l1.06 1.06A1 1 0 0 1 5.28 5.98L4.22 4.92a1 1 0 0 1 0-1.41Zm12.37 12.37a1 1 0 0 1 1.41 0l1.06 1.06a1 1 0 0 1-1.41 1.41l-1.06-1.06a1 1 0 0 1 0-1.41ZM1.5 12a1 1 0 0 1 1-1H4a1 1 0 1 1 0 2H2.5a1 1 0 0 1-1-1Zm17.5 0a1 1 0 0 1 1-1h1.5a1 1 0 1 1 0 2H20a1 1 0 0 1-1-1ZM4.22 19.49a1 1 0 0 1 0-1.41l1.06-1.06a1 1 0 1 1 1.41 1.41l-1.06 1.06a1 1 0 0 1-1.41 0ZM16.59 7.02a1 1 0 0 1 0-1.41l1.06-1.06a1 1 0 1 1 1.41 1.41L18 7.02a1 1 0 0 1-1.41 0Z"/></svg>';
function theme(){const dark=appearance==="black";document.body.classList.toggle("dark",dark);appearanceButton.innerHTML=dark?sunIcon:moonIcon;appearanceButton.setAttribute("aria-label",dark?"Switch to light mode":"Switch to dark mode");appearanceButton.title=dark?"Light mode":"Dark mode"}
appearanceButton.onclick=()=>{appearance=appearance==="white"?"black":"white";localStorage.setItem("dinoAppearance",appearance);theme();draw()};theme();
function colors(){return appearance==="black"?{bg:"#111",fg:"#fff",line:"#444"}:{bg:"#fff",fg:"#111",line:"#ddd"}}
let score=0,highScore=0,distance=0,speed=6,gameOver=false,last=performance.now();
const dino={x:90,w:58,h:70,y:G-70,vy:0,jumping:false};
let cactuses=[],cactusTimer=850;
function saveScore(){if(score>highScore)highScore=score}
function updateScoreboard(){hiScoreEl.textContent="HI "+String(highScore).padStart(5,"0");currentScoreEl.textContent=String(score).padStart(5,"0")}
function resetDino(){dino.y=G-dino.h;dino.vy=0;dino.jumping=false}
function jump(){if(gameOver){restart();return}if(dino.jumping)return;dino.jumping=true;dino.vy=-13.7;dino.y=G-dino.h}
document.addEventListener("keydown",e=>{if(e.code!=="Space")return;e.preventDefault();if(!e.repeat)jump()});
function spawnCactus(x=W+35){const tall=Math.random()<.32,h=tall?54:40,w=tall?22:20;cactuses.push({x,y:G-h,w,h,tall,variant:Math.floor(Math.random()*3)})}
function rectsHit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function dinoBox(){return{x:dino.x+10,y:dino.y+6,w:dino.w-10,h:dino.h-8}}
function endGame(){gameOver=true;saveScore();updateScoreboard();gameOverEl.classList.add("show")}
function restart(){score=0;distance=0;speed=6;gameOver=false;cactuses=[];cactusTimer=1050;resetDino();updateScoreboard();gameOverEl.classList.remove("show");last=performance.now()}
function update(dt){if(gameOver)return;const s=dt/16.6667;distance+=speed*s;score=Math.floor(distance/100);saveScore();updateScoreboard();speed=Math.min(11,6+score*.025);
if(dino.jumping){dino.y+=dino.vy*s;dino.vy+=.68*s;if(dino.y>=G-dino.h){dino.y=G-dino.h;dino.vy=0;dino.jumping=false}}else dino.y=G-dino.h;
cactusTimer-=dt;if(cactusTimer<=0){spawnCactus();cactusTimer=1000+Math.random()*750}
const box=dinoBox();
for(let i=cactuses.length-1;i>=0;i--){const c=cactuses[i];c.x-=speed*s;if(rectsHit(box,{x:c.x+2,y:c.y+2,w:c.w-4,h:c.h-2})){endGame();return}if(c.x+c.w<-50)cactuses.splice(i,1)}}
function px(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function drawDino(){const C=colors(),x=Math.round(dino.x),y=Math.round(dino.y),f=C.fg,b=C.bg;
// tail + back
px(x-17,y+29,8,5,f);px(x-12,y+26,8,7,f);px(x-7,y+23,9,10,f);px(x-2,y+21,10,14,f);
// torso / belly
px(x+4,y+20,28,40,f);px(x+1,y+31,35,26,f);px(x+8,y+55,24,8,f);
// neck into head
px(x+28,y+14,12,34,f);px(x+35,y+7,24,35,f);px(x+42,y+5,20,27,f);px(x+58,y+10,8,22,f);px(x+63,y+15,10,15,f);
// jaw/snout shaping
px(x+51,y+30,18,7,f);px(x+60,y+27,10,6,f);px(x+67,y+22,8,10,f);
// mouth cut + eye
px(x+61,y+29,11,3,b);px(x+48,y+13,5,5,b);px(x+49,y+13,2,2,f);
// little neck / face gaps for the classic stepped silhouette
px(x+36,y+34,8,6,b);px(x+40,y+40,7,5,b);
// arm
px(x+31,y+43,6,5,f);px(x+36,y+46,7,4,f);px(x+40,y+48,4,3,f);
// hips
px(x+13,y+58,18,5,f);
// legs and feet
px(x+13,y+60,8,10,f);px(x+10,y+68,11,4,f);px(x+28,y+60,8,8,f);px(x+29,y+66,11,5,f);
// leg separation and small pixel notches
px(x+21,y+61,6,7,b);px(x+4,y+56,6,4,b);px(x+29,y+54,5,4,b)}
function drawCactus(c){const C=colors(),x=Math.round(c.x),y=Math.round(c.y),f=C.fg,b=C.bg,w=c.w,h=c.h;
// stepped crown
px(x+4,y,w-8,3,f);px(x+2,y+3,w-4,4,f);px(x,y+7,w,h-7,f);
// central rib cutouts
px(x+5,y+10,3,h-16,b);px(x+w-7,y+12,2,h-19,b);
// left arm
const la=y+Math.round(h*.38);px(x-8,la,8,7,f);px(x-10,la-11,6,18,f);px(x-9,la-14,5,5,f);px(x-5,la+1,5,3,b);
// right arm
const ra=y+Math.round(h*.55);px(x+w,ra,9,7,f);px(x+w+5,ra-13,6,20,f);px(x+w+6,ra-16,5,5,f);px(x+w+1,ra+1,5,3,b);
// vertical highlights/notches matching pixel-art cactus ribs
px(x+Math.floor(w/2)-1,y+6,2,h-10,b);px(x+2,y+h-7,4,3,b);px(x+w-6,y+h-10,3,3,b);
// occasional extra tiny side branch detail
if(c.variant===1){px(x-5,y+Math.round(h*.68),5,5,f);px(x-7,y+Math.round(h*.62),4,10,f)}
if(c.variant===2&&c.tall){px(x+w,y+Math.round(h*.28),6,5,f);px(x+w+3,y+Math.round(h*.20),4,10,f)}}
function draw(){const C=colors();ctx.clearRect(0,0,W,H);ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);ctx.strokeStyle=C.line;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,G+.5);ctx.lineTo(W,G+.5);ctx.stroke();ctx.strokeStyle=C.line;ctx.lineWidth=1;for(let x=20;x<W;x+=90){ctx.beginPath();ctx.moveTo(x,G+7);ctx.lineTo(x+18,G+7);ctx.stroke()};drawDino();cactuses.forEach(drawCactus)}
function loop(now){const dt=Math.min(40,now-last);last=now;update(dt);draw();requestAnimationFrame(loop)}
resetDino();updateScoreboard();draw();requestAnimationFrame(loop);
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script>
</body>
</html>
