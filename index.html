    w.document.open();

    w.document.write(`
<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>Dino</title>

<style>

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: white;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

canvas {
    width: 900px;
    height: 300px;
    max-width: 96vw;
    image-rendering: pixelated;
}

</style>

</head>

<body>

<canvas
    id="game"
    width="900"
    height="300">
</canvas>

<script>

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

ctx.imageSmoothingEnabled = false;


/* =========================================
   GAME SETTINGS
========================================= */

const WIDTH = 900;
const HEIGHT = 300;

const GROUND = 255;


/*
    MUCH HIGHER JUMP

    Old:
    around 130px

    New:
    around 180 to 200px
*/

const JUMP_POWER = 17;

const GRAVITY = 0.55;


let dino = {

    x: 90,

    y: GROUND - 70,

    velocity: 0,

    jumping: false

};


let obstacles = [];

let clouds = [];

let score = 0;

let highScore =
    Number(
        localStorage.getItem(
            "dinoHighScore"
        ) || 0
    );


let speed = 6;

let obstacleTimer = 700;

let cloudTimer = 1000;

let dead = false;


/* =========================================
   RECTANGLE HELPER
========================================= */

function box(
    x,
    y,
    width,
    height,
    color = "#222"
) {

    ctx.fillStyle = color;

    ctx.fillRect(
        Math.round(x),
        Math.round(y),
        width,
        height
    );
}


/* =========================================
   NEW DINO
========================================= */

function drawDino() {

    const x = dino.x;
    const y = dino.y;

    const black = "#202020";


    /*
        TAIL

              █
            ███
          ███
    */

    box(
        x - 7,
        y + 36,
        12,
        8,
        black
    );

    box(
        x - 14,
        y + 30,
        12,
        8,
        black
    );

    box(
        x - 20,
        y + 25,
        10,
        7,
        black
    );


    /*
        BODY

        █████████
        █████████
        █████████
    */

    box(
        x + 5,
        y + 27,
        42,
        38,
        black
    );


    /*
        BACK SPIKES
    */

    box(
        x + 8,
        y + 21,
        8,
        8,
        black
    );

    box(
        x + 17,
        y + 17,
        8,
        10,
        black
    );

    box(
        x + 27,
        y + 13,
        8,
        14,
        black
    );


    /*
        NECK
    */

    box(
        x + 35,
        y + 12,
        19,
        35,
        black
    );


    /*
        HEAD
    */

    box(
        x + 38,
        y + 2,
        30,
        30,
        black
    );


    /*
        SNOUT
    */

    box(
        x + 59,
        y + 15,
        18,
        14,
        black
    );

    box(
        x + 68,
        y + 20,
        10,
        9,
        black
    );


    /*
        EYE
    */

    box(
        x + 57,
        y + 8,
        5,
        5,
        "white"
    );


    /*
        MOUTH
    */

    box(
        x + 63,
        y + 27,
        12,
        2,
        "white"
    );


    /*
        ARM
    */

    box(
        x + 25,
        y + 39,
        18,
        7,
        black
    );

    box(
        x + 19,
        y + 43,
        10,
        6,
        black
    );


    /*
        LEFT LEG
    */

    box(
        x + 12,
        y + 58,
        10,
        16,
        black
    );


    /*
        RIGHT LEG
    */

    box(
        x + 34,
        y + 57,
        10,
        17,
        black
    );


    /*
        FEET
    */

    box(
        x + 7,
        y + 70,
        18,
        5,
        black
    );

    box(
        x + 30,
        y + 70,
        19,
        5,
        black
    );
}


/* =========================================
   LARGE CACTUS
========================================= */

function drawLargeCactus(c) {

    const x = c.x;
    const y = GROUND - 78;

    const green = "#222";


    /*
        MAIN STEM
    */

    box(
        x + 18,
        y,
        20,
        78,
        green
    );


    /*
        LEFT ARM

             █
             █
        ██████
    */

    box(
        x + 2,
        y + 35,
        22,
        9,
        green
    );

    box(
        x + 2,
        y + 22,
        9,
        22,
        green
    );


    /*
        RIGHT ARM

             █
             █
        ███████
    */

    box(
        x + 34,
        y + 43,
        24,
        9,
        green
    );

    box(
        x + 49,
        y + 28,
        9,
        24,
        green
    );


    /*
        CACTUS DETAILS
    */

    box(
        x + 22,
        y + 12,
        3,
        25,
        "#444"
    );

    box(
        x + 31,
        y + 45,
        3,
        20,
        "#444"
    );
}


/* =========================================
   SMALL CACTUS
========================================= */

function drawSmallCactus(c) {

    const x = c.x;
    const y = GROUND - 54;

    const green = "#222";


    /*
        MAIN
    */

    box(
        x + 11,
        y,
        14,
        54,
        green
    );


    /*
        LEFT ARM
    */

    box(
        x,
        y + 27,
        15,
        8,
        green
    );

    box(
        x,
        y + 18,
        8,
        17,
        green
    );


    /*
        RIGHT ARM
    */

    box(
        x + 21,
        y + 34,
        16,
        8,
        green
    );

    box(
        x + 29,
        y + 24,
        8,
        18,
        green
    );
}


/* =========================================
   OBSTACLE CREATION
========================================= */

function spawnCactus() {

    const large =
        Math.random() > 0.3;

    obstacles.push({

        x: WIDTH + 30,

        width:
            large ? 60 : 38,

        height:
            large ? 78 : 54,

        large:
            large

    });
}


/* =========================================
   CLOUD
========================================= */

function drawCloud(c) {

    ctx.fillStyle = "#ededed";

    ctx.beginPath();

    ctx.arc(
        c.x + 15,
        c.y + 14,
        12,
        0,
        Math.PI * 2
    );

    ctx.arc(
        c.x + 33,
        c.y + 9,
        17,
        0,
        Math.PI * 2
    );

    ctx.arc(
        c.x + 52,
        c.y + 15,
        12,
        0,
        Math.PI * 2
    );

    ctx.fill();

    box(
        c.x + 10,
        c.y + 13,
        50,
        15,
        "#ededed"
    );
}


/* =========================================
   COLLISION
========================================= */

function collision(c) {

    /*
        THIS IS THE IMPORTANT PART.

        The visible Dino is about 75px wide.

        The collision box is only:

        left  = +5
        right = +48
        top   = +20
        bottom= +73

        Therefore the top decorative
        parts cannot cause invisible hits.
    */

    const dinoLeft =
        dino.x + 5;

    const dinoRight =
        dino.x + 48;

    const dinoTop =
        dino.y + 20;

    const dinoBottom =
        dino.y + 73;


    const cactusLeft =
        c.x + 7;

    const cactusRight =
        c.x + c.width - 7;

    const cactusTop =
        GROUND - c.height + 5;

    const cactusBottom =
        GROUND;


    return (

        dinoLeft < cactusRight &&

        dinoRight > cactusLeft &&

        dinoTop < cactusBottom &&

        dinoBottom > cactusTop

    );
}


/* =========================================
   JUMP
========================================= */

function jump() {

    if (dead) {

        restart();

        return;
    }


    if (!dino.jumping) {

        dino.velocity =
            -JUMP_POWER;

        dino.jumping =
            true;
    }
}


/* =========================================
   UPDATE
========================================= */

function update(dt) {

    if (dead) {
        return;
    }


    /*
        DINO PHYSICS
    */

    dino.y +=
        dino.velocity * dt;

    dino.velocity +=
        GRAVITY * dt;


    const floor =
        GROUND - 75;


    if (dino.y >= floor) {

        dino.y = floor;

        dino.velocity = 0;

        dino.jumping = false;
    }


    /*
        CACTUSES
    */

    for (
        let i = obstacles.length - 1;
        i >= 0;
        i--
    ) {

        const c =
            obstacles[i];


        c.x -=
            speed * dt;


        if (collision(c)) {

            dead = true;

            return;
        }


        if (c.x < -100) {

            obstacles.splice(i, 1);

            score++;


            if (
                score > highScore
            ) {

                highScore =
                    score;

                localStorage.setItem(
                    "dinoHighScore",
                    highScore
                );
            }


            if (
                score % 10 === 0
            ) {

                speed += 0.25;
            }
        }
    }


    /*
        CLOUDS
    */

    for (
        let i = clouds.length - 1;
        i >= 0;
        i--
    ) {

        clouds[i].x -=
            1.1 * dt;


        if (
            clouds[i].x < -100
        ) {

            clouds.splice(i, 1);
        }
    }


    /*
        SPAWN CACTUS
    */

    obstacleTimer -=
        dt * 16.67;


    if (
        obstacleTimer <= 0
    ) {

        spawnCactus();


        obstacleTimer =
            1000 +
            Math.random() * 850;
    }


    /*
        SPAWN CLOUD
    */

    cloudTimer -=
        dt * 16.67;


    if (
        cloudTimer <= 0
    ) {

        clouds.push({

            x: WIDTH + 50,

            y:
                45 +
                Math.random() * 90

        });


        cloudTimer =
            2500 +
            Math.random() * 2500;
    }
}


/* =========================================
   DRAW
========================================= */

function draw() {

    ctx.clearRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );


    /*
        BACKGROUND
    */

    ctx.fillStyle =
        "white";

    ctx.fillRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );


    /*
        CLOUDS
    */

    for (
        const cloud of clouds
    ) {

        drawCloud(cloud);
    }


    /*
        GROUND
    */

    box(
        0,
        GROUND,
        WIDTH,
        3,
        "#222"
    );


    /*
        GROUND DETAILS
    */

    for (
        let x = 0;
        x < WIDTH;
        x += 90
    ) {

        box(
            x + 20,
            GROUND + 10,
            18,
            2,
            "#ddd"
        );
    }


    /*
        CACTUSES
    */

    for (
        const c of obstacles
    ) {

        if (c.large) {

            drawLargeCactus(c);

        } else {

            drawSmallCactus(c);
        }
    }


    /*
        DINO
    */

    drawDino();


    /*
        SCORE
    */

    ctx.font =
        "18px monospace";

    ctx.fillStyle =
        "#333";

    ctx.textAlign =
        "left";

    ctx.fillText(
        "HI " +
        String(highScore)
            .padStart(5, "0"),
        20,
        28
    );


    ctx.textAlign =
        "right";

    ctx.fillText(
        String(score)
            .padStart(5, "0"),
        WIDTH - 20,
        28
    );


    /*
        GAME OVER
    */

    if (dead) {

        ctx.fillStyle =
            "rgba(255,255,255,0.94)";

        ctx.fillRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );


        ctx.textAlign =
            "center";


        ctx.fillStyle =
            "#222";

        ctx.font =
            "bold 34px Arial";


        ctx.fillText(
            "GAME OVER",
            WIDTH / 2,
            125
        );


        ctx.font =
            "16px Arial";

        ctx.fillStyle =
            "#555";


        ctx.fillText(
            "PRESS SPACE OR TAP TO RESTART",
            WIDTH / 2,
            155
        );
    }
}


/* =========================================
   RESTART
========================================= */

function restart() {

    obstacles = [];

    clouds = [];

    score = 0;

    speed = 6;

    dead = false;


    dino.y =
        GROUND - 75;

    dino.velocity =
        0;

    dino.jumping =
        false;


    obstacleTimer =
        700;

    cloudTimer =
        1000;
}


/* =========================================
   INPUT
========================================= */

document.addEventListener(
    "keydown",
    function(e) {

        if (
            e.code === "Space" ||
            e.code === "ArrowUp"
        ) {

            e.preventDefault();

            jump();
        }

    }
);


canvas.addEventListener(
    "pointerdown",
    function() {

        jump();

    }
);


/* =========================================
   GAME LOOP
========================================= */

let last =
    performance.now();


function loop(time) {

    let dt =
        (time - last) / 16.67;

    last = time;


    if (dt > 2) {
        dt = 2;
    }


    update(dt);

    draw();


    requestAnimationFrame(
        loop
    );
}


restart();

requestAnimationFrame(
    loop
);

<\/script>

</body>

</html>
`);

    w.document.close();
    w.focus();
};

</script>
