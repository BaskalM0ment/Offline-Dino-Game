<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dino Game</title>

<style>
html, body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    background: #ffffff;
    color: #111111;
    font-family: Arial, Helvetica, sans-serif;
}

body.dark {
    background: #111111;
    color: #ffffff;
}

#launcher {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
}

button {
    border: 2px solid currentColor;
    border-radius: 8px;
    background: transparent;
    color: inherit;
    font-family: Arial, Helvetica, sans-serif;
    font-weight: bold;
    cursor: pointer;
}

#launch {
    padding: 22px 50px;
    font-size: 21px;
}

#appearance {
    padding: 12px 25px;
    font-size: 16px;
}

button:hover {
    background: #111111;
    color: #ffffff;
}

body.dark button:hover {
    background: #ffffff;
    color: #111111;
}
</style>
</head>

<body>

<div id="launcher">
    <button id="launch">START IN ABOUT:BLANK</button>
    <button id="appearance">APPEARANCE: WHITE</button>
</div>

<script>

const SCORE_KEY = "dinoHighScore";
const APPEARANCE_KEY = "dinoAppearance";

let appearance =
    localStorage.getItem(APPEARANCE_KEY) || "white";


function updateAppearance() {

    if (appearance === "black") {
        document.body.classList.add("dark");
        document.getElementById("appearance").textContent =
            "APPEARANCE: BLACK";
    } else {
        document.body.classList.remove("dark");
        document.getElementById("appearance").textContent =
            "APPEARANCE: WHITE";
    }
}


updateAppearance();


document.getElementById("appearance").onclick = function () {

    appearance =
        appearance === "white"
            ? "black"
            : "white";

    localStorage.setItem(
        APPEARANCE_KEY,
        appearance
    );

    updateAppearance();
};


function getHighScore() {

    const value =
        Number(localStorage.getItem(SCORE_KEY));

    if (!Number.isFinite(value) || value < 0) {
        return 0;
    }

    return Math.floor(value);
}


window.addEventListener("message", function (event) {

    if (
        !event.data ||
        event.data.type !== "DINO_SAVE_SCORE"
    ) {
        return;
    }

    const newScore =
        Number(event.data.score);

    if (
        !Number.isFinite(newScore) ||
        newScore < 0
    ) {
        return;
    }

    const oldScore =
        getHighScore();

    if (newScore > oldScore) {

        localStorage.setItem(
            SCORE_KEY,
            String(Math.floor(newScore))
        );
    }
});


document.getElementById("launch").onclick = function () {

    const gameWindow =
        window.open("about:blank", "_blank");

    if (!gameWindow) {

        alert(
            "Please allow popups for this site."
        );

        return;
    }


    const savedHighScore =
        getHighScore();

    const gameAppearance =
        appearance;


    gameWindow.document.open();


    gameWindow.document.write(
`<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dino</title>

<style>

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, Helvetica, sans-serif;
}

canvas {
    display: block;
    width: 900px;
    height: 300px;
}

</style>
</head>

<body>

<canvas id="game"></canvas>

<script>

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");


const WIDTH = 900;
const HEIGHT = 300;

const GROUND = 255;

const DPR =
    Math.max(
        1,
        window.devicePixelRatio || 1
    );


canvas.width =
    WIDTH * DPR;

canvas.height =
    HEIGHT * DPR;

canvas.style.width =
    WIDTH + "px";

canvas.style.height =
    HEIGHT + "px";


ctx.setTransform(
    DPR,
    0,
    0,
    DPR,
    0,
    0
);


/* ================================
   APPEARANCE
================================ */

const BLACK_MODE =
    "${gameAppearance}" === "black";


const BACKGROUND =
    BLACK_MODE
        ? "#111111"
        : "#ffffff";


const FOREGROUND =
    BLACK_MODE
        ? "#ffffff"
        : "#222222";


const SECONDARY =
    BLACK_MODE
        ? "#aaaaaa"
        : "#555555";


const CLOUD_COLOR =
    BLACK_MODE
        ? "#333333"
        : "#e8e8e8";


const GROUND_DETAIL =
    BLACK_MODE
        ? "#333333"
        : "#dddddd";


document.body.style.background =
    BACKGROUND;


/* ================================
   GAME SETTINGS
================================ */

const GRAVITY = 0.62;

const JUMP_POWER = 12.5;


/*
   Hold Space longer than this:
   duck.

   Tap Space:
   jump.
*/

const DUCK_DELAY = 180;


/*
   Large safety distance between
   flying dinosaurs and cactuses.
*/

const FLYING_CACTUS_GAP = 350;


/* ================================
   DINO
================================ */

const dino = {

    x: 90,

    y:
        GROUND - 75,

    velocity: 0,

    jumping: false,

    ducking: false
};


/* ================================
   SPACE STATE
================================ */

let spaceHeld = false;

let spaceStartTime = 0;

let duckActivated = false;


/* ================================
   SCORE
================================ */

let score = 0;

let highScore =
    ${savedHighScore};


/* ================================
   OBJECTS
================================ */

let obstacles = [];

let flyingDinosaurs = [];

let clouds = [];


/* ================================
   GAME STATE
================================ */

let speed = 6;

let obstacleTimer = 900;

let flyingTimer =
    7000 +
    Math.random() * 5000;

let cloudTimer = 1000;

let dead = false;

let lastTime =
    performance.now();


/* ================================
   SAVE SCORE
================================ */

function saveHighScore() {

    if (!window.opener) {
        return;
    }

    window.opener.postMessage(
        {
            type: "DINO_SAVE_SCORE",
            score: highScore
        },
        "*"
    );
}


/* ================================
   RECTANGLE
================================ */

function rect(
    x,
    y,
    width,
    height,
    color
) {

    ctx.fillStyle = color;

    ctx.fillRect(
        Math.round(x),
        Math.round(y),
        width,
        height
    );
}


/* ================================
   DINO
================================ */

function drawDino() {

    const x = dino.x;
    const y = dino.y;
    const c = FOREGROUND;


    if (!dino.ducking) {

        /* Tail */

        rect(
            x - 7,
            y + 38,
            14,
            8,
            c
        );

        rect(
            x - 15,
            y + 31,
            13,
            8,
            c
        );

        rect(
            x - 21,
            y + 25,
            10,
            7,
            c
        );


        /* Body */

        rect(
            x + 6,
            y + 28,
            41,
            37,
            c
        );


        /* Neck */

        rect(
            x + 35,
            y + 13,
            19,
            32,
            c
        );


        /* Head */

        rect(
            x + 38,
            y + 3,
            30,
            29,
            c
        );


        /* Snout */

        rect(
            x + 58,
            y + 16,
            19,
            13,
            c
        );


        rect(
            x + 67,
            y + 21,
            10,
            8,
            c
        );


        /* Eye */

        rect(
            x + 56,
            y + 8,
            5,
            5,
            BACKGROUND
        );


        /* Mouth */

        rect(
            x + 62,
            y + 27,
            12,
            2,
            BACKGROUND
        );


        /* Legs */

        rect(
            x + 12,
            y + 58,
            10,
            17,
            c
        );

        rect(
            x + 35,
            y + 57,
            10,
            18,
            c
        );


        rect(
            x + 7,
            y + 70,
            18,
            5,
            c
        );

        rect(
            x + 31,
            y + 70,
            19,
            5,
            c
        );

        return;
    }


    /* ============================
       DUCKING DINO
    ============================ */

    rect(
        x - 10,
        y + 42,
        16,
        7,
        c
    );

    rect(
        x - 19,
        y + 36,
        12,
        7,
        c
    );


    rect(
        x + 5,
        y + 38,
        45,
        27,
        c
    );


    rect(
        x + 38,
        y + 25,
        30,
        26,
        c
    );


    rect(
        x + 59,
        y + 36,
        20,
        12,
        c
    );


    rect(
        x + 56,
        y + 30,
        5,
        5,
        BACKGROUND
    );


    rect(
        x + 63,
        y + 47,
        12,
        2,
        BACKGROUND
    );


    rect(
        x + 13,
        y + 59,
        10,
        16,
        c
    );

    rect(
        x + 36,
        y + 59,
        10,
        16,
        c
    );


    rect(
        x + 8,
        y + 70,
        18,
        5,
        c
    );

    rect(
        x + 32,
        y + 70,
        19,
        5,
        c
    );
}


/* ================================
   LARGE CACTUS
================================ */

function drawLargeCactus(cactus) {

    const x = cactus.x;
    const y = GROUND - 78;
    const c = FOREGROUND;


    rect(
        x + 18,
        y,
        20,
        78,
        c
    );


    rect(
        x + 2,
        y + 36,
        22,
        9,
        c
    );


    rect(
        x + 2,
        y + 23,
        9,
        22,
        c
    );


    rect(
        x + 34,
        y + 43,
        24,
        9,
        c
    );


    rect(
        x + 49,
        y + 29,
        9,
        23,
        c
    );
}


/* ================================
   SMALL CACTUS
================================ */

function drawSmallCactus(cactus) {

    const x = cactus.x;
    const y = GROUND - 54;
    const c = FOREGROUND;


    rect(
        x + 11,
        y,
        14,
        54,
        c
    );


    rect(
        x,
        y + 27,
        15,
        8,
        c
    );


    rect(
        x,
        y + 18,
        8,
        17,
        c
    );


    rect(
        x + 21,
        y + 34,
        16,
        8,
        c
    );


    rect(
        x + 29,
        y + 24,
        8,
        18,
        c
    );
}


/* ================================
   FLYING DINOSAUR
================================ */

function drawFlyingDinosaur(flying) {

    const x = flying.x;
    const y = flying.y;
    const c = FOREGROUND;


    rect(
        x + 10,
        y + 16,
        38,
        20,
        c
    );


    rect(
        x + 38,
        y + 8,
        27,
        25,
        c
    );


    rect(
        x + 58,
        y + 18,
        18,
        10,
        c
    );


    rect(
        x + 53,
        y + 13,
        4,
        4,
        BACKGROUND
    );


    ctx.fillStyle = c;


    ctx.beginPath();

    ctx.moveTo(
        x + 22,
        y + 19
    );

    ctx.lineTo(
        x + 8,
        y - 2
    );

    ctx.lineTo(
        x + 2,
        y + 19
    );

    ctx.closePath();

    ctx.fill();


    ctx.beginPath();

    ctx.moveTo(
        x + 31,
        y + 19
    );

    ctx.lineTo(
        x + 22,
        y - 8
    );

    ctx.lineTo(
        x + 18,
        y + 17
    );

    ctx.closePath();

    ctx.fill();


    ctx.beginPath();

    ctx.moveTo(
        x + 12,
        y + 20
    );

    ctx.lineTo(
        x - 18,
        y + 7
    );

    ctx.lineTo(
        x - 8,
        y + 25
    );

    ctx.closePath();

    ctx.fill();


    rect(
        x + 18,
        y + 33,
        6,
        8,
        c
    );


    rect(
        x + 39,
        y + 33,
        6,
        8,
        c
    );
}


/* ================================
   CLOUD
================================ */

function drawCloud(cloud) {

    ctx.fillStyle =
        CLOUD_COLOR;


    ctx.beginPath();


    ctx.arc(
        cloud.x + 15,
        cloud.y + 14,
        12,
        0,
        Math.PI * 2
    );


    ctx.arc(
        cloud.x + 33,
        cloud.y + 9,
        17,
        0,
        Math.PI * 2
    );


    ctx.arc(
        cloud.x + 52,
        cloud.y + 15,
        12,
        0,
        Math.PI * 2
    );


    ctx.fill();


    rect(
        cloud.x + 10,
        cloud.y + 13,
        50,
        15,
        CLOUD_COLOR
    );
}


/* ================================
   CACTUS SAFETY CHECK
================================ */

function cactusSafeToSpawn(
    x,
    width
) {

    for (
        const flying of flyingDinosaurs
    ) {

        const flyingLeft =
            flying.x -
            FLYING_CACTUS_GAP;


        const flyingRight =
            flying.x +
            flying.width +
            FLYING_CACTUS_GAP;


        const cactusLeft =
            x;


        const cactusRight =
            x + width;


        if (
            cactusRight > flyingLeft &&
            cactusLeft < flyingRight
        ) {

            return false;
        }
    }


    return true;
}


/* ================================
   FLYING DINO SAFETY CHECK
================================ */

function flyingSafeToSpawn(x) {

    for (
        const cactus of obstacles
    ) {

        const cactusLeft =
            cactus.x -
            FLYING_CACTUS_GAP;


        const cactusRight =
            cactus.x +
            cactus.width +
            FLYING_CACTUS_GAP;


        if (
            x < cactusRight &&
            x + 76 > cactusLeft
        ) {

            return false;
        }
    }


    for (
        const flying of flyingDinosaurs
    ) {

        if (
            Math.abs(
                x - flying.x
            ) < 500
        ) {

            return false;
        }
    }


    return true;
}


/* ================================
   CREATE CACTUS
================================ */

function createCactus() {

    const large =
        Math.random() > 0.3;


    const width =
        large
            ? 60
            : 38;


    let x =
        WIDTH + 40;


    let attempts = 0;


    while (
        !cactusSafeToSpawn(
            x,
            width
        ) &&
        attempts < 30
    ) {

        x += 60;

        attempts++;
    }


    if (
        !cactusSafeToSpawn(
            x,
            width
        )
    ) {

        return;
    }


    obstacles.push({

        x: x,

        width: width,

        height:
            large
                ? 78
                : 54,

        large: large
    });
}


/* ================================
   CREATE FLYING DINO
================================ */

function createFlyingDinosaur() {

    let x =
        WIDTH + 350;


    let attempts = 0;


    while (
        !flyingSafeToSpawn(x) &&
        attempts < 40
    ) {

        x += 100;

        attempts++;
    }


    if (
        !flyingSafeToSpawn(x)
    ) {

        return false;
    }


    /*
       Flight heights:

       Low:
       duck.

       Middle:
       jump or duck.

       High:
       easy to avoid.
    */

    const heights = [

        GROUND - 78,

        GROUND - 115,

        GROUND - 150

    ];


    const baseY =
        heights[
            Math.floor(
                Math.random() *
                heights.length
            )
        ];


    flyingDinosaurs.push({

        x: x,

        y: baseY,

        baseY: baseY,

        width: 76,

        height: 45,

        phase:
            Math.random() *
            Math.PI * 2,

        time: 0
    });


    return true;
}


/* ================================
   CACTUS COLLISION
================================ */

function dinoCollisionWithCactus(
    cactus
) {

    let left;
    let right;
    let top;
    let bottom;


    if (dino.ducking) {

        left =
            dino.x + 8;

        right =
            dino.x + 67;

        top =
            dino.y + 38;

        bottom =
            dino.y + 74;

    } else {

        left =
            dino.x + 8;

        right =
            dino.x + 67;

        top =
            dino.y + 5;

        bottom =
            dino.y + 74;
    }


    const cactusLeft =
        cactus.x + 8;


    const cactusRight =
        cactus.x +
        cactus.width -
        8;


    const cactusTop =
        GROUND -
        cactus.height +
        6;


    return (
        left < cactusRight &&
        right > cactusLeft &&
        top < GROUND &&
        bottom > cactusTop
    );
}


/* ================================
   FLYING COLLISION
================================ */

function dinoCollisionWithFlying(
    flying
) {

    let left;
    let right;
    let top;
    let bottom;


    if (dino.ducking) {

        left =
            dino.x + 12;

        right =
            dino.x + 62;

        top =
            dino.y + 43;

        bottom =
            dino.y + 72;

    } else {

        left =
            dino.x + 12;

        right =
            dino.x + 62;

        top =
            dino.y + 10;

        bottom =
            dino.y + 70;
    }


    const flyingLeft =
        flying.x + 10;


    const flyingRight =
        flying.x +
        flying.width -
        10;


    const flyingTop =
        flying.y + 2;


    const flyingBottom =
        flying.y +
        flying.height -
        4;


    return (
        left < flyingRight &&
        right > flyingLeft &&
        top < flyingBottom &&
        bottom > flyingTop
    );
}


/* ================================
   JUMP
================================ */

function jump() {

    if (dead) {

        restart();

        return;
    }


    if (!dino.jumping) {

        dino.velocity =
            -JUMP_POWER;

        dino.jumping =
            true;
    }
}


/* ================================
   SPACE DOWN
================================ */

function spaceDown() {

    if (spaceHeld) {
        return;
    }


    spaceHeld =
        true;


    duckActivated =
        false;


    spaceStartTime =
        performance.now();
}


/* ================================
   SPACE UP
================================ */

function spaceUp() {

    if (!spaceHeld) {
        return;
    }


    const heldTime =
        performance.now() -
        spaceStartTime;


    /*
       If Space was held long enough,
       this was a duck command.
    */

    if (duckActivated) {

        dino.ducking =
            false;

    } else {

        /*
           Short tap = jump.
        */

        jump();
    }


    spaceHeld =
        false;

    duckActivated =
        false;
}


/* ================================
   SPACE UPDATE
================================ */

function updateSpace() {

    if (!spaceHeld) {
        return;
    }


    const heldTime =
        performance.now() -
        spaceStartTime;


    /*
       Hold Space.

       Duck immediately while on ground.

       If the dino is currently jumping,
       it will duck as soon as it lands.
    */

    if (
        heldTime >= DUCK_DELAY
    ) {

        duckActivated =
            true;


        if (
            !dino.jumping
        ) {

            dino.ducking =
                true;
        }
    }
}


/* ================================
   UPDATE
================================ */

function update(dt) {

    if (dead) {
        return;
    }


    updateSpace();


    /* DINO PHYSICS */

    dino.y +=
        dino.velocity *
        dt;


    dino.velocity +=
        GRAVITY *
        dt;


    const floor =
        GROUND - 75;


    if (
        dino.y >= floor
    ) {

        dino.y =
            floor;

        dino.velocity =
            0;

        dino.jumping =
            false;


        /*
           If Space is still being held,
           automatically duck when landing.
        */

        if (
            spaceHeld &&
            duckActivated
        ) {

            dino.ducking =
                true;
        }
    }


    /* CACTUSES */

    for (
        let i =
            obstacles.length - 1;

        i >= 0;

        i--
    ) {

        const cactus =
            obstacles[i];


        cactus.x -=
            speed * dt;


        if (
            dinoCollisionWithCactus(
                cactus
            )
        ) {

            dead =
                true;

            return;
        }


        if (
            cactus.x < -120
        ) {

            obstacles.splice(
                i,
                1
            );


            score++;


            if (
                score >
                highScore
            ) {

                highScore =
                    score;

                saveHighScore();
            }


            if (
                score > 0 &&
                score % 10 === 0
            ) {

                speed +=
                    0.2;
            }
        }
    }


    /* FLYING DINOSAURS */

    for (
        let i =
            flyingDinosaurs.length - 1;

        i >= 0;

        i--
    ) {

        const flying =
            flyingDinosaurs[i];


        flying.x -=
            speed * dt;


        flying.time +=
            0.055 * dt;


        flying.y =
            flying.baseY +
            Math.sin(
                flying.time +
                flying.phase
            ) * 18;


        if (
            dinoCollisionWithFlying(
                flying
            )
        ) {

            dead =
                true;

            return;
        }


        if (
            flying.x < -150
        ) {

            flyingDinosaurs.splice(
                i,
                1
            );
        }
    }


    /* FLYING DINO SPAWN */

    flyingTimer -=
        dt * 16.67;


    if (
        flyingTimer <= 0
    ) {

        const spawned =
            createFlyingDinosaur();


        if (spawned) {

            flyingTimer =
                9000 +
                Math.random() * 7000;

        } else {

            flyingTimer =
                1500;
        }
    }


    /* CACTUS SPAWN */

    obstacleTimer -=
        dt * 16.67;


    if (
        obstacleTimer <= 0
    ) {

        createCactus();


        obstacleTimer =
            1100 +
            Math.random() * 900;
    }


    /* CLOUDS */

    for (
        let i =
            clouds.length - 1;

        i >= 0;

        i--
    ) {

        clouds[i].x -=
            1.1 * dt;


        if (
            clouds[i].x < -100
        ) {

            clouds.splice(
                i,
                1
            );
        }
    }


    cloudTimer -=
        dt * 16.67;


    if (
        cloudTimer <= 0
    ) {

        clouds.push({

            x:
                WIDTH + 50,

            y:
                40 +
                Math.random() * 100
        });


        cloudTimer =
            2500 +
            Math.random() * 2500;
    }
}


/* ================================
   DRAW
================================ */

function draw() {

    ctx.clearRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );


    rect(
        0,
        0,
        WIDTH,
        HEIGHT,
        BACKGROUND
    );


    for (
        const cloud of clouds
    ) {

        drawCloud(cloud);
    }


    rect(
        0,
        GROUND,
        WIDTH,
        3,
        FOREGROUND
    );


    for (
        let x = 0;
        x < WIDTH;
        x += 90
    ) {

        rect(
            x + 20,
            GROUND + 10,
            18,
            2,
            GROUND_DETAIL
        );
    }


    for (
        const cactus of obstacles
    ) {

        if (cactus.large) {

            drawLargeCactus(cactus);

        } else {

            drawSmallCactus(cactus);
        }
    }


    for (
        const flying of flyingDinosaurs
    ) {

        drawFlyingDinosaur(flying);
    }


    drawDino();


    /* SCORE */

    ctx.font =
        "18px Arial, Helvetica, sans-serif";

    ctx.fillStyle =
        FOREGROUND;

    ctx.textBaseline =
        "alphabetic";


    ctx.textAlign =
        "left";


    ctx.fillText(
        "HI " +
        String(highScore)
            .padStart(5, "0"),
        20,
        28
    );


    ctx.textAlign =
        "right";


    ctx.fillText(
        String(score)
            .padStart(5, "0"),
        WIDTH - 20,
        28
    );


    /* GAME OVER */

    if (dead) {

        ctx.fillStyle =
            BLACK_MODE
                ? "rgba(17,17,17,0.95)"
                : "rgba(255,255,255,0.95)";


        ctx.fillRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );


        ctx.textAlign =
            "center";


        ctx.fillStyle =
            FOREGROUND;


        ctx.font =
            "bold 32px Arial, Helvetica, sans-serif";


        ctx.fillText(
            "GAME OVER",
            WIDTH / 2,
            125
        );


        ctx.font =
            "16px Arial, Helvetica, sans-serif";


        ctx.fillStyle =
            SECONDARY;


        ctx.fillText(
            "Press SPACE or tap to restart",
            WIDTH / 2,
            155
        );
    }
}


/* ================================
   RESTART
================================ */

function restart() {

    obstacles = [];

    flyingDinosaurs = [];

    clouds = [];


    score = 0;

    speed = 6;

    dead = false;


    dino.y =
        GROUND - 75;

    dino.velocity =
        0;

    dino.jumping =
        false;

    dino.ducking =
        false;


    spaceHeld =
        false;

    spaceStartTime =
        0;

    duckActivated =
        false;


    obstacleTimer =
        900;


    flyingTimer =
        7000 +
        Math.random() * 5000;


    cloudTimer =
        1000;
}


/* ================================
   KEYBOARD
================================ */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.code === "Space"
        ) {

            event.preventDefault();

            spaceDown();
        }
    }
);


/* ================================
   KEYBOARD RELEASE
================================ */

document.addEventListener(
    "keyup",
    function(event) {

        if (
            event.code === "Space"
        ) {

            event.preventDefault();

            spaceUp();
        }
    }
);


/* ================================
   TOUCH
================================ */

canvas.addEventListener(
    "pointerdown",
    function() {

        if (dead) {

            restart();

        } else {

            jump();
        }
    }
);


/* ================================
   GAME LOOP
================================ */

function gameLoop(time) {

    let dt =
        (time - lastTime) /
        16.67;


    lastTime =
        time;


    if (dt > 2) {
        dt = 2;
    }


    update(dt);

    draw();


    requestAnimationFrame(
        gameLoop
    );
}


/* ================================
   START
================================ */

restart();

requestAnimationFrame(
    gameLoop
);

<\/script>
