<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dino Game</title>

<style>
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    background: #fff;
    color: #222;
    font-family: Arial, Helvetica, sans-serif;
    transition: background 0.2s, color 0.2s;
}

body.dark {
    background: #111;
    color: #fff;
}

#launcher {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
}

button {
    border: 2px solid currentColor;
    border-radius: 8px;
    background: transparent;
    color: inherit;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
}

#launch {
    padding: 18px 40px;
}

#appearance {
    padding: 10px 20px;
    font-size: 15px;
}

button:hover {
    background: #222;
    color: #fff;
}

body.dark button:hover {
    background: #fff;
    color: #111;
}
</style>
</head>

<body>

<div id="launcher">

    <button id="launch">
        START IN ABOUT:BLANK
    </button>

    <button id="appearance">
        APPEARANCE: WHITE
    </button>

</div>

<script>

const SCORE_KEY = "dinoHighScoreV4";
const APPEARANCE_KEY = "dinoAppearance";


/* =========================================
   APPEARANCE
========================================= */

let appearance =
    localStorage.getItem(APPEARANCE_KEY) || "white";


function updateAppearance() {

    if (appearance === "black") {

        document.body.classList.add("dark");

        document.getElementById("appearance").textContent =
            "APPEARANCE: BLACK";

    } else {

        document.body.classList.remove("dark");

        document.getElementById("appearance").textContent =
            "APPEARANCE: WHITE";
    }
}


updateAppearance();


document
    .getElementById("appearance")
    .addEventListener("click", function() {

        appearance =
            appearance === "white"
                ? "black"
                : "white";

        localStorage.setItem(
            APPEARANCE_KEY,
            appearance
        );

        updateAppearance();
    });


/* =========================================
   HIGH SCORE
========================================= */

function getHighScore() {

    const value =
        Number(
            localStorage.getItem(SCORE_KEY)
        );

    if (
        !Number.isFinite(value) ||
        value < 0
    ) {
        return 0;
    }

    return Math.floor(value);
}


/* =========================================
   RECEIVE HIGH SCORE
========================================= */

window.addEventListener("message", function(event) {

    if (!event.data) {
        return;
    }

    if (event.data.type !== "DINO_SAVE_SCORE") {
        return;
    }

    const newScore =
        Number(event.data.score);

    if (
        !Number.isFinite(newScore) ||
        newScore < 0
    ) {
        return;
    }

    const oldScore =
        getHighScore();

    if (newScore > oldScore) {

        localStorage.setItem(
            SCORE_KEY,
            String(Math.floor(newScore))
        );
    }
});


/* =========================================
   LAUNCH GAME
========================================= */

document
    .getElementById("launch")
    .addEventListener("click", function() {

        const gameWindow =
            window.open(
                "about:blank",
                "_blank"
            );

        if (!gameWindow) {

            alert(
                "Please allow popups for this site."
            );

            return;
        }

        const savedHighScore =
            getHighScore();

        const gameAppearance =
            appearance;


        gameWindow.document.open();

        gameWindow.document.write(`

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Dino</title>

<style>

html,
body {

<body>

<canvas id="game"></canvas>


<script>

/* =========================================
   CANVAS
========================================= */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");


const WIDTH = 900;
const HEIGHT = 300;


const DPR =
    Math.max(
        1,
        window.devicePixelRatio || 1
    );


canvas.width =
    WIDTH * DPR;

canvas.height =
    HEIGHT * DPR;


canvas.style.width =
    WIDTH + "px";

canvas.style.height =
    HEIGHT + "px";


ctx.setTransform(
    DPR,
    0,
    0,
    DPR,
    0,
    0
);


/* =========================================
   APPEARANCE
========================================= */

const appearance =
    "${gameAppearance}";


const BLACK_MODE =
    appearance === "black";


const BACKGROUND =
    BLACK_MODE
        ? "#111111"
        : "#ffffff";


const FOREGROUND =
    BLACK_MODE
        ? "#ffffff"
        : "#222222";


const SECONDARY =
    BLACK_MODE
        ? "#bbbbbb"
        : "#555555";


const CLOUD_COLOR =
    BLACK_MODE
        ? "#333333"
        : "#ededed";


const GROUND_DETAIL =
    BLACK_MODE
        ? "#333333"
        : "#dddddd";


document.body.style.background =
    BACKGROUND;


/* =========================================
   SETTINGS
========================================= */

const GROUND = 255;

const GRAVITY = 0.62;

const JUMP_POWER = 12.5;


/* =========================================
   DINO
========================================= */

const dino = {

    x: 90,

    y: GROUND - 75,

    velocity: 0,

    jumping: false,

    ducking: false

};


/* =========================================
   SCORE
========================================= */

let score = 0;

let highScore =
    ${savedHighScore};


/* =========================================
   GAME STATE
========================================= */

let obstacles = [];

let flyingDinosaurs = [];

let clouds = [];


let speed = 6;


/*
    Cactus timer.
*/

let obstacleTimer = 800;


/*
    Flying dinosaur timer.

    Much longer than the cactus timer.
*/

let flyingTimer =
    5000 +
    Math.random() * 3500;


let cloudTimer = 1000;

let dead = false;

let lastTime =
    performance.now();


/* =========================================
   SAVE HIGH SCORE
========================================= */

function saveHighScore() {

    if (!window.opener) {
        return;
    }

    window.opener.postMessage(

        {
            type: "DINO_SAVE_SCORE",
            score: highScore
        },

        "*"
    );
}


/* =========================================
   RECTANGLE
========================================= */

function rect(
    x,
    y,
    width,
    height,
    color
) {

    ctx.fillStyle = color;

    ctx.fillRect(
        Math.round(x),
        Math.round(y),
        width,
        height
    );
}


/* =========================================
   DINO
========================================= */

function drawDino() {

    const x = dino.x;
    const y = dino.y;

    const c = FOREGROUND;


    /*
        Normal Dino
    */

    if (!dino.ducking) {

        /* Tail */

        rect(
            x - 7,
            y + 38,
            14,
            8,
            c
        );

        rect(
            x - 15,
            y + 31,
            13,
            8,
            c
        );

        rect(
            x - 21,
            y + 25,
            10,
            7,
            c
        );


        /* Body */

        rect(
            x + 6,
            y + 28,
            41,
            37,
            c
        );


        /* Spikes */

        rect(
            x + 8,
            y + 22,
            8,
            8,
            c
        );

        rect(
            x + 18,
            y + 17,
            8,
            10,
            c
        );

        rect(
            x + 28,
            y + 13,
            8,
            14,
            c
        );


        /* Neck */

        rect(
            x + 35,
            y + 13,
            19,
            32,
            c
        );


        /* Head */

        rect(
            x + 38,
            y + 3,
            30,
            29,
            c
        );


        /* Snout */

        rect(
            x + 58,
            y + 16,
            19,
            13,
            c
        );

        rect(
            x + 67,
            y + 21,
            10,
            8,
            c
        );


        /* Eye */

        rect(
            x + 56,
            y + 8,
            5,
            5,
            BACKGROUND
        );


        /* Mouth */

        rect(
            x + 62,
            y + 27,
            12,
            2,
            BACKGROUND
        );


        /* Arm */

        rect(
            x + 25,
            y + 40,
            18,
            7,
            c
        );

        rect(
            x + 19,
            y + 44,
            10,
            6,
            c
        );


        /* Legs */

        rect(
            x + 12,
            y + 58,
            10,
            17,
            c
        );

        rect(
            x + 35,
            y + 57,
            10,
            18,
            c
        );


        /* Feet */

        rect(
            x + 7,
            y + 70,
            18,
            5,
            c
        );

        rect(
            x + 31,
            y + 70,
            19,
            5,
            c
        );

        return;
    }


    /*
        DUCKING DINO

        The body becomes lower.
    */


    /* Tail */

    rect(
        x - 10,
        y + 42,
        16,
        7,
        c
    );

    rect(
        x - 19,
        y + 36,
        12,
        7,
        c
    );


    /* Low body */

    rect(
        x + 5,
        y + 38,
        45,
        27,
        c
    );


    /* Head */

    rect(
        x + 38,
        y + 25,
        30,
        26,
        c
    );


    /* Snout */

    rect(
        x + 59,
        y + 36,
        20,
        12,
        c
    );


    /* Eye */

    rect(
        x + 56,
        y + 30,
        5,
        5,
        BACKGROUND
    );


    /* Mouth */

    rect(
        x + 63,
        y + 47,
        12,
        2,
        BACKGROUND
    );


    /* Arm */

    rect(
        x + 25,
        y + 45,
        19,
        7,
        c
    );


    /* Legs */

    rect(
        x + 13,
        y + 59,
        10,
        16,
        c
    );

    rect(
        x + 36,
        y + 59,
        10,
        16,
        c
    );


    /* Feet */

    rect(
        x + 8,
        y + 70,
        18,
        5,
        c
    );

    rect(
        x + 32,
        y + 70,
        19,
        5,
        c
    );
}


/* =========================================
   LARGE CACTUS
========================================= */

function drawLargeCactus(cactus) {

    const x = cactus.x;

    const y =
        GROUND - 78;

    const c =
        FOREGROUND;


    rect(
        x + 18,
        y,
        20,
        78,
        c
    );


    rect(
        x + 2,
        y + 36,
        22,
        9,
        c
    );

    rect(
        x + 2,
        y + 23,
        9,
        22,
        c
    );


    rect(
        x + 34,
        y + 43,
        24,
        9,
        c
    );

    rect(
        x + 49,
        y + 29,
        9,
        23,
        c
    );
}


/* =========================================
   SMALL CACTUS
========================================= */

function drawSmallCactus(cactus) {

    const x = cactus.x;

    const y =
        GROUND - 54;

    const c =
        FOREGROUND;


    rect(
        x + 11,
        y,
        14,
        54,
        c
    );


    rect(
        x,
        y + 27,
        15,
        8,
        c
    );

    rect(
        x,
        y + 18,
        8,
        17,
        c
    );


    rect(
        x + 21,
        y + 34,
        16,
        8,
        c
    );

    rect(
        x + 29,
        y + 24,
        8,
        18,
        c
    );
}


/* =========================================
   FLYING DINOSAUR
========================================= */

function drawFlyingDinosaur(dinoFly) {

    const x =
        dinoFly.x;

    const y =
        dinoFly.y;

    const c =
        FOREGROUND;


    /*
        Body
    */

    rect(
        x + 10,
        y + 16,
        38,
        20,
        c
    );


    /*
        Head
    */

    rect(
        x + 38,
        y + 8,
        27,
        25,
        c
    );


    /*
        Snout
    */

    rect(
        x + 58,
        y + 18,
        18,
        10,
        c
    );


    /*
        Eye
    */

    rect(
        x + 53,
        y + 13,
        4,
        4,
        BACKGROUND
    );


    /*
        Wing 1
    */

    ctx.fillStyle = c;

    ctx.beginPath();

    ctx.moveTo(
        x + 22,
        y + 19
    );

    ctx.lineTo(
        x + 8,
        y - 2
    );

    ctx.lineTo(
        x + 2,
        y + 19
    );

    ctx.closePath();

    ctx.fill();


    /*
        Wing 2
    */

    ctx.beginPath();

    ctx.moveTo(
        x + 31,
        y + 19
    );

    ctx.lineTo(
        x + 22,
        y - 8
    );

    ctx.lineTo(
        x + 18,
        y + 17
    );

    ctx.closePath();

    ctx.fill();


    /*
        Tail
    */

    ctx.beginPath();

    ctx.moveTo(
        x + 12,
        y + 20
    );

    ctx.lineTo(
        x - 18,
        y + 7
    );

    ctx.lineTo(
        x - 8,
        y + 25
    );

    ctx.closePath();

    ctx.fill();


    /*
        Feet
    */

    rect(
        x + 18,
        y + 33,
        6,
        8,
        c
    );

    rect(
        x + 39,
        y + 33,
        6,
        8,
        c
    );
}


/* =========================================
   CLOUD
========================================= */

function drawCloud(cloud) {

    ctx.fillStyle =
        CLOUD_COLOR;


    ctx.beginPath();


    ctx.arc(
        cloud.x + 15,
        cloud.y + 14,
        12,
        0,
        Math.PI * 2
    );


    ctx.arc(
        cloud.x + 33,
        cloud.y + 9,
        17,
        0,
        Math.PI * 2
    );


    ctx.arc(
        cloud.x + 52,
        cloud.y + 15,
        12,
        0,
        Math.PI * 2
    );


    ctx.fill();


    rect(
        cloud.x + 10,
        cloud.y + 13,
        50,
        15,
        CLOUD_COLOR
    );
}


/* =========================================
   CREATE CACTUS
========================================= */

function createCactus() {

    const large =
        Math.random() > 0.3;


    obstacles.push({

        x:
            WIDTH + 40,

        width:
            large
                ? 60
                : 38,

        height:
            large
                ? 78
                : 54,

        large:
            large
    });
}


/* =========================================
   CREATE FLYING DINOSAUR
========================================= */

function createFlyingDinosaur() {

    /*
        Three possible heights.

        LOW:
        You need to duck.

        MID:
        You can jump over it.

        HIGH:
        It passes above the Dino.
    */

    const heights = [

        GROUND - 72,

        GROUND - 115,

        GROUND - 145

    ];


    const selectedHeight =
        heights[
            Math.floor(
                Math.random() *
                heights.length
            )
        ];


    flyingDinosaurs.push({

        x:
            WIDTH + 60,

        y:
            selectedHeight,

        baseY:
            selectedHeight,

        width:
            76,

        height:
            45,

        phase:
            Math.random() *
            Math.PI * 2,

        time:
            0

    });
}


/* =========================================
   DINO COLLISION
========================================= */

function dinoCollisionWithCactus(
    cactus
) {

    let dinoLeft;
    let dinoRight;
    let dinoTop;
    let dinoBottom;


    /*
        Smaller hitbox while ducking.
    */

    if (dino.ducking) {

        dinoLeft =
            dino.x + 8;

        dinoRight =
            dino.x + 67;

        dinoTop =
            dino.y + 37;

        dinoBottom =
            dino.y + 74;

    } else {

        dinoLeft =
            dino.x + 8;

        dinoRight =
            dino.x + 67;

        dinoTop =
            dino.y + 5;

        dinoBottom =
            dino.y + 74;
    }


    const cactusLeft =
        cactus.x + 8;

    const cactusRight =
        cactus.x +
        cactus.width -
        8;

    const cactusTop =
        GROUND -
        cactus.height +
        6;

    const cactusBottom =
        GROUND;


    return (

        dinoLeft <
        cactusRight &&

        dinoRight >
        cactusLeft &&

        dinoTop <
        cactusBottom &&

        dinoBottom >
        cactusTop
    );
}


/* =========================================
   FLYING DINO COLLISION
========================================= */

function dinoCollisionWithFlying(
    flying
) {

    let dinoLeft;
    let dinoRight;
    let dinoTop;
    let dinoBottom;


    /*
        Ducking gives the player
        a much lower hitbox.
    */

    if (dino.ducking) {

        dinoLeft =
            dino.x + 8;

        dinoRight =
            dino.x + 67;

        dinoTop =
            dino.y + 40;

        dinoBottom =
            dino.y + 74;

    } else {

        dinoLeft =
            dino.x + 8;

        dinoRight =
            dino.x + 67;

        dinoTop =
            dino.y + 5;

        dinoBottom =
            dino.y + 74;
    }


    const flyingLeft =
        flying.x + 5;

    const flyingRight =
        flying.x +
        flying.width -
        5;

    const flyingTop =
        flying.y - 8;

    const flyingBottom =
        flying.y +
        flying.height;


    return (

        dinoLeft <
        flyingRight &&

        dinoRight >
        flyingLeft &&

        dinoTop <
        flyingBottom &&

        dinoBottom >
        flyingTop
    );
}


/* =========================================
   JUMP
========================================= */

function jump() {

    if (dead) {

        restart();

        return;
    }


    if (!dino.jumping) {

        dino.velocity =
            -JUMP_POWER;

        dino.jumping =
            true;
    }
}


/* =========================================
   DUCK
========================================= */

function setDucking(value) {

    if (dead) {
        return;
    }


    /*
        You cannot duck while
        jumping.
    */

    if (
        value &&
        !dino.jumping
    ) {

        dino.ducking =
            true;

    } else if (!value) {

        dino.ducking =
            false;
    }
}


/* =========================================
   UPDATE
========================================= */

function update(dt) {

    if (dead) {
        return;
    }


    /*
    ========================================
    DINO PHYSICS
    ========================================
    */

    dino.y +=
        dino.velocity *
        dt;


    dino.velocity +=
        GRAVITY *
        dt;


    const floor =
        GROUND - 75;


    if (
        dino.y >= floor
    ) {

        dino.y =
            floor;

        dino.velocity =
            0;

        dino.jumping =
            false;
    }


    /*
    ========================================
    CACTUSES
    ========================================
    */

    for (
        let i =
            obstacles.length - 1;

        i >= 0;

        i--
    ) {

        const cactus =
            obstacles[i];


        cactus.x -=
            speed *
            dt;


        if (
            dinoCollisionWithCactus(
                cactus
            )
        ) {

            dead =
                true;

            return;
        }


        /*
            Score when cactus leaves screen.
        */

        if (
            cactus.x < -100
        ) {

            obstacles.splice(
                i,
                1
            );


            score++;


            if (
                score >
                highScore
            ) {

                highScore =
                    score;

                saveHighScore();
            }


            if (
                score > 0 &&
                score % 10 === 0
            ) {

                speed +=
                    0.2;
            }
        }
    }


    /*
    ========================================
    FLYING DINOSAURS
    ========================================
    */

    for (
        let i =
            flyingDinosaurs.length - 1;

        i >= 0;

        i--
    ) {

        const flying =
            flyingDinosaurs[i];


        /*
            Horizontal movement.
        */

        flying.x -=
            speed *
            dt;


        /*
            Smooth vertical movement.

            They move up and down
            instead of staying still.
        */

        flying.time +=
            0.055 * dt;


        flying.y =
            flying.baseY +
            Math.sin(
                flying.time +
                flying.phase
            ) * 18;


        /*
            Collision.
        */

        if (
            dinoCollisionWithFlying(
                flying
            )
        ) {

            dead =
                true;

            return;
        }


        /*
            Remove when off screen.

            Flying dinosaurs do NOT
            increase the score.
        */

        if (
            flying.x < -120
        ) {

            flyingDinosaurs.splice(
                i,
                1
            );
        }
    }


    /*
    ========================================
    FLYING DINO SPAWN
    ========================================
    */

    flyingTimer -=
        dt * 16.67;


    if (
        flyingTimer <= 0
    ) {

        /*
            Only spawn flying dinosaurs
            occasionally.
        */

        createFlyingDinosaur();


        /*
            Long delay between them.
        */

        flyingTimer =
            5000 +
            Math.random() * 4500;
    }


    /*
    ========================================
    CLOUDS
    ========================================
    */

    for (
        let i =
            clouds.length - 1;

        i >= 0;

        i--
    ) {

        clouds[i].x -=
            1.1 *
            dt;


        if (
            clouds[i].x < -100
        ) {

            clouds.splice(
                i,
                1
            );
        }
    }


    /*
    ========================================
    CACTUS SPAWN
    ========================================
    */

    obstacleTimer -=
        dt * 16.67;


    if (
        obstacleTimer <= 0
    ) {

        createCactus();


        obstacleTimer =
            1100 +
            Math.random() * 800;
    }


    /*
    ========================================
    CLOUD SPAWN
    ========================================
    */

    cloudTimer -=
        dt * 16.67;


    if (
        cloudTimer <= 0
    ) {

        clouds.push({

            x:
                WIDTH + 50,

            y:
                40 +
                Math.random() * 100

        });


        cloudTimer =
            2500 +
            Math.random() * 2500;
    }
}


/* =========================================
   DRAW
========================================= */

function draw() {

    ctx.clearRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );


    /*
    BACKGROUND
    */

    rect(
        0,
        0,
        WIDTH,
        HEIGHT,
        BACKGROUND
    );


    /*
    CLOUDS
    */

    for (
        const cloud of clouds
    ) {

        drawCloud(
            cloud
        );
    }


    /*
    GROUND
    */

    rect(
        0,
        GROUND,
        WIDTH,
        3,
        FOREGROUND
    );


    /*
    GROUND DETAILS
    */

    for (
        let x = 0;

        x < WIDTH;

        x += 90
    ) {

        rect(
            x + 20,
            GROUND + 10,
            18,
            2,
            GROUND_DETAIL
        );
    }


    /*
    CACTUSES
    */

    for (
        const cactus of obstacles
    ) {

        if (
            cactus.large
        ) {

            drawLargeCactus(
                cactus
            );

        } else {

            drawSmallCactus(
                cactus
            );
        }
    }


    /*
    FLYING DINOSAURS
    */

    for (
        const flying of flyingDinosaurs
    ) {

        drawFlyingDinosaur(
            flying
        );
    }


    /*
    PLAYER
    */

    drawDino();


    /*
    HIGH SCORE
    */

    ctx.textAlign =
        "left";

    ctx.textBaseline =
        "alphabetic";

    ctx.font =
        "18px Arial, Helvetica, sans-serif";

    ctx.fillStyle =
        FOREGROUND;


    ctx.fillText(

        "HI " +
        String(highScore)
            .padStart(5, "0"),

        20,

        28
    );


    /*
    CURRENT SCORE
    */

    ctx.textAlign =
        "right";


    ctx.fillText(

        String(score)
            .padStart(5, "0"),

        WIDTH - 20,

        28
    );


    /*
    DUCK INDICATOR
    */

    if (
        dino.ducking &&
        !dead
    ) {

        ctx.textAlign =
            "center";

        ctx.font =
            "14px Arial, Helvetica, sans-serif";

        ctx.fillStyle =
            SECONDARY;

        ctx.fillText(
            "DUCK",
            dino.x + 35,
            GROUND + 35
        );
    }


    /*
    GAME OVER
    */

    if (dead) {

        ctx.fillStyle =
            BLACK_MODE
                ? "rgba(17,17,17,0.95)"
                : "rgba(255,255,255,0.95)";


        ctx.fillRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );


        ctx.textAlign =
            "center";


        ctx.fillStyle =
            FOREGROUND;


        ctx.font =
            "bold 32px Arial, Helvetica, sans-serif";


        ctx.fillText(
            "GAME OVER",

            WIDTH / 2,

            125
        );


        ctx.font =
            "16px Arial, Helvetica, sans-serif";


        ctx.fillStyle =
            SECONDARY;


        ctx.fillText(
            "Press SPACE or tap to restart",

            WIDTH / 2,

            155
        );
    }
}


/* =========================================
   RESTART
========================================= */

function restart() {

    obstacles = [];

    flyingDinosaurs = [];

    clouds = [];


    score = 0;

    speed = 6;


    dead = false;


    dino.y =
        GROUND - 75;

    dino.velocity =
        0;

    dino.jumping =
        false;

    dino.ducking =
        false;


    obstacleTimer =
        800;


    /*
        Flying dinosaurs don't
        immediately spawn.
    */

    flyingTimer =
        5000 +
        Math.random() * 3500;


    cloudTimer =
        1000;
}


/* =========================================
   KEYBOARD
========================================= */

document.addEventListener(
    "keydown",
    function(event) {

        /*
            SPACE / UP = JUMP
        */

        if (
            event.code === "Space" ||
            event.code === "ArrowUp"
        ) {

            event.preventDefault();

            jump();

            return;
        }


        /*
            DOWN / S = DUCK
        */

        if (
            event.code === "ArrowDown" ||
            event.code === "KeyS"
        ) {

            event.preventDefault();

            setDucking(true);
        }

    }
);


/* =========================================
   KEY RELEASE
========================================= */

document.addEventListener(
    "keyup",
    function(event) {

        if (
            event.code === "ArrowDown" ||
            event.code === "KeyS"
        ) {

            event.preventDefault();

            setDucking(false);
        }

    }
);


/* =========================================
   TOUCH / MOUSE
========================================= */

canvas.addEventListener(
    "pointerdown",
    function() {

        jump();

    }
);


/* =========================================
   GAME LOOP
========================================= */

function gameLoop(time) {

    let dt =
        (time - lastTime) /
        16.67;


    lastTime =
        time;


    if (dt > 2) {
        dt = 2;
    }


    update(dt);

    draw();


    requestAnimationFrame(
        gameLoop
    );
}


/* =========================================
   START
========================================= */

restart();

requestAnimationFrame(
    gameLoop
);
